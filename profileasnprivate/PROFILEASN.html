<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASN Kelurahan | Modern 2026</title>
  <!-- Font modern & ikon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & VARIABEL PREMIUM ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f7fc;  /* soft background, tidak lagi hitam pekat */
      font-family: 'Inter', sans-serif;
      color: #1e293b;
      overflow-x: hidden;
      padding-bottom: 80px;
      line-height: 1.5;
    }

    h2 {
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.02em;
      text-align: center;
      margin: 2.5rem 0 1.5rem;
      background: linear-gradient(145deg, #0f2b4b, #1e4a6f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== GRID MODERN (fluid) ===== */
    .grid {
      display: grid;
      gap: 32px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    /* ===== VIDEO CARD — ELEGAN & DIMENSI ===== */
    .video-card {
      perspective: 1400px;
      display: flex;
      justify-content: center;
    }

    .video-inner {
      position: relative;
      width: 100%;
      max-width: 260px;
      height: 340px;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    .video-card.active .video-inner {
      transform: rotateY(180deg);
    }

    .video-front,
    .video-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 35px -8px rgba(0,20,40,0.25), 0 0 0 1px rgba(166, 188, 210, 0.2) inset;
    }

    .video-front {
      background: #ffffff;
    }

    .video-front video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: scale 0.4s ease;
    }

    .video-card:not(.active) .video-front:hover video {
      scale: 1.05;
    }

    .video-back {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: rotateY(180deg);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 25px 40px -10px rgba(0,50,90,0.3);
    }

    .video-back h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0b3550;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
      border-left: 5px solid #2b7a9c;
      padding-left: 12px;
    }

    .video-back p {
      font-size: 0.9rem;
      font-weight: 400;
      color: #1e405e;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .video-back p i {
      width: 20px;
      color: #2b7a9c;
      font-size: 1rem;
    }

    /* ===== FOTO CARD — PREMIUM GLASS ===== */
    .photo {
      border-radius: 28px;
      overflow: hidden;
      aspect-ratio: 3/4;
      cursor: pointer;
      box-shadow: 0 25px 40px -18px rgba(1, 48, 87, 0.4);
      transition: all 0.35s ease;
      background: #ffffff;
      border: 1px solid rgba(255,255,255,0.6);
    }

    .photo:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 35px 55px -15px #023b66;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .photo:hover img {
      transform: scale(1.1);
    }

    /* ===== MODAL FOTO ELEGAN ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 45, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .modal img {
      max-width: 85vw;
      max-height: 85vh;
      border-radius: 32px;
      box-shadow: 0 40px 70px rgba(0,15,35,0.5);
      border: 3px solid rgba(255,255,255,0.25);
    }

    .close {
      position: absolute;
      top: 30px;
      right: 45px;
      font-size: 40px;
      font-weight: 300;
      color: white;
      cursor: pointer;
      background: rgba(0,0,0,0.2);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: 0.25s;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .close:hover {
      background: rgba(255,255,255,0.25);
      transform: rotate(90deg);
    }

    /* ===== RUNNING TEXT MODERN (ticker tape) ===== */
    .running-text {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0,70,120,0.2);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 2000;
      box-shadow: 0 -5px 25px rgba(0,40,70,0.1);
    }

    .running-text span {
      white-space: nowrap;
      padding-left: 100%;
      font-size: 1.25rem;
      font-weight: 500;
      color: #0e3b58;
      letter-spacing: 0.5px;
      animation: marquee 32s linear infinite;
    }

    .running-text span i {
      margin: 0 20px;
      color: #1f6e93;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* ===== PINTU POP UP — PREMIUM 2026 ===== */
    #doorOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: auto;
    }

    .door {
      position: absolute;
      width: 100%;
      height: 50%;
      background: radial-gradient(circle at 30% 30%, #a3c6e0, #264e6b);
      box-shadow: inset 0 -10px 40px rgba(0,0,0,0.5);
      transition: transform 1.5s cubic-bezier(0.7, 0, 0.2, 1);
      overflow: hidden;
    }

    .door.top {
      top: 0;
      border-bottom: 2px solid rgba(255,255,255,0.6);
    }

    .door.bottom {
      bottom: 0;
      border-top: 2px solid rgba(255,255,255,0.6);
    }

    .door-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      mix-blend-mode: overlay;
    }

    /* logo kontemporer */
    .center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -160%);
      z-index: 10;
      pointer-events: none;
      transition: transform 1.5s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.5s;
      filter: drop-shadow(0 15px 25px #003755);
    }

    .center-logo img {
      width: 110px;
      border-radius: 0 0 40px 40px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 10px;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      transition: opacity 0.4s ease;
    }

    .center-text button {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255,255,255,0.45);
      color: white;
      padding: 20px 48px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 20px 40px rgba(0,20,40,0.5), 0 0 0 1px rgba(255,255,255,0.3) inset;
      transition: 0.25s;
    }

    .center-text button:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
      border-color: white;
    }

    #doorOverlay.open .door.top {
      transform: translateY(-100%);
    }

    #doorOverlay.open .door.bottom {
      transform: translateY(100%);
    }

    #doorOverlay.open .center-text,
    #doorOverlay.open .center-logo {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      pointer-events: none;
    }

    /* Audio disembunyikan */
    audio { display: none; }

    /* Favicon tetap */
  </style>
  <link rel="icon" type="image/png" href="FOTOWEB/favicon-32x32.png">
</head>
<body>

  <!-- judul lebih segar -->
  <h2><i class="fas fa-id-card" style="margin-right: 12px; color: #1f6e93;"></i> PROFIL ASN KELURAHAN PADANG TERUBUK</h2>
  <div class="container">
    <div class="grid" id="videoGrid"></div>
  </div>

  <h2><i class="fas fa-images" style="margin-right: 12px; color: #1f6e93;"></i> GALERI FOTO</h2>
  <div class="container">
    <div class="grid" id="photoGrid"></div>
  </div>

  <!-- PINTU POP UP DENGAN GAYA BARU -->
  <div id="doorOverlay">
    <div class="door top">
      <img src="FOTOWEB/pintupopup.jpg" class="door-img" alt="pintu">
    </div>
    <div class="center-logo">
      <img src="FOTOWEB/pemko.png" alt="Logo">
    </div>
    <div class="center-text">
      <button onclick="openDoor()"><i class="fas fa-arrow-right-to-bracket" style="margin-right: 10px;"></i> BUKA PORTAL</button>
    </div>
    <div class="door bottom">
      <img src="FOTOWEB/pintupopup.jpg" class="door-img" alt="pintu">
    </div>
  </div>

  <!-- RUNNING TEXT DENGAN IKON -->
  <div class="running-text">
    <span>
      <i class="fas fa-circle-check" style="color:#1f8b4c;"></i> SELAMAT DATANG PROFIL ASN KELURAHAN PADANG TERUBUK — 
      <i class="fas fa-bolt"></i> PELAYANAN ADMINISTRASI SI CEPAT SISTEMATIS CERMAT DAN CEPAT —
      <i class="fas fa-clock"></i> JAM PELAYANAN: SENIN–JUMAT 08.00–16.00 WIB
    </span>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="MUSIK/profileasn.mp3" type="audio/mpeg">
  </audio>

  <!-- MODAL FOTO -->
  <div class="modal" id="modal">
    <span class="close" onclick="closeModal()">✕</span>
    <img id="modalImg" alt="preview">
  </div>

  <script>
    // ========== DATA ==========
    const videos = [
      { files: ["VIDEOPROFILE/f1video1.mp4","VIDEOPROFILE/f1video2.mp4","VIDEOPROFILE/f1video3.mp4"], nama:"TRY HOLLY", jabatan:"Operator Layanan Operasional", golongan:"Pengatur Muda (V)", hp:"+62 821-7008-9590" },
      { files: ["VIDEOPROFILE/f2video1.mp4","VIDEOPROFILE/f2video2.mp4","VIDEOPROFILE/f2video3.mp4"], nama:"SITISALMAH, SE", jabatan:"Kasi PMK", golongan:"Penata Muda Tk. I (III/b)", hp:"+62 813-7191-9501" },
      { files: ["VIDEOPROFILE/f3video1.mp4","VIDEOPROFILE/f3video2.mp4","VIDEOPROFILE/f3video3.mp4"], nama:"JUNI HARDI, S.STP", jabatan:"Plt. Lurah", golongan:"Penata (III/c)", hp:"+62 823-8320-1818" },
      { files: ["VIDEOPROFILE/f4video1.mp4","VIDEOPROFILE/f4video2.mp4","VIDEOPROFILE/f4video3.mp4"], nama:"IMELDA RAHMI, S.Pdi", jabatan:"Plt. Seklur", golongan:"Penata Muda Tk. I (III/b)", hp:"+62 813-6525-6807" },
      { files: ["VIDEOPROFILE/f5video1.mp4","VIDEOPROFILE/f5video2.mp4","VIDEOPROFILE/f5video3.mp4"], nama:"SUKARDIANTO, S.A.P", jabatan:"Kasi KESOS", golongan:"Penata Muda Tk. I (III/b)", hp:"+62 813-7190-6937" }
    ];

    const photos = ["FOTOPROFILEASN/foto1.png","FOTOPROFILEASN/foto2.png","FOTOPROFILEASN/foto3.png","FOTOPROFILEASN/foto4.png","FOTOPROFILEASN/foto5.png"];

    // ========== RENDER VIDEO CARD ==========
    const videoGrid = document.getElementById("videoGrid");

    videos.forEach(v => {
      const card = document.createElement("div");
      card.className = "video-card";

      card.innerHTML = `
        <div class="video-inner">
          <div class="video-front">
            <video muted autoplay playsinline></video>
          </div>
          <div class="video-back">
            <h3>${v.nama}</h3>
            <p><i class="fas fa-briefcase"></i> ${v.jabatan}</p>
            <p><i class="fas fa-layer-group"></i> ${v.golongan}</p>
            <p><i class="fas fa-phone-alt"></i> ${v.hp}</p>
          </div>
        </div>
      `;

      const videoEl = card.querySelector("video");
      let index = 0;

      function playNext() {
        videoEl.src = v.files[index];
        videoEl.load();
        videoEl.play().catch(() => {}); // autoplay policy handled by user click later
      }

      videoEl.addEventListener("ended", () => {
        index = (index + 1) % v.files.length;
        playNext();
      });

      playNext();

      card.addEventListener("click", () => card.classList.toggle("active"));

      videoGrid.appendChild(card);
    });

    // ========== RENDER FOTO ==========
    const photoGrid = document.getElementById("photoGrid");
    photos.forEach(p => {
      const div = document.createElement("div");
      div.className = "photo";
      div.innerHTML = `<img src="${p}" loading="lazy" alt="galeri">`;
      div.addEventListener("click", () => openModal(p));
      photoGrid.appendChild(div);
    });

    // ========== MODAL ==========
    function openModal(src) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modalImg").src = src;
    }
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    // ========== MUSIK DENGAN INTERAKSI SATU KALI ==========
    let started = false;
    document.addEventListener("click", function initAudio() {
      if (started) return;
      const audio = document.getElementById("bgm");
      audio.volume = 0.3;
      audio.play().then(() => {
        started = true;
      }).catch(() => {});
    }, { once: true });

    // ========== BUKA PINTU ==========
    function openDoor() {
      const overlay = document.getElementById("doorOverlay");
      overlay.classList.add("open");
      setTimeout(() => {
        overlay.style.display = "none";
      }, 1600);
    }
  </script>

  <!-- fallback kecil agar tombol pintu berfungsi jika pengguna tidak mengklik sebelumnya -->
  <script>
    (function secondChance() {
      // jika pintu sudah dibuka via tombol, tetap ada musik (user pernah klik)
      const oldOpen = window.openDoor;
      window.openDoor = function() {
        if (!started) {
          const audio = document.getElementById("bgm");
          audio.play().catch(()=>{}); // coba lagi
          started = true;
        }
        oldOpen();
      }
    })();
  </script>
</body>
</html>
