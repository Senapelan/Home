<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Editor Akun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --border: #e6e8ef; --text: #0f172a;
      --text-2: #475569; --muted: #94a3b8; --primary: #4f46e5;
      --success: #10b981; --danger: #ef4444; --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      margin: 0; padding: 24px; color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 800px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }
    h1 { font-size: 20px; margin: 0 0 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sec { background: transparent; color: var(--text-2); border: 1px solid var(--border); margin-top: 8px; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: 0.3s; }
    .toast.show { opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>➕ Tambah User Baru</h1>
      <form id="formUser" onsubmit="event.preventDefault(); simpanUser();">
        <div class="row">
          <div class="form-group">
            <label>Username *</label>
            <input id="f_USERNAME" required placeholder="tanpa spasi" />
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input id="f_PASSWORD" required type="text" />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Nama Lengkap *</label>
            <input id="f_NAMA_LENGKAP" required />
          </div>
          <div class="form-group">
            <label>NIP</label>
            <input id="f_NIP" placeholder="Nomor Induk Pegawai (opsional)" />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Instansi *</label>
            <select id="f_INSTANSI" required onchange="onInstansiChange()">
              <option value="">— pilih instansi —</option>
            </select>
          </div>
          <div class="form-group">
            <label>Jabatan</label>
            <select id="f_JABATAN">
              <option value="">— pilih instansi dulu —</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Pangkat / Golongan</label>
            <select id="f_PANGKAT_GOL">
              <option value="">— pilih pangkat —</option>
            </select>
          </div>
          <div class="form-group">
            <label>Hak Akses</label>
            <select id="f_HAK_AKSES">
              <option value="">— pilih —</option>
              <option>Admin</option>
              <option>User</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Email</label>
            <input id="f_EMAIL" type="email" placeholder="email@contoh.com" />
          </div>
          <div class="form-group">
            <label>Status Akun</label>
            <select id="f_STATUS_AKUN">
              <option>Aktif</option>
              <option>Nonaktif</option>
              <option>Suspend</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn" id="btnSave">💾 Simpan User</button>
        <button type="button" class="btn btn-sec" onclick="window.location.href='dashboard_app_binawidya.html'">Batal</button>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // ========================================================
    // GANTI URL INI DENGAN URL DEPLOYMENT ANDA YANG TERBARU
    // ========================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzzoBeYzYgP2VNW_8-kG1oODZ2cU3iXIvBjJ8POjaKWzAOu4hQDvmgNG2To_ZBOsYL7/exec';

    let MASTER = { instansi: [], jabatan: { kecamatan: [], kelurahan: [] } };

    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + (type || '');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function loadMaster() {
      try {
        const res = await fetch(API_URL + '?action=getMasterDropdown');
        const json = await res.json();
        if (json.ok) {
          MASTER = json.data;
          const sel = document.getElementById('f_INSTANSI');
          sel.innerHTML = '<option value="">— pilih instansi —</option>' + 
            MASTER.instansi.map(i => `<option value="${i.nama}" data-tipe="${i.tipe}">${i.nama}</option>`).join('');
        } else {
          toast('Gagal memuat master: ' + (json.error || 'Unknown'), 'error');
        }
      } catch (e) {
        toast('Gagal terhubung ke server. Cek URL API.', 'error');
      }
    }

    function onInstansiChange() {
      const sel = document.getElementById('f_INSTANSI');
      const tipe = sel.options[sel.selectedIndex].getAttribute('data-tipe');
      const selJab = document.getElementById('f_JABATAN');
      let list = [];
      if (tipe === 'KECAMATAN') list = MASTER.jabatan.kecamatan;
      else if (tipe === 'KELURAHAN') list = MASTER.jabatan.kelurahan;
      
      selJab.innerHTML = '<option value="">— pilih jabatan —</option>' + 
        list.map(j => `<option value="${j}">${j}</option>`).join('');
      onJabatanChange();
    }

    function onJabatanChange() {
      const jab = document.getElementById('f_JABATAN').value;
      const selPangkat = document.getElementById('f_PANGKAT_GOL');
      
      if (jab === 'Pegawai NIB') {
        selPangkat.innerHTML = '<option value="">— (Terkunci NIB) —</option>';
        selPangkat.disabled = true;
        return;
      }
      
      selPangkat.disabled = false;
      const pns = ["Juru Muda (I/a)", "Juru Muda Tingkat I (I/b)", "Juru (I/c)", "Juru Tingkat I (I/d)", "Pengatur Muda (II/a)", "Pengatur Muda Tingkat I (II/b)", "Pengatur (II/c)", "Pengatur Tingkat I (II/d)", "Penata Muda (III/a)", "Penata Muda Tingkat I (III/b)", "Penata (III/c)", "Penata Tingkat I (III/d)", "Pembina (IV/a)", "Pembina Tingkat I (IV/b)", "Pembina Utama Muda (IV/c)", "Pembina Utama Madya (IV/d)", "Pembina Utama (IV/e)"];
      const pppk = ["Juru Tingkat I / IV", "Pengatur Muda / V", "Penata Muda / IX"];
      
      let html = '<option value="">— pilih pangkat —</option>';
      html += '<optgroup label="PNS">' + pns.map(p => `<option value="${p}">${p}</option>`).join('') + '</optgroup>';
      html += '<optgroup label="PPPK">' + pppk.map(p => `<option value="${p}">${p}</option>`).join('') + '</optgroup>';
      selPangkat.innerHTML = html;
    }

    async function simpanUser() {
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const payload = {
        USERNAME: document.getElementById('f_USERNAME').value.trim(),
        PASSWORD: document.getElementById('f_PASSWORD').value.trim(),
        NAMA_LENGKAP: document.getElementById('f_NAMA_LENGKAP').value.trim(),
        NIP: document.getElementById('f_NIP').value.trim(),
        INSTANSI: document.getElementById('f_INSTANSI').value,
        JABATAN: document.getElementById('f_JABATAN').value,
        PANGKAT_GOL: document.getElementById('f_PANGKAT_GOL').value,
        HAK_AKSES: document.getElementById('f_HAK_AKSES').value,
        EMAIL: document.getElementById('f_EMAIL').value.trim(),
        STATUS_AKUN: document.getElementById('f_STATUS_AKUN').value
      };

      if (!payload.USERNAME || !payload.PASSWORD || !payload.NAMA_LENGKAP || !payload.INSTANSI) {
        toast('Isi kolom bertanda * (wajib)', 'error');
        btn.disabled = false; btn.textContent = '💾 Simpan User';
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'add', payload: payload })
        });
        const json = await res.json();
        
        if (json.ok) {
          toast('User berhasil ditambahkan!', 'success');
          document.getElementById('formUser').reset();
          setTimeout(() => window.location.href = 'dashboard_app_binawidya.html', 1500);
        } else {
          toast('Gagal: ' + (json.error || 'Unknown'), 'error');
        }
      } catch (e) {
        toast('Gagal terhubung ke server. Cek URL API / Deployment.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Simpan User';
      }
    }

    // Muat Master Dropdown saat halaman dibuka
    document.addEventListener('DOMContentLoaded', loadMaster);
  </script>
</body>
</html>
