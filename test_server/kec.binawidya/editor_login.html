<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah/Edit Akun — Pusat Data</title>
<style>
  /* Sederhanakan CSS, gunakan style Anda sendiri jika ada */
  body { font-family: 'Inter', sans-serif; background: #f6f7fb; padding: 20px; }
  .card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
  .fg { margin-bottom: 16px; }
  .fg label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
  .fg input, .fg select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e6e8ef; box-sizing: border-box; }
</style>
</head>
<body>

<div class="card">
  <h2>Tambah User Baru</h2>
  
  <div class="fg">
    <label>Instansi *</label>
    <select id="f_instansi" onchange="onInstansiChange()">
      <option value="">-- Pilih Instansi --</option>
    </select>
  </div>

  <div class="fg">
    <label>Jabatan *</label>
    <select id="f_jabatan">
      <option value="">-- Pilih Jabatan --</option>
    </select>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzdIuk_HtGdoB5Ygl8OC1-w3QG2lJadf0qGCoKdxcyIqKa0AShx7oENU9LBLB6jzQw/exec';
let MASTER_DROPDOWN = { instansi: [], jabatan: { kecamatan: [], kelurahan: [] } };

async function loadMasterDropdown() {
  try {
    const res = await fetch(API_URL + '?action=getMasterDropdown');
    const json = await res.json();
    if (json.ok) {
      MASTER_DROPDOWN = json.data;
      
      const selInst = document.getElementById('f_instansi');
      selInst.innerHTML = '<option value="">-- Pilih Instansi --</option>' + 
        MASTER_DROPDOWN.instansi.map(i => `<option value="${i.nama}" data-tipe="${i.tipe}">${i.nama}</option>`).join('');
    }
  } catch (e) {
    console.error('Gagal memuat master:', e);
    alert('Gagal memuat data master dari server.');
  }
}

function onInstansiChange() {
  const selInst = document.getElementById('f_instansi');
  const selectedOption = selInst.options[selInst.selectedIndex];
  const tipe = selectedOption ? selectedOption.dataset.tipe : '';
  
  const selJab = document.getElementById('f_jabatan');
  let listJab = [];
  
  if (tipe === 'KECAMATAN') listJab = MASTER_DROPDOWN.jabatan.kecamatan;
  else if (tipe === 'KELURAHAN') listJab = MASTER_DROPDOWN.jabatan.kelurahan;
  
  selJab.innerHTML = '<option value="">-- Pilih Jabatan --</option>' + 
    listJab.map(j => `<option value="${j}">${j}</option>`).join('');
}

document.addEventListener('DOMContentLoaded', loadMasterDropdown);
</script>

</body>
</html>
