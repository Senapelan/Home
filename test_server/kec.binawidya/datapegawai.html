<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Data Pegawai — Kec. Binawidya</title>

<script>
(function(){
  try {
    const raw = localStorage.getItem('app_session_v1');
    const s = raw ? JSON.parse(raw) : null;
    const valid = s && s.data && s.data.username &&
                  (s.mode === 'long' || !s.expiresAt || Date.now() <= s.expiresAt);
    if (!valid) {
      localStorage.removeItem('app_session_v1');
      location.replace('loginApp.html');
    }
  } catch (_) { location.replace('loginApp.html'); }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f6f7fb;
    --bg-grad:radial-gradient(1200px 600px at 10% -10%,#e0e7ff 0%,transparent 60%),
              radial-gradient(900px 500px at 110% 10%,#fce7f3 0%,transparent 55%),
              #f6f7fb;
    --card:#ffffff;
    --card-2:#fbfcfe;
    --border:#e6e8ef;
    --border-2:#eef0f6;
    --text:#0f172a;
    --text-2:#475569;
    --muted:#94a3b8;
    --primary:#4f46e5;
    --primary-2:#6366f1;
    --primary-soft:#eef2ff;
    --success:#10b981;
    --danger:#ef4444;
    --warn:#f59e0b;
    --warn-soft:#fef3c7;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow:0 4px 14px rgba(15,23,42,.08);
    --shadow-lg:0 20px 50px rgba(15,23,42,.18);
    --radius:18px;
  }
  html[data-theme="dark"]{
    --bg:#0b1020;
    --bg-grad:radial-gradient(1000px 500px at 10% -10%,#1e1b4b 0%,transparent 60%),
              radial-gradient(900px 500px at 110% 10%,#3b0764 0%,transparent 55%),
              #0b1020;
    --card:#111827;
    --card-2:#0f172a;
    --border:#1f2937;
    --border-2:#1a2231;
    --text:#e5e7eb;
    --text-2:#cbd5e1;
    --muted:#64748b;
    --primary:#818cf8;
    --primary-2:#a5b4fc;
    --primary-soft:#1e1b4b;
    --success:#34d399;
    --danger:#f87171;
    --warn:#fbbf24;
    --warn-soft:#451a03;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 6px 20px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{height:100%; overflow-x:hidden}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg-grad);
    margin:0;color:var(--text);min-height:100vh;
    transition:background .4s ease,color .3s ease;
  }

  .wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px}

  /* HEADER */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .head p{margin:6px 0 0;font-size:13px;color:var(--text-2)}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    height:42px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:700;
    border:1px solid var(--border);background:var(--card);color:var(--text-2);
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:inherit;
    box-shadow:var(--shadow-sm);transition:all .15s;
  }
  .btn:hover{background:var(--card-2);color:var(--text)}
  .btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;border-color:transparent;
    box-shadow:0 6px 16px rgba(79,70,229,.3);
  }
  .btn-primary:hover{color:#fff;transform:translateY(-1px)}
  .btn-icon{width:42px;padding:0;justify-content:center;font-size:17px}

  /* FILTER BAR */
  .filterbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;margin-bottom:22px;box-shadow:var(--shadow-sm);
  }
  .search-box{position:relative;flex:1;min-width:200px}
  .search-box input{
    width:100%;padding:11px 14px 11px 40px;border-radius:10px;
    border:1px solid var(--border);background:var(--card-2);
    color:var(--text);font-size:14px;font-family:inherit;
  }
  .search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .filterbar select{
    padding:11px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--card-2);color:var(--text);font-size:13px;font-family:inherit;
    cursor:pointer;min-width:160px;
  }
  .filterbar select:focus{outline:none;border-color:var(--primary)}

  /* STATS */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 16px;font-size:12.5px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;gap:8px;
  }
  .stat .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .stat strong{color:var(--text);font-weight:800}

  /* GROUP */
  .group{margin-bottom:34px}
  .group-head{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
    padding-bottom:10px;border-bottom:2px solid var(--border);
  }
  .group-head .gh-icon{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;display:grid;place-items:center;font-size:18px;
    box-shadow:0 6px 16px rgba(79,70,229,.25);flex-shrink:0;
  }
  .group-head h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .group-head .gh-count{
    margin-left:auto;font-size:12px;font-weight:700;
    background:var(--primary-soft);color:var(--primary);
    padding:4px 10px;border-radius:999px;
  }

  /* CARD GRID */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:16px;
  }
  @media(max-width:720px){ .cards{grid-template-columns:1fr} }

  /* CARD KTP */
  .ktp{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;position:relative;
    display:flex;flex-direction:row;
    transition:transform .18s,box-shadow .18s;
  }
  .ktp:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .ktp::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--primary),var(--primary-2));
  }

  .ktp-photo{
    width:110px;flex-shrink:0;background:var(--card-2);
    display:grid;place-items:center;overflow:hidden;
    position:relative;
  }
  .ktp-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .ktp-photo .initials{
    font-size:28px;font-weight:800;color:var(--primary);
    background:linear-gradient(135deg,#c7d2fe,#e9d5ff);
    width:100%;height:100%;display:grid;place-items:center;
  }
  html[data-theme="dark"] .ktp-photo .initials{
    background:linear-gradient(135deg,#3730a3,#6b21a8);color:#e0e7ff;
  }

  .ktp-body{padding:14px 16px;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .ktp-body .k-nama{
    font-size:14.5px;font-weight:800;color:var(--text);
    line-height:1.3;margin-bottom:2px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .ktp-body .k-row{display:flex;gap:8px;font-size:11.5px;line-height:1.35}
  .ktp-body .k-row .lbl{color:var(--muted);min-width:60px;flex-shrink:0;font-weight:600}
  .ktp-body .k-row .val{color:var(--text-2);font-weight:600;word-break:break-word}
  .ktp-body .k-row.nip .val{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.02em}
  .ktp-body .k-badge{
    display:inline-block;margin-top:6px;align-self:flex-start;
    padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.04em;
    background:var(--primary-soft);color:var(--primary);
  }

  /* STATES */
  .state{
    text-align:center;padding:60px 20px;color:var(--text-2);
  }
  .state .ic{
    width:72px;height:72px;border-radius:22px;margin:0 auto 16px;
    background:var(--primary-soft);display:grid;place-items:center;font-size:32px;
  }
  .state h3{margin:0 0 6px;font-size:16px;font-weight:700;color:var(--text)}
  .state p{margin:0;font-size:13px;color:var(--muted)}

  .spinner{
    width:40px;height:40px;border:4px solid var(--border);
    border-top-color:var(--primary);border-radius:50%;
    animation:spin 1s linear infinite;margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* TOAST */
  .toast{
    position:fixed;bottom:24px;right:24px;padding:14px 20px;
    border-radius:14px;color:#fff;font-size:14px;font-weight:600;
    opacity:0;transform:translateY(20px) scale(.95);
    transition:all .3s;z-index:200;max-width:400px;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:10px;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0) scale(1)}
  .toast.success{background:linear-gradient(135deg,#059669,#10b981)}
  .toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}
  .toast.info{background:linear-gradient(135deg,#2563eb,#4f46e5)}

  /* FOOTER INFO */
  .foot-info{
    text-align:center;margin-top:40px;font-size:12px;color:var(--muted);
  }
  .foot-info .chip{
    display:inline-block;padding:4px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--border);margin:0 4px;
  }

  /* SAFE AREA */
  @media(max-width:820px){
    .wrap{padding-top:calc(16px + env(safe-area-inset-top, 0px))}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <div>
      <h1>🏛️ Data Pegawai</h1>
      <p>Kecamatan Binawidya — tersinkronisasi otomatis dari Sheet USERS & PROFILE</p>
    </div>
    <div class="head-actions">
      <button class="btn btn-primary" onclick="syncNow()" id="btnSync">
        <span>🔄</span> <span>Sinkronkan</span>
      </button>
      <button class="btn btn-icon" onclick="toggleTheme()" id="btnTheme" title="Tema">🌙</button>
    </div>
  </div>

  <div class="filterbar">
    <div class="search-box">
      <input id="qSearch" placeholder="Cari nama, NIP, atau jabatan…" autocomplete="off"/>
    </div>
    <select id="qInstansi">
      <option value="">Semua Instansi</option>
    </select>
  </div>

  <div class="stats" id="stats"></div>

  <div id="content">
    <div class="state">
      <div class="spinner"></div>
      <h3>Memuat data pegawai…</h3>
      <p>Sinkronisasi dengan sheet USERS & PROFILE</p>
    </div>
  </div>

  <div class="foot-info" id="footInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KONFIG
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzG12SiXsrBJ-tBPRZSbyKUcMpizuX16V3tDHzbM3B78IZIcHgjKx2Igg2mRBdS3qa_bw/exec';

let DATA = { master_instansi: [], pegawai: { kecamatan: [], kelurahan: [] } };
let MASTER_JAB = { kecamatan: [], kelurahan: [] };

/* ============================================================
   UTIL
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(v){
  return (v==null?'':v.toString())
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type){
  const el = $('toast');
  const icons = { success:'✓', error:'✕', info:'ℹ' };
  el.innerHTML = '<span>'+(icons[type]||'ℹ')+'</span><span>'+esc(msg)+'</span>';
  el.className = 'toast '+(type||'info')+' show';
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.className = 'toast '+(type||'info'), 3500);
}
function initials(name){
  const s = (name||'?').trim();
  const p = s.split(/\s+/);
  return ((p[0]||'')[0]||'?') + ((p[1]||'')[0]||'');
}

/* ============================================================
   API
   ============================================================ */
async function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API_URL + '?' + qs);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch(_) { throw new Error('Respon bukan JSON: ' + text.slice(0,120)); }
  if (json.ok === false) throw new Error(json.error || 'Gagal');
  return json;
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch(_) { throw new Error('Respon bukan JSON: ' + text.slice(0,120)); }
  if (json.ok === false) throw new Error(json.error || 'Gagal');
  return json;
}

/* ============================================================
   THEME
   ============================================================ */
function initTheme(){
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('btnTheme').textContent = saved === 'dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('btnTheme').textContent = next === 'dark' ? '☀️' : '🌙';
}

/* ============================================================
   LOAD DATA
   ============================================================ */
async function loadData(force){
  $('content').innerHTML =
    '<div class="state"><div class="spinner"></div>'+
    '<h3>Memuat data pegawai…</h3>'+
    '<p>Sinkronisasi dengan sheet USERS & PROFILE</p></div>';

  try {
    const params = { action: 'getDataPegawai' };
    if (force) params.force = '1';
    const res = await apiGet(params);
    DATA = res.data || { master_instansi: [], pegawai: { kecamatan: [], kelurahan: [] } };

    // Isi filter instansi
    fillInstansiFilter();

    // Render
    render();

    if (res.cached) toast('Data dari cache (klik 🔄 untuk sinkron ulang)', 'info');
    else toast('Data berhasil disinkronkan', 'success');

  } catch (err) {
    $('content').innerHTML =
      '<div class="state"><div class="ic">⚠️</div>'+
      '<h3>Gagal memuat data</h3><p>'+esc(err.message)+'</p>'+
      '<button class="btn btn-primary" style="margin-top:16px" onclick="loadData(true)">🔄 Coba Lagi</button></div>';
    toast('Gagal: ' + err.message, 'error');
  }
}

async function syncNow(){
  const btn = $('btnSync');
  btn.disabled = true;
  const old = btn.innerHTML;
  btn.innerHTML = '<span>⏳</span> <span>Menyinkronkan…</span>';
  try {
    await apiPost({ action: 'syncDataPegawai' });
    await loadData(true);
  } catch (err) {
    toast('Gagal sync: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

function fillInstansiFilter(){
  const sel = $('qInstansi');
  const opts = ['<option value="">Semua Instansi</option>'];
  DATA.master_instansi.forEach(mi => {
    opts.push('<option value="'+esc(mi.nama)+'">'+esc(mi.nama)+'</option>');
  });
  sel.innerHTML = opts.join('');
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const q = ($('qSearch').value || '').trim().toLowerCase();
  const instFilter = $('qInstansi').value || '';

  const allPegawai = [...DATA.pegawai.kecamatan, ...DATA.pegawai.kelurahan];

  // Filter
  const filtered = allPegawai.filter(p => {
    if (instFilter && String(p.INSTANSI||'').toLowerCase() !== instFilter.toLowerCase()) return false;
    if (!q) return true;
    const hay = [p.NAMA, p.NIP, p.JABATAN, p.INSTANSI, p.PANGKAT_GOL]
      .map(x => String(x||'').toLowerCase()).join(' ');
    return hay.includes(q);
  });

  // Group by instansi (urutan master)
  const groups = {};
  DATA.master_instansi.forEach(mi => {
    groups[mi.nama] = { instansi: mi, items: [] };
  });
  filtered.forEach(p => {
    const inst = String(p.INSTANSI||'').trim();
    // Cari match master
    let key = null;
    for (const nm in groups) {
      if (nm.toLowerCase() === inst.toLowerCase() ||
          inst.toLowerCase().includes(nm.toLowerCase()) ||
          nm.toLowerCase().includes(inst.toLowerCase())) {
        key = nm; break;
      }
    }
    if (!key) key = inst || 'Lainnya';
    if (!groups[key]) groups[key] = { instansi: { nama: key, tipe: 'LAINNYA', urutan: 9999 }, items: [] };
    groups[key].items.push(p);
  });

  // Stats
  const total = filtered.length;
  const totalKec = filtered.filter(p => {
    const mi = DATA.master_instansi.find(m => m.nama.toLowerCase() === String(p.INSTANSI||'').toLowerCase());
    return mi && mi.tipe === 'KECAMATAN';
  }).length;
  const totalKel = total - totalKec;

  $('stats').innerHTML =
    '<div class="stat"><span class="dot"></span> Total: <strong>'+total+'</strong> pegawai</div>' +
    '<div class="stat"><span class="dot" style="background:#10b981"></span> Kecamatan: <strong>'+totalKec+'</strong></div>' +
    '<div class="stat"><span class="dot" style="background:#f59e0b"></span> Kelurahan: <strong>'+totalKel+'</strong></div>';

  if (total === 0){
    $('content').innerHTML =
      '<div class="state"><div class="ic">📭</div>'+
      '<h3>Tidak ada data</h3>'+
      '<p>'+(q || instFilter ? 'Coba ubah kata kunci / filter instansi.' : 'Belum ada pegawai yang cocok. Pastikan NIP & INSTANSI terisi di sheet USERS/PROFILE.')+'</p></div>';
    return;
  }

  // Render groups
  const sortedGroups = Object.values(groups)
    .filter(g => g.items.length > 0)
    .sort((a, b) => (a.instansi.urutan||9999) - (b.instansi.urutan||9999));

  let html = '';
  sortedGroups.forEach(g => {
    const isKec = (g.instansi.tipe||'').toUpperCase() === 'KECAMATAN';
    const icon = isKec ? '🏛️' : '🏢';

    // Sort items by URUTAN_JABATAN then NAMA
    const items = g.items.slice().sort((a, b) => {
      const ua = Number(a.URUTAN_JABATAN) || 999;
      const ub = Number(b.URUTAN_JABATAN) || 999;
      if (ua !== ub) return ua - ub;
      return String(a.NAMA||'').localeCompare(String(b.NAMA||''), 'id');
    });

    html += '<div class="group">'+
      '<div class="group-head">'+
        '<div class="gh-icon">'+icon+'</div>'+
        '<h2>'+esc(g.instansi.nama)+'</h2>'+
        '<div class="gh-count">'+items.length+' pegawai</div>'+
      '</div>'+
      '<div class="cards">'+
        items.map(renderKTP).join('')+
      '</div>'+
    '</div>';
  });

  $('content').innerHTML = html;

  $('footInfo').innerHTML =
    '<span class="chip">Terakhir sync: '+new Date().toLocaleString('id-ID')+'</span>';

  // Update badge label jabatan
  updateJabatanLabels();
}

function renderKTP(p){
  const foto = String(p.FOTO_URL||'').trim();
  const nama = String(p.NAMA||'-').trim();
  const nip = String(p.NIP||'-').trim();
  const jab = String(p.JABATAN||'-').trim();
  const pang = String(p.PANGKAT_GOL||'-').trim();
  const inst = String(p.INSTANSI||'-').trim();
  const alamat = String(p.ALAMAT||'-').trim();

  const fotoHtml = foto
    ? '<img src="'+esc(foto)+'" alt="'+esc(nama)+'" onerror="this.parentNode.innerHTML=\'<div class=&quot;initials&quot;>'+esc(initials(nama))+'</div>\'"/>'
    : '<div class="initials">'+esc(initials(nama))+'</div>';

  return '<div class="ktp">'+
    '<div class="ktp-photo">'+fotoHtml+'</div>'+
    '<div class="ktp-body">'+
      '<div class="k-nama">'+esc(nama)+'</div>'+
      '<div class="k-row nip"><span class="lbl">NIP</span><span class="val">'+esc(nip)+'</span></div>'+
      '<div class="k-row"><span class="lbl">Jabatan</span><span class="val">'+esc(jab)+'</span></div>'+
      '<div class="k-row"><span class="lbl">Pangkat</span><span class="val">'+esc(pang)+'</span></div>'+
      '<div class="k-row"><span class="lbl">Instansi</span><span class="val">'+esc(inst)+'</span></div>'+
      '<div class="k-row"><span class="lbl">Alamat</span><span class="val">'+esc(alamat)+'</span></div>'+
      '<div class="k-badge">'+esc(p.LABEL_JABATAN||'Lainnya')+'</div>'+
    '</div>'+
  '</div>';
}

function updateJabatanLabels(){
  // Placeholder — label sudah dari backend
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  $('qSearch').addEventListener('input', render);
