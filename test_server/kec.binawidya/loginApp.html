<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Form Data</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }

  .container {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 550px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  /* ====================== KOTAK LOGO (KIRI) ====================== */
  .logo-box {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    transition: width 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    z-index: 2;
  }

  .container.active .logo-box { width: 50%; }

  .logo-box img.logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    margin-bottom: 25px;
    border-radius: 50%;
    background: #fff;
    padding: 5px;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }

  .logo-box h1 {
    font-size: 28px;
    margin-bottom: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .logo-box p {
    font-size: 14px;
    margin-bottom: 30px;
    opacity: 0.9;
    line-height: 1.7;
    max-width: 340px;
  }

  .btn-open {
    padding: 14px 45px;
    background: #fff;
    color: #667eea;
    border: none;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.35s;
    letter-spacing: 1px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: pulse 2s infinite;
  }

  .btn-open:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 0 0 0 rgba(255,255,255,0.6); }
    50%     { box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 0 0 15px rgba(255,255,255,0); }
  }

  /* ====================== KOTAK FORM LOGIN (KANAN) ====================== */
  .form-box {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    z-index: 1;
    transform: translateX(-100%);
    opacity: 0;
    transition: transform 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55),
                opacity 0.5s ease;
  }

  .container.active .form-box {
    transform: translateX(0);
    opacity: 1;
  }

  .form-box form { width: 100%; }

  .form-box h2 {
    font-size: 30px;
    color: #333;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-box .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 25px;
  }

  .input-group {
    position: relative;
    margin-bottom: 22px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    background: #f8f9fa;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
  }

  .input-group input:focus {
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
  }

  .input-group label {
    position: absolute;
    top: -10px;
    left: 12px;
    background: #fff;
    padding: 0 6px;
    font-size: 12px;
    color: #667eea;
    font-weight: 500;
  }

  /* ===== REMEMBER ME ===== */
  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: -6px;
    margin-bottom: 14px;
    user-select: none;
  }
  .remember-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #667eea;
    cursor: pointer;
    flex-shrink: 0;
  }
  .remember-row label {
    font-size: 13px;
    color: #555;
    cursor: pointer;
    line-height: 1.4;
  }
  .remember-row label small {
    display: block;
    color: #999;
    font-size: 11px;
    margin-top: 2px;
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(102,126,234,0.4);
  }

  .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

  .message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .message.error   { background:#fee; color:#c33; border:1px solid #fcc; display:block; }
  .message.success { background:#efe; color:#3c3; border:1px solid #cfc; display:block; }

  .btn-back {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    color: #999;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .btn-back:hover { color: #667eea; }

  /* ====================== RESPONSIVE ====================== */
  @media (max-width: 768px) {
    .container { height: 640px; }

    .container.active .logo-box {
      width: 100%;
      height: 220px;
      border-radius: 20px 20px 0 0;
    }

    .logo-box img.logo { width: 70px; height: 70px; margin-bottom: 8px; }
    .logo-box h1 { font-size: 18px; margin-bottom: 6px; }
    .logo-box p  { font-size: 12px; margin-bottom: 10px; }

    .form-box {
      width: 100% !important;
      height: calc(100% - 220px) !important;
      top: 220px;
      transform: translateY(30px);
      opacity: 0;
      padding: 30px 25px;
    }

    .container.active .form-box {
      transform: translateY(0);
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div class="container" id="container">

  <!-- KOTAK LOGO -->
  <div class="logo-box">
    <img class="logo"
         src="https://www.cyber88.co.id/foto_berita/2022-07-28-warga-harapkan-pj-walikota-lakukan-inventarisasi-aset-kecamatan-binawidya-tampan.jpg"
         alt="Logo" />
    <h1>KECAMATAN BINAWIDYA<br>PUSAT DATA KECAMATAN BINAWIDYA</h1>
    <p>Silakan KLIK untuk Login ke Aplikasi.</p>
    <button type="button" class="btn-open" id="btnOpen">
      KLIK UNTUK LOGIN
    </button>
  </div>

  <!-- KOTAK FORM LOGIN -->
  <div class="form-box">
    <form id="loginForm" autocomplete="off">
      <h2>Login</h2>
      <p class="subtitle">Tulis Username dan password<br>(pastikan anda sudah di konfirmasi Admin)</p>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>

      <div class="input-group">
        <label for="pasword">Password</label>
        <input type="password" id="pasword" name="pasword" required />
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">
          Ingat saya
          <small>tekan ini untuk mengingat login.</small>
        </label>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">LOGIN</button>
      <div class="message" id="message"></div>
      <button type="button" class="btn-back" id="btnBack">← Kembali</button>
    </form>
  </div>

</div>

<script>
/* ============================================================
   KONFIGURASI — GANTI DENGAN URL .exec HASIL DEPLOY Code.gs
   ============================================================ */
const API_URL       = "https://script.google.com/macros/s/AKfycbxi0orwaOONjbrkyyqM-2R7M4vbgU_MSvZK1DCVnMjmkFr251JrtuZWcdGXgR1RpwCQVg/exec";
const DASHBOARD_URL = "dashboard_app_binawidya.html";

/* ============================================================
   SESSION HELPER
   - mode "short"  → expiry 1 jam (untuk PC)
   - mode "long"   → tanpa expiry (Remember me, untuk HP)
   Disimpan di localStorage agar sesi bertahan saat tab ditutup.
   ============================================================ */
const Session = (function () {
  const KEY         = 'app_session_v1';
  const SHORT_TTL   = 60 * 60 * 1000; // 1 jam
  const FIELDS      = [
    'nama_user','username','email','role','id_user',
    'jabatan','kategori','wilayah','no_hp','foto_profil'
  ];

  function _read() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.data || !obj.data.username) {
        localStorage.removeItem(KEY);
        return null;
      }
      // obj.mode === 'short' → cek expiry
      if (obj.mode === 'short' && obj.expiresAt && Date.now() > obj.expiresAt) {
        localStorage.removeItem(KEY);
        return null;
      }
      return obj;
    } catch (_) {
      localStorage.removeItem(KEY);
      return null;
    }
  }

  function _write(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); }
    catch (e) { console.warn('Session: gagal simpan', e); }
  }

  return {
    SHORT_TTL,
    /** Simpan sesi baru.
     *  mode: 'short' (1 jam) atau 'long' (tanpa expiry) */
    set(data, mode) {
      mode = (mode === 'long') ? 'long' : 'short';
      const clean = {};
      FIELDS.forEach(k => clean[k] = (data && data[k] != null) ? String(data[k]) : '');
      _write({
        data: clean,
        mode: mode,
        expiresAt: (mode === 'short') ? (Date.now() + SHORT_TTL) : null,
        createdAt: Date.now()
      });
    },
    get(field) {
      const s = _read();
      if (!s) return null;
      return s.data[field] != null ? s.data[field] : null;
    },
    all() {
      const s = _read();
      return s ? Object.assign({}, s.data) : null;
    },
    mode() {
      const s = _read();
      return s ? s.mode : null;
    },
    setField(field, value) {
      const s = _read();
      if (!s) return false;
      s.data[field] = value == null ? '' : String(value);
      _write(s);
      return true;
    },
    /** Perpanjang expiry — hanya untuk mode 'short' */
    touch() {
      const s = _read();
      if (!s) return false;
      if (s.mode === 'short') {
        s.expiresAt = Date.now() + SHORT_TTL;
        _write(s);
      }
      return true;
    },
    remaining() {
      const s = _read();
      if (!s || s.mode !== 'short' || !s.expiresAt) return 0;
      return Math.max(0, s.expiresAt - Date.now());
    },
    clear() {
      localStorage.removeItem(KEY);
    }
  };
})();

/* ============================================================
   ELEMEN
   ============================================================ */
const container  = document.getElementById("container");
const btnOpen    = document.getElementById("btnOpen");
const btnBack    = document.getElementById("btnBack");
const form       = document.getElementById("loginForm");
const btnLogin   = document.getElementById("btnLogin");
const msgBox     = document.getElementById("message");
const rememberMe = document.getElementById("rememberMe");

/* ============================================================
   AUTO-REDIRECT kalau sesi masih valid (biar user tidak login ulang)
   ============================================================ */
(function autoRedirect() {
  const u = Session.get('username');
  if (u) {
    window.location.replace(DASHBOARD_URL);
  }
})();

/* ============================================================
   INGAT CHECKBOX terakhir (biar konsisten saat login ulang)
   ============================================================ */
try {
  const last = localStorage.getItem('remember_pref');
  if (last === '1') rememberMe.checked = true;
} catch(_) {}

/* ============================================================
   ANIMASI SLIDE
   ============================================================ */
btnOpen.addEventListener("click", () => {
  container.classList.add("active");
  setTimeout(() => document.getElementById("username").focus(), 900);
});

btnBack.addEventListener("click", () => {
  container.classList.remove("active");
  msgBox.className = "message";
  form.reset();
  // restore remember preference
  try {
    if (localStorage.getItem('remember_pref') === '1') rememberMe.checked = true;
  } catch(_) {}
});

/* ============================================================
   TAMPILKAN PESAN
   ============================================================ */
function showMessage(text, type) {
  msgBox.textContent = text;
  msgBox.className = "message " + type;
}

/* ============================================================
   SUBMIT LOGIN
   ============================================================ */
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const pasword  = document.getElementById("pasword").value.trim();
  const remember = rememberMe.checked;

  if (!username || !pasword) {
    showMessage("Username dan Password wajib diisi", "error");
    return;
  }

  btnLogin.disabled = true;
  btnLogin.textContent = "MEMPROSES...";
  msgBox.className = "message";

  try {
    const res = await fetch(API_URL, {
      method : "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body   : JSON.stringify({ action: "login", username, pasword })
    });

    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    console.log("Response:", data);

    if (data.success) {
      showMessage("Login berhasil! Mengalihkan...", "success");

      // Simpan sesi: remember = mode 'long' (tanpa expiry), else 'short' (1 jam)
      Session.set({
        nama_user:   data.nama_user   || "",
        username:    data.username    || username,
        email:       data.email       || "",
        role:        data.role        || "User",
        id_user:     data.id_user     || "",
        jabatan:     data.jabatan     || "",
        kategori:    data.kategori    || "",
        wilayah:     data.wilayah     || "",
        no_hp:       data.no_hp       || "",
        foto_profil: data.foto_profil || ""
      }, remember ? 'long' : 'short');

      // Simpan preferensi checkbox untuk login berikutnya
      try { localStorage.setItem('remember_pref', remember ? '1' : '0'); } catch(_) {}

      setTimeout(() => { window.location.href = DASHBOARD_URL; }, 700);
    } else {
      showMessage(data.message || "Login gagal", "error");
      btnLogin.disabled = false;
      btnLogin.textContent = "LOGIN";
    }

  } catch (err) {
    console.error("Error detail:", err);
    showMessage("Koneksi gagal: " + err.message, "error");
    btnLogin.disabled = false;
    btnLogin.textContent = "LOGIN";
  }
});
</script>

</body>
</html>
