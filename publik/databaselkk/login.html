<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance · LKK Kecamatan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f2f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 48px 36px;
      box-shadow: 0 20px 48px rgba(0, 20, 40, 0.10);
      text-align: center;
    }

    .icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0b2236;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 16px;
      font-weight: 500;
      color: #1f4970;
      background: #eaf1f8;
      display: inline-block;
      padding: 4px 24px;
      border-radius: 40px;
      margin-bottom: 24px;
    }

    .message {
      background: #f8fafc;
      padding: 28px 20px;
      border-radius: 24px;
      border: 1px solid #e9eef3;
      margin-bottom: 28px;
    }

    .message p {
      font-size: 18px;
      color: #1a3852;
      line-height: 1.7;
    }

    .message .thanks {
      font-size: 20px;
      font-weight: 600;
      color: #0c2b44;
      margin-top: 12px;
    }

    .message .thanks span {
      background: #1d4a73;
      color: white;
      padding: 2px 20px;
      border-radius: 40px;
      display: inline-block;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 14px 40px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      background: white;
      color: #1f4970;
      border: 1px solid #cbdae7;
      transition: 0.15s;
      min-width: 140px;
      cursor: default;
    }

    .btn-primary {
      background: #1d4a73;
      border-color: #1d4a73;
      color: white;
      box-shadow: 0 6px 16px rgba(20, 60, 100, 0.15);
    }

    .btn-outline {
      background: transparent;
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #7a94aa;
      border-top: 1px solid #e6edf5;
      padding-top: 20px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 20px;
        border-radius: 24px;
      }
      .icon {
        font-size: 56px;
      }
      h1 {
        font-size: 24px;
      }
      .message p {
        font-size: 16px;
      }
      .message .thanks {
        font-size: 17px;
      }
      .btn {
        width: 100%;
        min-width: unset;
        padding: 14px 20px;
      }
      .btn-group {
        flex-direction: column;
        width: 100%;
      }
    }

    @media (hover: hover) {
      .btn {
        cursor: pointer;
      }
      .btn-primary:hover {
        background: #123a5a;
        transform: scale(1.02);
      }
      .btn-outline:hover {
        background: #f0f6fc;
        border-color: #1f4970;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="icon" aria-hidden="true">🔧</span>

    <h1>LKK Kecamatan</h1>
    <div class="sub">⚡ Maintenance | Pemeliharaan</div>

    <div class="message">
      <p>Sistem sedang dalam pemeliharaan.<br>Kami akan kembali segera.</p>
      <div class="thanks">
        <span>🙏 Terima kasih</span>
      </div>
    </div>

    <div class="btn-group">
      <div class="btn btn-primary" role="button">🔄 Refresh</div>
      <div class="btn btn-outline" role="button">📞 Hubungi</div>
    </div>

    <div class="footer">LKK Kecamatan · Sistem Pendataan</div>
  </main>

</body>
</html>
