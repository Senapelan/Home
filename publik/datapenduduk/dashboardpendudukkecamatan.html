    <title>Dashboard Monografi Kecamatan Senapelan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-content img {
            height: 50px;
            width: auto;
            background: white;
            border-radius: 0 0 30px 30px;
            padding: 2px;
        }

        .header-content h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header-content p {
            font-size: 14px;
            opacity: 0.9;
        }

        .date-display {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
        }

        /* Tab Bar */
        .tab-bar {
            background: #f0f2f5;
            padding: 10px 10px 0 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border-bottom: 2px solid #667eea;
        }

        .tab-item {
            background: #e4e6e9;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            border: 1px solid transparent;
            border-bottom: none;
        }

        .tab-item i {
            font-size: 12px;
            color: #999;
        }

        .tab-item:hover {
            background: #d8dadf;
            color: #333;
        }

        .tab-item.active {
            background: white;
            color: #667eea;
            border-color: #667eea;
            border-bottom: 2px solid white;
            margin-bottom: -2px;
            font-weight: 600;
        }

        .tab-item.active i {
            color: #667eea;
        }

        .tab-item .close-tab {
            margin-left: 5px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .tab-item .close-tab:hover {
            opacity: 1;
            color: #e74c3c;
        }

        .add-tab {
            background: transparent;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px dashed #667eea;
            border-bottom: none;
        }

        .add-tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        /* Tab Content */
        .tab-content {
            padding: 25px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Filter Kecamatan (Global) */
        .kecamatan-filter {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 20px;
            color: white;
        }

        .kecamatan-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kecamatan-title i {
            font-size: 20px;
        }

        .kecamatan-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .kecamatan-group {
            flex: 1;
            min-width: 300px;
        }

        .kecamatan-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
        }

        .btn-kecamatan {
            background: white;
            color: #ee5a24;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            height: 45px;
        }

        .btn-kecamatan:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Filter Wilayah (Kelurahan, RW, RT) */
        .wilayah-filter {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 25px;
            color: white;
        }

        .wilayah-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wilayah-title i {
            font-size: 20px;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.9;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            background: white;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .select-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            pointer-events: none;
        }

        .select-wrapper select:disabled {
            background: #e0e0e0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-filter {
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            height: 45px;
            margin-top: 24px;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-filter i {
            font-size: 16px;
        }

        /* Summary Cards */
        .summary-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .summary-card {
            flex: 1;
            min-width: 150px;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }

        .summary-card .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        /* Info Data */
        .data-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            color: #333;
        }

        .data-info span:first-child {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .data-info span:last-child {
            font-size: 16px;
            color: #667eea;
        }

        /* Tabel Container */
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background: white;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 500;
            font-size: 12px;
            padding: 12px 8px;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            color: #333;
            text-align: center;
        }

        td:first-child {
            font-weight: 600;
            background: #f8f9ff;
        }

        tr:last-child {
            background: #f8f9ff;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
            border-top: 2px solid #667eea;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .empty-table {
            text-align: center;
            padding: 50px !important;
            color: #999;
        }

        /* Footer */
        .footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-content {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Loading Spinner */
        .loading-spinner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner-wrapper {
            background: white;
            padding: 30px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .circular-spinner {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 10px auto 25px;
        }

        .progress-ring svg {
            width: 160px;
            height: 160px;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            stroke: #e0e0e0;
            stroke-width: 8;
            fill: none;
        }

        .progress-ring-fill {
            stroke: url(#gradient);
            stroke-width: 8;
            fill: none;
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            transition: stroke-dashoffset 0.3s;
        }

        .spinner-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 800;
            color: #667eea;
            background: rgba(255, 255, 255, 0.9);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .spinner-status {
            font-size: 18px;
            color: #333;
            margin: 15px 0 5px;
            font-weight: 700;
        }

        .spinner-substatus {
            font-size: 14px;
            color: #666;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #27ae60;
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1001;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #e74c3c;
        }

        @media (max-width: 768px) {
            .tab-item {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .filter-row {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .btn-filter {
                width: 100%;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <img src="https://senapelan.github.io/Home/data/foto/LOGOPEMKOT.png" alt="Logo Kota Pekanbaru">
                <div>
                    <h1>Dashboard Monografi Kependudukan</h1>
                    <p>Kecamatan Senapelan - Tahun 2026</p>
                </div>
            </div>
            <div class="date-display" id="currentDate"></div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar" id="tabBar"></div>

        <!-- Tab Content Container -->
        <div id="tab-contents-container"></div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-content">
                <p>© 2026 Dashboard Monografi Kependudukan - Kecamatan Senapelan</p>
                <p style="font-size: 12px; margin-top: 5px;">Data diperbarui secara real-time dari Data Base Senapelan</p>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner-container" id="loadingSpinner">
        <div class="spinner-wrapper">
            <svg width="0" height="0">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#667eea"/>
                        <stop offset="100%" stop-color="#764ba2"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="circular-spinner">
                <div class="progress-ring">
                    <svg viewBox="0 0 200 200">
                        <circle class="progress-ring-bg" cx="100" cy="100" r="60"/>
                        <circle class="progress-ring-fill" cx="100" cy="100" r="60" id="progressCircle"/>
                    </svg>
                </div>
                <div class="spinner-percentage" id="spinnerPercent">0</div>
            </div>
            <div class="spinner-status" id="spinnerStatus">Memuat Data</div>
            <div class="spinner-substatus" id="spinnerSubStatus">Mengambil data dari server...</div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <span id="notificationMessage">Data berhasil dimuat!</span>
    </div>

    <script>
        // Konfigurasi
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwD3F62WWNXO98bBYyoLx2GbrRLu8L8J0ywejgnndACU8WMAKQlMnbCOPu43NeRrXxi/exec';
        
        // Variabel global
        let allData = [];
        let kelurahanList = [];
        let kecamatanList = [];
        let activeTabs = ['penduduk'];

        // Mapping header spreadsheet ke key yang digunakan
        const HEADER_MAP = {
            'TIMESTAMP': 'TIMESTAMP',
            'KODE KELUARGA': 'KODE_KELUARGA',
            'NOMOR KK': 'NOMOR_KK',
            'NAMA KEPALA KELUARGA': 'NAMA_KEPALA_KELUARGA',
            'ALAMAT': 'ALAMAT',
            'RT': 'RT',
            'RW': 'RW',
            'KELURAHAN/DESA': 'KELURAHAN',
            'KECAMATAN': 'KECAMATAN',
            'KABUPATEN/KOTA': 'KABUPATEN',
            'KODE POS': 'KODE_POS',
            'PROVINSI': 'PROVINSI',
            'KODE ANGGOTA KELUARGA': 'KODE_ANGGOTA',
            'NAMA LENGKAP': 'NAMA_LENGKAP',
            'NIK': 'NIK',
            'JENIS KELAMIN': 'JENIS_KELAMIN',
            'TEMPAT LAHIR': 'TEMPAT_LAHIR',
            'TANGGAL LAHIR': 'TANGGAL_LAHIR',
            'AGAMA': 'AGAMA',
            'PENDIDIKAN': 'PENDIDIKAN',
            'PEKERJAAN': 'PEKERJAAN',
            'STATUS PERKAWINAN': 'STATUS_PERKAWINAN',
            'STATUS HUBUNGAN DALAM KELUARGA': 'STATUS_HUBUNGAN',
            'KEWARGANEGARAAN': 'KEWARGANEGARAAN',
            'NO PASPOR': 'NO_PASPOR',
            'NO KITAS/KITAP': 'NO_KITAS',
            'NAMA AYAH': 'NAMA_AYAH',
            'NAMA IBU': 'NAMA_IBU',
            'SUKU': 'SUKU',
            'STATUS KEKAYAAN': 'STATUS_KEKAYAAN',
            'STATUS KESEHATAN': 'STATUS_KESEHATAN',
            'RIWAYAT PENYAKIT': 'RIWAYAT_PENYAKIT',
            'JENIS PENYAKIT': 'JENIS_PENYAKIT',
            'STATUS KEBERSIHAN': 'STATUS_KEBERSIHAN',
            'NOMOR TELEPON': 'NOMOR_TELEPON',
            'ALAMAT EMAIL': 'EMAIL',
            // Tambahan untuk status domisili, pindah, meninggal (akan ditambahkan nanti)
            'STATUS DOMISILI': 'STATUS_DOMISILI',
            'STATUS PINDAH': 'STATUS_PINDAH',
            'STATUS MENINGGAL': 'STATUS_MENINGGAL'
        };

        // Daftar kelurahan tetap di Kecamatan Senapelan
        const KELURAHAN_SENAPELAN = [
            'SENAPELAN',
            'KAMPUNG BANDAR',
            'KAMPUNG BARU',
            'KAMPUNG DALAM',
            'PADANG BULAN',
            'PADANG TERUBUK',
            'SAGO'
        ];

        // Fungsi untuk format RT/RW ke 3 digit (001)
        function formatRTRW(value) {
            if (!value) return '000';
            // Hapus karakter non-digit
            const digits = value.toString().replace(/\D/g, '');
            // Format ke 3 digit
            return digits.padStart(3, '0');
        }

        // Fungsi untuk membersihkan dan memformat data
        function cleanData(data) {
            return data.map(row => {
                const cleanRow = {};
                
                // Mapping semua field
                for (let key in HEADER_MAP) {
                    const value = row[key] || '';
                    const cleanKey = HEADER_MAP[key];
                    
                    if (key === 'RT' || key === 'RW') {
                        // Format RT dan RW ke 3 digit
                        cleanRow[cleanKey] = formatRTRW(value);
                    } else {
                        cleanRow[cleanKey] = value;
                    }
                }
                
                // Set default values untuk status yang belum ada di database
                cleanRow['STATUS_DOMISILI'] = cleanRow['STATUS_DOMISILI'] || 'DOMISILI';
                cleanRow['STATUS_PINDAH'] = cleanRow['STATUS_PINDAH'] || 'TIDAK';
                cleanRow['STATUS_MENINGGAL'] = cleanRow['STATUS_MENINGGAL'] || 'TIDAK';
                
                return cleanRow;
            });
        }

        // Update tanggal
        function updateCurrentDate() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric'
            };
            document.getElementById('currentDate').innerHTML = 
                '<i class="fas fa-calendar-alt"></i> ' + now.toLocaleDateString('id-ID', options);
        }

        // Show notification
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            const messageSpan = document.getElementById('notificationMessage');
            
            messageSpan.textContent = message;
            
            if (isError) {
                notification.classList.add('error');
            } else {
                notification.classList.remove('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Show loading spinner
        function showLoader(status, subStatus) {
            const spinner = document.getElementById('loadingSpinner');
            document.getElementById('spinnerStatus').textContent = status || 'Memuat Data';
            document.getElementById('spinnerSubStatus').textContent = subStatus || 'Mohon tunggu...';
            document.getElementById('spinnerPercent').textContent = '0';
            
            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 60;
            circle.style.strokeDasharray = circumference;
            circle.style.strokeDashoffset = circumference;
            
            spinner.style.display = 'flex';
            
            // Animasi progress
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                    
                    const offset = circumference - (progress / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                    document.getElementById('spinnerPercent').textContent = Math.floor(progress);
                }
            }, 300);
            
            window.loaderInterval = interval;
        }

        // Hide loading spinner
        function hideLoader(success = true) {
            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 60;
            
            circle.style.strokeDashoffset = 0;
            document.getElementById('spinnerPercent').textContent = '100';
            document.getElementById('spinnerStatus').textContent = success ? '✅ Selesai!' : '❌ Gagal!';
            document.getElementById('spinnerSubStatus').textContent = success ? 'Data berhasil dimuat' : 'Silahkan coba lagi';
            
            clearInterval(window.loaderInterval);
            
            setTimeout(() => {
                document.getElementById('loadingSpinner').style.display = 'none';
            }, 1000);
        }

        // Buat tab content
        function createTabContent(tabId, tabName) {
            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab-content';
            tabDiv.id = `tab-${tabId}`;
            
            // Filter Kecamatan (untuk seluruh kecamatan) - HANYA untuk tab selain DOMISILI
            if (tabId !== 'domisili') {
                const kecamatanFilter = document.createElement('div');
                kecamatanFilter.className = 'kecamatan-filter';
                kecamatanFilter.innerHTML = `
                    <div class="kecamatan-title">
                        <i class="fas fa-globe"></i>

        // Inisialisasi tab
        function initializeTabs() {
            const tabBar = document.getElementById('tabBar');
            const container = document.getElementById('tab-contents-container');
            
            const tabs = [
                { id: 'penduduk', name: 'JUMLAH PENDUDUK', icon: 'fa-users' },
                { id: 'agama', name: 'AGAMA', icon: 'fa-pray' },
                { id: 'pendidikan', name: 'PENDIDIKAN', icon: 'fa-graduation-cap' },
                { id: 'status', name: 'STATUS WARGA', icon: 'fa-heart' },
                { id: 'umur', name: 'UMUR', icon: 'fa-calendar-alt' },
                { id: 'kekayaan', name: 'KEKAYAAN', icon: 'fa-wallet' },
                { id: 'kesehatan', name: 'JAMINAN KESEHATAN', icon: 'fa-heartbeat' },
                { id: 'pekerjaan', name: 'PEKERJAAN', icon: 'fa-briefcase' },
                { id: 'domisili', name: 'DATA DOMISILI', icon: 'fa-home' }
            ];
            
            // Buat tab bar
            tabBar.innerHTML = '';
            tabs.forEach((tab, index) => {
                const tabItem = document.createElement('div');
                tabItem.className = `tab-item ${index === 0 ? 'active' : ''}`;
                tabItem.dataset.tab = tab.id;
                tabItem.onclick = () => switchTab(tab.id);
                tabItem.innerHTML = `
                    <i class="fas ${tab.icon}"></i>
                    ${tab.name}
                    <i class="fas fa-times close-tab" onclick="closeTab('${tab.id}', event)"></i>
                `;
                tabBar.appendChild(tabItem);
            });
            
            // Add "Tampilkan Semua" button
            const addDiv = document.createElement('div');
            addDiv.className = 'add-tab';
            addDiv.onclick = showAllTabs;
            addDiv.innerHTML = '<i class="fas fa-plus"></i> Tampilkan Semua';
            tabBar.appendChild(addDiv);
            
            // Buat tab content
            container.innerHTML = '';
            tabs.forEach(tab => {
                const content = createTabContent(tab.id, tab.name);
                container.appendChild(content);
            });
            
            // Aktifkan tab pertama
            switchTab('penduduk');
            
            // Populate dropdown
            populateKelurahanDropdowns();
            populateKecamatanDropdowns();
        }

        // Populate kecamatan dropdowns
        function populateKecamatanDropdowns() {
            kecamatanList.forEach(kec => {
                document.querySelectorAll('.kecamatan-select').forEach(select => {
                    const option = document.createElement('option');
                    option.value = kec;
                    option.textContent = kec;
                    select.appendChild(option);
                });
            });
        }

        // Switch tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-item').forEach(tab => {
                if (tab.dataset.tab === tabId) {
                    tab.classList.add('active');
                } else if (!tab.classList.contains('add-tab')) {
                    tab.classList.remove('active');
                }
            });
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            // Jika tab domisili, langsung tampilkan data
            if (tabId === 'domisili') {
                displayDomisiliData();
            }
        }

        // Close tab
        function closeTab(tabId, event) {
            event.stopPropagation();
            
            if (activeTabs.length <= 1) {
                showNotification('Minimal harus ada 1 tab yang terbuka!', true);
                return;
            }
            
            const index = activeTabs.indexOf(tabId);
            if (index > -1) {
                activeTabs.splice(index, 1);
            }
            
            const tabItem = document.querySelector(`.tab-item[data-tab="${tabId}"]`);
            if (tabItem) {
                tabItem.remove();
            }
            
            const tabContent = document.getElementById(`tab-${tabId}`);
            if (tabContent) {
                tabContent.remove();
            }
            
            if (activeTabs.length > 0) {
                switchTab(activeTabs[0]);
            }
        }

        // Show all tabs
        function showAllTabs() {
            activeTabs = ['penduduk', 'agama', 'pendidikan', 'status', 'umur', 'kekayaan', 'kesehatan', 'pekerjaan', 'domisili'];
            initializeTabs();
        }

        // Populate kelurahan dropdowns
        function populateKelurahanDropdowns() {
            kelurahanList.forEach(kel => {
                document.querySelectorAll('.kelurahan-select').forEach(select => {
                    const option = document.createElement('option');
                    option.value = kel;
                    option.textContent = kel;
                    select.appendChild(option);
                });
            });
            
            // Add event listeners untuk cascade
            document.querySelectorAll('.kelurahan-select').forEach(select => {
                select.addEventListener('change', function() {
                    const tabId = this.id.replace('kelurahan-', '');
                    loadRW(tabId);
                });
            });
            
            document.querySelectorAll('.rw-select').forEach(select => {
                select.addEventListener('change', function() {
                    const tabId = this.id.replace('rw-', '');
                    loadRT(tabId);
                });
            });
        }

        // Load RW berdasarkan kelurahan
        function loadRW(tabId) {
            const kelurahanSelect = document.getElementById(`kelurahan-${tabId}`);
            const rwSelect = document.getElementById(`rw-${tabId}`);
            const rtSelect = document.getElementById(`rt-${tabId}`);
            
            const kelurahan = kelurahanSelect.value;
            
            // Reset RW dan RT
            rwSelect.innerHTML = '<option value="ALL">-- SEMUA RW --</option>';
            rtSelect.innerHTML = '<option value="ALL">-- SEMUA RT --</option>';
            rwSelect.disabled = true;
            rtSelect.disabled = true;
            
            // Sembunyikan hasil sebelumnya
            document.getElementById(`summary-${tabId}`).style.display = 'none';
            document.getElementById(`info-${tabId}`).style.display = 'none';
            document.getElementById(`table-${tabId}`).style.display = 'none';
            
            if (!kelurahan) return;
            
            // Filter data untuk kelurahan tersebut
            const filtered = allData.filter(row => 
                row['KELURAHAN'] === kelurahan
            );
            
            // Kumpulkan RW unik (sudah dalam format 3 digit)
            const rwSet = new Set();
            filtered.forEach(row => {
                if (row['RW'] && row['RW'] !== '000') {
                    rwSet.add(row['RW']);
                }
            });
            
            const rwList = Array.from(rwSet).sort();
            
            if (rwList.length > 0) {
                rwList.forEach(rw => {
                    const option = document.createElement('option');
                    option.value = rw;
                    option.textContent = `RW ${rw}`;
                    rwSelect.appendChild(option);
                });
                rwSelect.disabled = false;
            }
        }

        // Load RT berdasarkan RW
        function loadRT(tabId) {
            const kelurahanSelect = document.getElementById(`kelurahan-${tabId}`);
            const rwSelect = document.getElementById(`rw-${tabId}`);
            const rtSelect = document.getElementById(`rt-${tabId}`);
            
            const kelurahan = kelurahanSelect.value;
            const rw = rwSelect.value;
            
            // Reset RT
            rtSelect.innerHTML = '<option value="ALL">-- SEMUA RT --</option>';
            rtSelect.disabled = true;
            
            // Sembunyikan hasil sebelumnya
            document.getElementById(`summary-${tabId}`).style.display = 'none';
            document.getElementById(`info-${tabId}`).style.display = 'none';
            document.getElementById(`table-${tabId}`).style.display = 'none';
            
            if (!kelurahan || !rw || rw === 'ALL') return;
            
            // Filter data untuk kelurahan dan RW tersebut
            const filtered = allData.filter(row => 
                row['KELURAHAN'] === kelurahan && 
                row['RW'] === rw
            );
            
            // Kumpulkan RT unik (sudah dalam format 3 digit)
            const rtSet = new Set();
            filtered.forEach(row => {
                if (row['RT'] && row['RT'] !== '000') {
                    rtSet.add(row['RT']);
                }
            });
            
            const rtList = Array.from(rtSet).sort();
            
            if (rtList.length > 0) {
                rtList.forEach(rt => {
                    const option = document.createElement('option');
                    option.value = rt;
                    option.textContent = `RT ${rt}`;
                    rtSelect.appendChild(option);
                });
                rtSelect.disabled = false;
            }
        }

        // Apply filter kecamatan (seluruh kecamatan)
        function applyKecamatanFilter(tabId) {
            const kecamatanSelect = document.getElementById(`kecamatan-${tabId}`);
            const kecamatan = kecamatanSelect.value;
            
            if (!kecamatan) {
                showNotification('Pilih Kecamatan terlebih dahulu!', true);
                return;
            }
            
            showLoader('Memproses Data', `Mengambil data untuk ${kecamatan}...`);
            
            // Filter data untuk kecamatan yang dipilih
            const filteredData = allData.filter(row => row['KECAMATAN'] === kecamatan);
            
            if (filteredData.length === 0) {
                showNotification('Tidak ada data untuk kecamatan ini', true);
                hideLoader(false);
                return;
            }
            
            displayData(tabId, filteredData, `KECAMATAN ${kecamatan}`);
        }

        // Apply filter per wilayah
        function applyFilter(tabId) {
            const kelurahanSelect = document.getElementById(`kelurahan-${tabId}`);
            const rwSelect = document.getElementById(`rw-${tabId}`);
            const rtSelect = document.getElementById(`rt-${tabId}`);
            
            const kelurahan = kelurahanSelect.value;
            const rw = rwSelect.value;
            const rt = rtSelect.value;
            
            if (!kelurahan) {
                showNotification('Pilih Kelurahan terlebih dahulu!', true);
                return;
            }
            
            showLoader('Memproses Data', `Mengambil data untuk ${kelurahan}...`);
            
            // Filter data
            let filteredData = allData.filter(row => row['KELURAHAN'] === kelurahan);
            
            let lokasiText = kelurahan;
            
            // Filter berdasarkan RW jika bukan "ALL"
            if (rw && rw !== 'ALL') {
                filteredData = filteredData.filter(row => row['RW'] === rw);
                lokasiText += ` - RW ${rw}`;
            }
            
            // Filter berdasarkan RT jika bukan "ALL"
            if (rt && rt !== 'ALL' && rw && rw !== 'ALL') {
                filteredData = filteredData.filter(row => row['RT'] === rt);
                lokasiText += ` - RT ${rt}`;
            } else if (rt && rt !== 'ALL' && (!rw || rw === 'ALL')) {
                showNotification('Pilih RW terlebih dahulu sebelum memilih RT!', true);
                hideLoader(false);
                return;
            }
            
            displayData(tabId, filteredData, lokasiText);
        }

        function displayData(tabId, filteredData, lokasiText) {
            // Hitung statistik
            const jumlahKK = filteredData.filter(row => 
                row['STATUS_HUBUNGAN'] === 'KEPALA KELUARGA'
            ).length;
            
            const jumlahJiwa = filteredData.length;
            const jumlahLaki = filteredData.filter(row => row['JENIS_KELAMIN'] === 'LAKI - LAKI').length;
            const jumlahPerempuan = filteredData.filter(row => row['JENIS_KELAMIN'] === 'PEREMPUAN').length;
            
            // Update summary cards
            document.getElementById(`summary-kk-${tabId}`).textContent = jumlahKK;
            document.getElementById(`summary-jiwa-${tabId}`).textContent = jumlahJiwa;
            
            if (tabId === 'penduduk') {
                document.getElementById(`summary-laki-${tabId}`).textContent = jumlahLaki;
                document.getElementById(`summary-perempuan-${tabId}`).textContent = jumlahPerempuan;
            }
            
            document.getElementById(`summary-${tabId}`).style.display = 'flex';
            
            // Update info lokasi
            document.getElementById(`lokasi-${tabId}`).textContent = lokasiText;
            document.getElementById(`total-jiwa-${tabId}`).textContent = `${jumlahJiwa} Jiwa`;
            document.getElementById(`info-${tabId}`).style.display = 'flex';
            
            // Tampilkan data di tabel
            const tbody = document.getElementById(`tbody-${tabId}`);
            tbody.innerHTML = '';
            
            if (tabId === 'penduduk') {
                // Tabel detail penduduk
                filteredData.sort((a, b) => {
                    if (a['STATUS_HUBUNGAN'] === 'KEPALA KELUARGA') return -1;
                    if (b['STATUS_HUBUNGAN'] === 'KEPALA KELUARGA') return 1;
                    return 0;
                });
                
                filteredData.forEach((row, index) => {
                    const umur = hitungUmur(row['TANGGAL_LAHIR']);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${row['NIK'] || '-'}</td>
                        <td style="text-align: left;">${row['NAMA_LENGKAP'] || '-'}</td>
                        <td>${row['JENIS_KELAMIN'] || '-'}</td>
                        <td>${row['TEMPAT_LAHIR'] || '-'}</td>
                        <td>${row['TANGGAL_LAHIR'] || '-'}</td>
                        <td>${umur >= 0 ? umur + ' Tahun' : '-'}</td>
                        <td>${row['STATUS_HUBUNGAN'] || '-'}</td>
                        <td>${row['RW'] || '-'}</td>
                        <td>${row['RT'] || '-'}</td>
                        <td>${row['KELURAHAN'] || '-'}</td>
                        <td>${row['STATUS_DOMISILI'] || 'DOMISILI'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                // Tabel agregasi
                let counts = {};
                
                if (tabId === 'agama') {
                    const agamaList = ['ISLAM', 'KRISTEN', 'KATHOLIK', 'HINDU', 'BUDDHA', 'KONGHUCU'];
                    agamaList.forEach(agama => counts[agama] = 0);
                    
                    filteredData.forEach(row => {
                        const agama = row['AGAMA'];
                        if (counts.hasOwnProperty(agama)) counts[agama]++;
                    });
                } else if (tabId === 'pendidikan') {
                    const pendidikanList = [
                        'TIDAK / BELUM SEKOLAH', 'BELUM TAMAT SD / SEDERAJAT', 'TIDAK TAMAT SD / SEDERAJAT',
                        'TAMAT SD / SEDERAJAT', 'SLTP / SEDERAJAT', 'TIDAK TAMAT SLTP / SEDERAJAT',
                        'SLTA / SEDERAJAT', 'TIDAK TAMAT SLTA / SEDERAJAT', 'DIPLOMA I (D1)',
                        'DIPLOMA II (D2)', 'DIPLOMA III (D3)', 'DIPLOMA IV (D4)', 'STRATA I (S1)',
                        'STRATA II (S2)', 'STRATA III (S3)', 'PAKET A', 'PAKET B', 'PAKET C',
                        'PONDOK PESANTREN', 'PUTUS SEKOLAH'
                    ];
                    pendidikanList.forEach(pend => counts[pend] = 0);
                    
                    filteredData.forEach(row => {
                        const pendidikan = row['PENDIDIKAN'];
                        if (counts.hasOwnProperty(pendidikan)) counts[pendidikan]++;
                    });
                } else if (tabId === 'status') {
                    const statusList = ['KAWIN TERCATAT', 'KAWIN BELUM TERCATAT', 'BELUM KAWIN', 'CERAI HIDUP', 'CERAI MATI'];
                    statusList.forEach(status => counts[status] = 0);
                    
                    filteredData.forEach(row => {
                        const status = row['STATUS_PERKAWINAN'];
                        if (counts.hasOwnProperty(status)) counts[status]++;
                    });
                } else if (tabId === 'umur') {
                    const kategoriUmur = [
                        '0-4 TAHUN (BAYI)', '5-9 TAHUN (ANAK-ANAK)', '10-14 TAHUN (ANAK-ANAK)',
                        '15-19 TAHUN (REMAJA)', '20-24 TAHUN (REMAJA)', '25-29 TAHUN (REMAJA)',
                        '30-34 TAHUN (DEWASA)', '35-39 TAHUN (DEWASA)', '40-44 TAHUN (DEWASA)',
                        '45-49 TAHUN (DEWASA)', '50-54 TAHUN (DEWASA)', '55-59 TAHUN (LANSIA)',
                        '60-64 TAHUN (LANSIA)', '65-69 TAHUN (LANSIA)', '70-74 TAHUN (LANSIA)',
                        '75-79 TAHUN (LANSIA)', '80-84 TAHUN (LANSIA)', '85-90 TAHUN (LANSIA)',
                        '90-100+ TAHUN (LANSIA)'
                    ];
                    kategoriUmur.forEach(kat => counts[kat] = 0);
                    
                    filteredData.forEach(row => {
                        const umur = hitungUmur(row['TANGGAL_LAHIR']);
                        const kategori = getKategoriUmur(umur);
                        if (counts.hasOwnProperty(kategori)) counts[kategori]++;
                    });
                } else if (tabId === 'kekayaan') {
                    const kekayaanList = ['TIDAK DIKETAHUI', 'MAMPU', 'TIDAK MAMPU', 'MISKIN EKSTREM'];
                    kekayaanList.forEach(kek => counts[kek] = 0);
                    
                    filteredData.forEach(row => {
                        const kekayaan = row['STATUS_KEKAYAAN'];
                        if (counts.hasOwnProperty(kekayaan)) counts[kekayaan]++;
                    });
                } else if (tabId === 'kesehatan') {
                    const kesehatanList = [
                        'TIDAK DIKETAHUI', 'PESERTA BPJS KELAS 1', 'PESERTA BPJS KELAS 2',
                        'PESERTA BPJS KELAS 3', 'PESERTA BPJS PEMERINTAH', 'PESERTA BPJS TENAGA KERJA',
                        'TIDAK MEMILIKI BPJS'
                    ];
                    kesehatanList.forEach(kes => counts[kes] = 0);
                    
                    filteredData.forEach(row => {
                        const kesehatan = row['STATUS_KESEHATAN'];
                        if (counts.hasOwnProperty(kesehatan)) counts[kesehatan]++;
                    });
                } else if (tabId === 'pekerjaan') {
    // Daftar pekerjaan STANDAR dari dropdown pendataan
    const DROPDOWN_PEKERJAAN = [
        'PNS', 'PPPK PENUH WAKTU', 'PPPK PARUH WAKTU', 'TNI', 'POLRI',
        'PEGAWAI BUMN', 'PEGAWAI BUMD', 'PEGAWAI SWASTA', 'HONORER', 'WIRAUSAHA',
        'PEDAGANG', 'UMKM', 'PENGUSAHA', 'DISTRIBUTOR', 'AGEN', 'GURU', 'DOSEN',
        'DOKTER', 'PERAWAT', 'BIDAN', 'PSIKIATER', 'DOKTER SPESIALIS', 'PSIKOLOG',
        'TERAPI', 'TUKANG URUT', 'APOTEKER', 'SOPIR', 'OJEK / DRIVER ONLINE',
        'TUKANG', 'MONTIR', 'PENJAHIT', 'BARISTA', 'SECURITY', 'PETANI', 'PEKEBUN',
        'PETERNAK', 'NELAYAN', 'BURUH TANI', 'BURUH HARIAN LEPAS', 'BURUH BANGUNAN',
        'PENENUN', 'PERAJIN', 'KARYAWAN KONTRAK', 'CLEANING SERVICE',
        'PELAJAR / MAHASISWA', 'IBU RUMAH TANGGA', 'TIDAK BEKERJA', 'PENCARI KERJA',
        'PENSIUNAN', 'DISABILITAS TIDAK BEKERJA', 'PEKERJA DISABILITAS'
    ];
    
    // Inisialisasi counts dengan semua pekerjaan dropdown = 0
    const counts = {};
    DROPDOWN_PEKERJAAN.forEach(pek => {
        counts[pek] = 0;
    });
    
    // Set untuk menyimpan pekerjaan lain yang ditemukan
    const pekerjaanLainSet = new Set();
    
    // Hitung data dari filteredData
    filteredData.forEach(row => {
        const pekerjaan = row['PEKERJAAN'];
        if (pekerjaan) {
            if (counts.hasOwnProperty(pekerjaan)) {
                // Pekerjaan ada di dropdown
                counts[pekerjaan]++;
            } else {
                // Pekerjaan TIDAK ada di dropdown (pekerjaan lain)
                pekerjaanLainSet.add(pekerjaan);
            }
        }
    });
    
    // Ubah Set ke Array dan urutkan
    const pekerjaanLainList = Array.from(pekerjaanLainSet).sort();
    
    // Tampilkan SEMUA pekerjaan dari dropdown (termasuk yang 0)
    // Urutkan berdasarkan abjad
    const sortedDropdown = [...DROPDOWN_PEKERJAAN].sort();
    
    sortedDropdown.forEach(pek => {
        const value = counts[pek];
        const persen = jumlahJiwa > 0 ? ((value / jumlahJiwa) * 100).toFixed(1) : '0.0';
        
        // Beri highlight jika value > 0
        const tr = document.createElement('tr');
        if (value > 0) {
            tr.style.background = '#e8f4fd';
            tr.style.fontWeight = '500';
        }
        
        tr.innerHTML = `
            <td style="text-align: left;">${pek}</td>
            <td>${value}</td>
            <td>${persen}%</td>
        `;
        tbody.appendChild(tr);
    });
    
    // Tampilkan PEKERJAAN LAIN (di luar dropdown) jika ada
    if (pekerjaanLainList.length > 0) {
        // Baris separator
        const separatorTr = document.createElement('tr');
        separatorTr.innerHTML = `
            <td colspan="3" style="background: #ffd700; color: #333; font-weight: 700; text-align: center;">
                ⚠️ PEKERJAAN LAIN (DI LUAR DROPDOWN)
            </td>
        `;
        tbody.appendChild(separatorTr);
        
        // Hitung dan tampilkan pekerjaan lain
        pekerjaanLainList.forEach(pek => {
            // Hitung ulang jumlah untuk pekerjaan lain ini
            const value = filteredData.filter(row => row['PEKERJAAN'] === pek).length;
            const persen = jumlahJiwa > 0 ? ((value / jumlahJiwa) * 100).toFixed(1) : '0.0';
            
            const tr = document.createElement('tr');
            tr.style.background = '#fff0f0';
            tr.innerHTML = `
                <td style="text-align: left; font-style: italic; color: #c0392b;">${pek}</td>
                <td>${value}</td>
                <td>${persen}%</td>
            `;
            tbody.appendChild(tr);
        });
    }
}
                
                // Tampilkan data yang memiliki nilai > 0
                for (let [key, value] of Object.entries(counts)) {
                    if (value > 0) {
                        const persen = ((value / jumlahJiwa) * 100).toFixed(1);
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="text-align: left;">${key}</td>
                            <td>${value}</td>
                            <td>${persen}%</td>
                        `;
                        tbody.appendChild(tr);
                    }
                }
            }
            
            document.getElementById(`table-${tabId}`).style.display = 'block';
            hideLoader(true);
        }

        // Helper functions untuk umur
        function hitungUmur(tanggalLahirStr) {
            if (!tanggalLahirStr) return -1;
            
            const parts = tanggalLahirStr.split('/');
            if (parts.length !== 3) return -1;
            
            const tgl = parseInt(parts[0]);
            const bln = parseInt(parts[1]) - 1;
            const thn = parseInt(parts[2]);
            
            const tanggalLahir = new Date(thn, bln, tgl);
            const today = new Date();
            
            let umur = today.getFullYear() - tanggalLahir.getFullYear();
            const bulanIni = today.getMonth();
            const tanggalIni = today.getDate();
            
            if (bulanIni < bln || (bulanIni === bln && tanggalIni < tgl)) {
                umur--;
            }
            
            return umur;
        }

        function getKategoriUmur(umur) {
            if (umur < 0) return 'TIDAK DIKETAHUI';
            if (umur >= 0 && umur <= 4) return '0-4 TAHUN (BAYI)';
            if (umur >= 5 && umur <= 9) return '5-9 TAHUN (ANAK-ANAK)';
            if (umur >= 10 && umur <= 14) return '10-14 TAHUN (ANAK-ANAK)';
            if (umur >= 15 && umur <= 19) return '15-19 TAHUN (REMAJA)';
            if (umur >= 20 && umur <= 24) return '20-24 TAHUN (REMAJA)';
            if (umur >= 25 && umur <= 29) return '25-29 TAHUN (REMAJA)';
            if (umur >= 30 && umur <= 34) return '30-34 TAHUN (DEWASA)';
            if (umur >= 35 && umur <= 39) return '35-39 TAHUN (DEWASA)';
            if (umur >= 40 && umur <= 44) return '40-44 TAHUN (DEWASA)';
            if (umur >= 45 && umur <= 49) return '45-49 TAHUN (DEWASA)';
            if (umur >= 50 && umur <= 54) return '50-54 TAHUN (DEWASA)';
            if (umur >= 55 && umur <= 59) return '55-59 TAHUN (LANSIA)';
            if (umur >= 60 && umur <= 64) return '60-64 TAHUN (LANSIA)';
            if (umur >= 65 && umur <= 69) return '65-69 TAHUN (LANSIA)';
            if (umur >= 70 && umur <= 74) return '70-74 TAHUN (LANSIA)';
            if (umur >= 75 && umur <= 79) return '75-79 TAHUN (LANSIA)';
            if (umur >= 80 && umur <= 84) return '80-84 TAHUN (LANSIA)';
            if (umur >= 85 && umur <= 90) return '85-90 TAHUN (LANSIA)';
            if (umur >= 91) return '90-100+ TAHUN (LANSIA)';
            return 'TIDAK DIKETAHUI';
        }

        // Load data dari server
        function loadInitialData() {
            showLoader('Memuat Data Tunggu Kejap', 'Mengambil data dari Database...');
            
            fetch(`${SCRIPT_URL}?action=get`)
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        // Bersihkan dan format data
                        allData = cleanData(result.data);
                        
                        // Ambil daftar kelurahan unik
                        const kelSet = new Set();
                        // Ambil daftar kecamatan unik
                        const kecSet = new Set();
                        
                        allData.forEach(row => {
                            if (row['KELURAHAN']) {
                                kelSet.add(row['KELURAHAN']);
                            }
                            if (row['KECAMATAN']) {
                                kecSet.add(row['KECAMATAN']);
                            }
                        });
                        
                        kelurahanList = Array.from(kelSet).sort();
                        kecamatanList = Array.from(kecSet).sort();
                        
                        // Debug: lihat sample data
                        console.log('Data loaded:', allData.length, 'records');
                        console.log('Kecamatan:', kecamatanList);
                        console.log('Kelurahan:', kelurahanList);
                        
                        // Inisialisasi tab
                        initializeTabs();
                        
                        hideLoader(true);
                        showNotification('Data berhasil dimuat!');
                    } else {
                        hideLoader(false);
                        showNotification('Gagal memuat data: ' + (result.error || 'Unknown error'), true);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    hideLoader(false);
                    showNotification('Gagal terhubung ke server', true);
                });
        }

        // Initialize
        window.onload = function() {
            updateCurrentDate();
            setInterval(updateCurrentDate, 1000);
            loadInitialData();
        };
    </script>
