    <style>
        /* ============================================================
           ROOT & RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b1120;
            --primary-light: #141e33;
            --secondary: #1a3a5c;
            --accent: #4facfe;
            --accent2: #00d4ff;
            --accent-glow: rgba(79, 172, 254, 0.15);
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --purple: #9b59b6;
            --pink: #fd79a8;
            --orange: #e67e22;
            --teal: #1abc9c;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary);
            color: #e8edf2;
            min-height: 100vh;
            padding: 12px;
            background-image:
                radial-gradient(ellipse at 10% 0%, rgba(79, 172, 254, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 100%, rgba(0, 212, 255, 0.04) 0%, transparent 60%);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .dashboard-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ============================================================
           LOADING SCREEN
           ============================================================ */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://senapelan.github.io/Home/data/foto/backgroundweb/backgroundpenduduk.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-screen .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        .loading-screen .loading-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .loading-screen .loading-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            animation: floatLogo 2.5s ease-in-out infinite;
            filter: drop-shadow(0 8px 30px rgba(0,0,0,0.5));
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.03); }
        }

        .loading-screen .loading-text {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
            animation: pulseText 1.8s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .loading-screen .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           HEADER PREMIUM - Logo Pemko
           ============================================================ */
        .dashboard-header {
            background: linear-gradient(135deg, rgba(20, 30, 51, 0.9), rgba(26, 58, 92, 0.7));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 18px;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .dashboard-header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -5%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.04), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .dashboard-header .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dashboard-header .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dashboard-header .header-left .logo-pemko {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border: 1px solid var(--glass-border);
        }

        .dashboard-header .header-left .header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dashboard-header .header-left .header-icon {
            font-size: 1.8rem;
            margin-bottom: 0;
        }

        .dashboard-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .dashboard-header .subtitle {
            font-size: 0.78rem;
            color: #8899aa;
            font-weight: 400;
            -webkit-text-fill-color: #8899aa;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .dashboard-header .subtitle i {
            font-size: 0.65rem;
            color: var(--accent);
        }

        .dashboard-header .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: var(--accent-glow);
            border: 1px solid rgba(79, 172, 254, 0.15);
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            -webkit-text-fill-color: var(--accent);
            white-space: nowrap;
        }

        .header-badge i {
            font-size: 0.5rem;
        }

        .header-update {
            font-size: 0.65rem;
            color: #667788;
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-text-fill-color: #667788;
            white-space: nowrap;
        }

        .header-update i {
            font-size: 0.6rem;
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        .filters-section {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 14px 16px 18px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .filters-section:hover {
            border-color: var(--glass-hover);
        }

        .filters-section .filter-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #667788;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filters-section .filter-label i {
            color: var(--accent);
            font-size: 0.75rem;
        }

        .filter-mode-toggle {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        .filter-mode-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            color: #667788;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .filter-mode-btn:hover {
            color: #e8edf2;
            background: rgba(255, 255, 255, 0.03);
        }

        .filter-mode-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 16px rgba(79, 172, 254, 0.2);
        }

        .filter-mode-btn .mode-icon {
            font-size: 0.75rem;
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
            min-width: 120px;
        }

        .filter-group label {
            display: block;
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #667788;
            margin-bottom: 3px;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: #e8edf2;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 36px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.08);
        }

        .filter-group select:hover,
        .filter-group input:hover {
            border-color: rgba(79, 172, 254, 0.2);
        }

        .filter-group select option {
            background: var(--primary);
            color: #e8edf2;
            padding: 4px;
        }

        .filter-group input::placeholder {
            color: #445566;
            font-size: 0.7rem;
        }

        .filter-group select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-reset-filter {
            padding: 7px 16px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.15);
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 36px;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-reset-filter:hover {
            background: rgba(231, 76, 60, 0.2);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.08);
        }

        /* ============================================================
           CARDS RINGKAS
           ============================================================ */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }

        .card-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 12px 10px;
            backdrop-filter: blur(20px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0.5;
        }

        .card-item:hover {
            transform: translateY(-2px);
            border-color: rgba(79, 172, 254, 0.12);
            box-shadow: var(--shadow);
        }

        .card-item .card-icon {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .card-item .card-label {
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #667788;
            line-height: 1.2;
        }

        .card-item .card-value {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 1px;
            background: linear-gradient(135deg, #fff 30%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .card-item .card-sub {
            font-size: 0.55rem;
            color: #667788;
            margin-top: 1px;
            line-height: 1.2;
        }

        .card-border-1::before {
            background: linear-gradient(90deg, #4facfe, #00d4ff);
        }
        .card-border-2::before {
            background: linear-gradient(90deg, #2ecc71, #1abc9c);
        }
        .card-border-3::before {
            background: linear-gradient(90deg, #e74c3c, #fd79a8);
        }
        .card-border-4::before {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
        }
        .card-border-5::before {
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
        }
        .card-border-6::before {
            background: linear-gradient(90deg, #1abc9c, #16a085);
        }
        .card-border-7::before {
            background: linear-gradient(90deg, #e67e22, #d35400);
        }
        .card-border-8::before {
            background: linear-gradient(90deg, #fd79a8, #e84393);
        }
        .card-border-9::before {
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
        }
        .card-border-10::before {
            background: linear-gradient(90deg, #00d4ff, #4facfe);
        }
        .card-border-11::before {
            background: linear-gradient(90deg, #1abc9c, #2ecc71);
        }

        /* ============================================================
           DETAIL CARDS (Analitik Lanjutan)
           ============================================================ */
        .detail-cards-section {
            margin-bottom: 18px;
        }

        .detail-cards-section .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e8edf2;
            flex-wrap: wrap;
        }

        .detail-cards-section .section-title .title-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
            min-width: 30px;
        }

        .detail-cards-section .section-title .title-badge {
            font-size: 0.6rem;
            font-weight: 600;
            color: #667788;
            background: var(--glass);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            white-space: nowrap;
        }

        .detail-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .detail-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 14px 10px;
            backdrop-filter: blur(20px);
            transition: var(--transition);
            max-height: 340px;
            overflow-y: auto;
            cursor: pointer;
            position: relative;
        }

        .detail-card:hover {
            border-color: rgba(79, 172, 254, 0.12);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .detail-card::-webkit-scrollbar {
            width: 3px;
        }
        .detail-card::-webkit-scrollbar-track {
            background: transparent;
        }
        .detail-card::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }

        .detail-card .detail-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            background: var(--primary);
            z-index: 5;
            flex-wrap: wrap;
        }

        .detail-card .detail-card-header .dc-icon {
            font-size: 1rem;
        }

        .detail-card .detail-card-header .dc-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #e8edf2;
        }

        .detail-card .detail-card-header .dc-badge {
            margin-left: auto;
            font-size: 0.5rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(79, 172, 254, 0.1);
            white-space: nowrap;
        }

        .detail-card .category-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 2px 4px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 0.65rem;
        }

        .detail-card .category-row.header-row {
            font-weight: 600;
            color: #667788;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 4px;
            margin-bottom: 2px;
        }

        .detail-card .category-row .cat-name {
            font-weight: 500;
            color: #e8edf2;
            font-size: 0.65rem;
            word-break: break-word;
        }

        .detail-card .category-row .cat-value {
            text-align: center;
            font-weight: 500;
            font-size: 0.65rem;
        }

        .detail-card .category-row .cat-value.laki {
            color: var(--accent);
        }
        .detail-card .category-row .cat-value.perempuan {
            color: var(--pink);
        }
        .detail-card .category-row .cat-value.total {
            color: var(--warning);
            font-weight: 700;
        }
        .detail-card .category-row .cat-value.zero {
            color: #445566;
        }

        .detail-card .category-total {
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid var(--glass-border);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            color: #e8edf2;
            font-size: 0.65rem;
            flex-wrap: wrap;
            gap: 4px;
        }

        .detail-card .category-total .total-label {
            color: #667788;
            font-weight: 400;
        }

        .detail-card .click-hint {
            text-align: center;
            font-size: 0.5rem;
            color: #445566;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid var(--glass-border);
        }

        .detail-card .click-hint i {
            margin-right: 3px;
        }

        /* ============================================================
           MODAL PREVIEW
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

<body>

    <!-- LOADING SCREEN -->
    <div class="loading-screen" id="loadingScreen">
        <div class="overlay"></div>
        <div class="loading-content">
            <img src="https://senapelan.github.io/Home/data/logo_pemko/logosenapelan.png" alt="Logo Senapelan" class="loading-logo" />
            <div class="loading-text">Menampilkan untuk Anda...</div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <div class="dashboard-container" id="app">

        <!-- DASHBOARD CONTENT -->
        <div id="dashboardContent" style="display:none;">

            <!-- HEADER -->
            <div id="headerContainer"></div>

            <!-- FILTER WILAYAH -->
            <div id="filterContainer"></div>

            <!-- CARDS RINGKAS -->
            <div id="cardsContainer"></div>

            <!-- ANALITIK LANJUTAN -->
            <div id="detailCardsContainer"></div>

            <!-- CHARTS -->
            <div id="chartsContainer"></div>

            <!-- TABLE -->
            <div id="tableContainer"></div>

            <!-- FOOTER -->
            <div id="footerContainer"></div>

        </div>
    </div>

    <!-- MODAL PREVIEW -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" id="modalContent" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i> Tutup</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- MODAL KELUARGA -->
    <div class="modal-overlay" id="modalKeluargaOverlay" onclick="closeKeluargaModal(event)">
        <div class="modal-content" id="modalKeluargaContent" onclick="event.stopPropagation()" style="max-width:800px;">
            <button class="modal-close" onclick="closeKeluargaModal()"><i class="fas fa-times"></i> Tutup</button>
            <div id="modalKeluargaBody"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================
        const CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbxcXGrG-MwbDzZwOau4nlRy9kieN79hmpDrsQJsbopS21220ATKxWSqeGDA1vwdmzD5/exec',
            SPREADSHEET_ID: '1k-03Zqm5O7n2Kk2Kf9zozfmAlhn7nLdQhDzgjQobazw'
        };

        // 6 Kelurahan tetap Senapelan
        const FIXED_KELURAHAN = [
            'Kampung Baru',
            'Kampung Bandar',
            'Kampung Dalam',
            'Padang Bulan',
            'Padang Terubuk',
            'Sago'
        ];

        // Urutan status hubungan dalam keluarga
        const STATUS_URUTAN = [
            'KEPALA KELUARGA',
            'ISTRI',
            'ANAK',
            'ORANG TUA',
            'CUCU',
            'MERTUA',
            'MENANTU',
            'FAMILI LAIN',
            'PEMBANTU'
        ];

        // ============================================================
        // STATE
        // ============================================================
        let state = {
            rawData: [],
            headers: [],
            filteredData: [],
            filters: {},
            charts: {},
            isLoaded: false,
            searchTerm: '',
            searchColumn: 'SEMUA KOLOM',
            modeWilayah: 'senapelan'
        };

        // ============================================================
        // FUNGSI SENSOR NIK & NO KK
        // ============================================================
        function maskSensitiveNumber(value) {
            if (!value) return '-';
            const str = value.toString().trim();
            if (str.length <= 4) return str;
            const first4 = str.substring(0, 4);
            const last4 = str.substring(str.length - 4);
            const masked = '*'.repeat(Math.min(str.length - 8, 8));
            return first4 + masked + last4;
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ============================================================
        // AMBIL DATA
        // ============================================================
        async function fetchDashboardData() {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=full`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message || 'Gagal mengambil data');
                if (result.data && result.data.status === 'success') {
                    state.headers = result.data.headers || [];
                    state.rawData = result.data.data || [];
                    state.filteredData = [...state.rawData];
                } else {
                    throw new Error(result.data?.message || 'Gagal mengambil data penduduk');
                }
                state.isLoaded = true;
                return true;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="overlay"></div>
                    <div class="loading-content" style="text-align:center;color:#e74c3c;">
                        <i class="fas fa-exclamation-circle" style="font-size:3rem;display:block;margin-bottom:16px;color:#e74c3c;"></i>

        // ============================================================
        // FUNGSI BANTU
        // ============================================================
        function getColumnIndex(columnName) {
            return state.headers.indexOf(columnName);
        }

        function getColumnData(columnName, dataArray = state.filteredData) {
            const index = getColumnIndex(columnName);
            if (index === -1) return [];
            return dataArray.map(row => row[index]);
        }

        function countUnique(arr) {
            return new Set(arr).size;
        }

        function getDistribution(arr) {
            const counts = {};
            arr.forEach(val => {
                if (val !== undefined && val !== null && val.toString().trim() !== '') {
                    const key = val.toString().trim();
                    counts[key] = (counts[key] || 0) + 1;
                }
            });
            return counts;
        }

        function formatNumber(num) {
            if (num === undefined || num === null) return '0';
            if (typeof num === 'string' && isNaN(parseFloat(num))) return num;
            return new Intl.NumberFormat('id-ID').format(num);
        }

        function generateColors(count) {
            const palette = ['#4facfe', '#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#fd79a8', '#00d4ff',
                '#6c5ce7'
            ];
            const colors = [];
            for (let i = 0; i < count; i++) {
                colors.push(palette[i % palette.length]);
            }
            return colors;
        }

        // ============================================================
        // DETEKSI GENDER - VERSI SUPER LUAS
        // ============================================================
        function isLakiLaki(value) {
            if (!value) return false;
            const str = value.toString().trim().toUpperCase();
            const lakiVariants = [
                'LAKI-LAKI', 'LAKI - LAKI', 'LAKI LAKI',
                'LAKI', 'L', 'L.',
                'Laki-laki', 'Laki - Laki', 'Laki Laki',
                'laki-laki', 'laki - laki', 'laki laki'
            ];
            return lakiVariants.some(v => str === v.toUpperCase()) ||
                str.includes('LAKI') ||
                (str === 'L') ||
                (str === 'L.');
        }

        function isPerempuan(value) {
            if (!value) return false;
            const str = value.toString().trim().toUpperCase();
            const perempuanVariants = [
                'PEREMPUAN', 'PEREMPUAN',
                'P', 'P.',
                'Perempuan', 'perempuan'
            ];
            return perempuanVariants.some(v => str === v.toUpperCase()) ||
                str.includes('PEREMPUAN') ||
                (str === 'P') ||
                (str === 'P.');
        }

        // ============================================================
        // DETEKSI PENGANGGURAN
        // ============================================================
        function isPengangguran(value) {
            if (!value) return true;
            const str = value.toString().trim().toUpperCase();
            const pengangguranKeywords = [
                'TIDAK BEKERJA', 'BELUM BEKERJA', 'BELUM MEMILIKI PEKERJAAN',
                'BELUM ADA PEKERJAAN', 'BELUM / TIDAK BEKERJA',
                'PENSIUNAN', 'PENSIUN',
                'TIDAK ADA', 'N/A', '-'
            ];
            return pengangguranKeywords.some(kw => str.includes(kw));
        }

        function isBekerja(value) {
            return !isPengangguran(value);
        }

        // ============================================================
        // HITUNG UMUR - SUPPORT DD/MM/YYYY DAN ISO FORMAT
        // ============================================================
        function calculateAge(dateStr) {
            if (!dateStr) return null;
            
            let birthDate = null;
            const str = dateStr.toString().trim();
            
            // Format 1: DD/MM/YYYY (contoh: 28/02/1987)
            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                    const day = parseInt(parts[0]);
                    const month = parseInt(parts[1]) - 1;
                    const year = parseInt(parts[2]);
                    if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                        birthDate = new Date(year, month, day);
                    }
                }
            } 
            // Format 2: ISO 8601 (contoh: 1997-10-09T17:00:00.000Z)
            else if (str.includes('T') || str.includes('-')) {
                const parsed = new Date(str);
                if (!isNaN(parsed.getTime())) {
                    birthDate = parsed;
                }
            }
            
            if (!birthDate || isNaN(birthDate.getTime())) return null;
            
            // Hitung umur
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        function getAgeGroup(age) {
            if (age === null || age === undefined) return 'Tidak Diketahui';
            if (age >= 0 && age <= 4) return '0-4 TAHUN';
            if (age >= 5 && age <= 9) return '5-9 TAHUN';
            if (age >= 10 && age <= 14) return '10-14 TAHUN';
            if (age >= 15 && age <= 19) return '15-19 TAHUN';
            if (age >= 20 && age <= 24) return '20-24 TAHUN';
            if (age >= 25 && age <= 29) return '25-29 TAHUN';
            if (age >= 30 && age <= 34) return '30-34 TAHUN';
            if (age >= 35 && age <= 39) return '35-39 TAHUN';
            if (age >= 40 && age <= 44) return '40-44 TAHUN';
            if (age >= 45 && age <= 49) return '45-49 TAHUN';
            if (age >= 50 && age <= 54) return '50-54 TAHUN';
            if (age >= 55 && age <= 59) return '55-59 TAHUN';
            if (age >= 60 && age <= 64) return '60-64 TAHUN';
            if (age >= 65 && age <= 69) return '65-69 TAHUN';
            if (age >= 70 && age <= 74) return '70-74 TAHUN';
            if (age >= 75 && age <= 79) return '75-79 TAHUN';
            if (age >= 80 && age <= 84) return '80-84 TAHUN';
            if (age >= 85 && age <= 90) return '85-90 TAHUN';
            return '> 90 TAHUN';
        }

        // ============================================================
        // SWITCH MODE WILAYAH
        // ============================================================
        function switchWilayahMode(mode) {
            state.modeWilayah = mode;
            delete state.filters['KELURAHAN/DESA'];
            delete state.filters['KECAMATAN'];
            renderFilters();
            applyAllFilters();
            showToast(`Mode: ${mode === 'senapelan' ? 'Senapelan (6 Kelurahan)' : 'Semua Wilayah'}`, 'info');

        // ============================================================
        // RESET FILTERS
        // ============================================================
        function resetFilters() {
            state.filters = {};
            document.querySelectorAll('#filterContainer .filter-group select').forEach(select => {
                if (!select.disabled) select.value = '';
            });
            applyAllFilters();
            showToast('Filter direset', 'info');
        }

        // ============================================================
        // APPLY ALL FILTERS
        // ============================================================
        function applyAllFilters() {
            let filtered = [...state.rawData];

            if (state.modeWilayah === 'senapelan') {
                const petugasIndex = getColumnIndex('ID_PETUGAS');
                if (petugasIndex !== -1) {
                    const selectedKelurahan = state.filters['KELURAHAN/DESA'];

                    if (selectedKelurahan) {
                        filtered = filtered.filter(row => {
                            const petugas = row[petugasIndex];
                            if (!petugas) return false;
                            return petugas.toString().toUpperCase() === selectedKelurahan.toString().toUpperCase();
                        });
                    } else {
                        filtered = filtered.filter(row => {
                            const petugas = row[petugasIndex];
                            if (!petugas) return false;
                            const petugasUpper = petugas.toString().toUpperCase();
                            return FIXED_KELURAHAN.some(fixed =>
                                petugasUpper === fixed.toUpperCase() ||
                                petugasUpper.includes(fixed.toUpperCase()) ||
                                fixed.toUpperCase().includes(petugasUpper)
                            );
                        });
                    }
                }
            }

            Object.keys(state.filters).forEach(column => {
                if (column === 'KELURAHAN/DESA' && state.modeWilayah === 'senapelan') return;
                const colIndex = getColumnIndex(column);
                if (colIndex !== -1) {
                    const filterValue = state.filters[column];
                    filtered = filtered.filter(row => {
                        const cellValue = row[colIndex];
                        return cellValue && cellValue.toString() === filterValue.toString();
                    });
                }
            });

            if (state.searchTerm) {
                const searchLower = state.searchTerm.toLowerCase().trim();
                if (state.searchColumn === 'SEMUA KOLOM') {
                    filtered = filtered.filter(row => {
                        return row.some(cell => {
                            if (!cell) return false;
                            return cell.toString().toLowerCase().includes(searchLower);
                        });
                    });
                } else {
                    const colIndex = getColumnIndex(state.searchColumn);
                    if (colIndex !== -1) {
                        filtered = filtered.filter(row => {
                            const cellValue = row[colIndex];
                            return cellValue && cellValue.toString().toLowerCase().includes(searchLower);
                        });
                    }
                }
            }

            state.filteredData = filtered;

            renderSummaryCards();
            renderDetailCards();
            renderCharts();
            renderTables();
            renderFooter();
            updateDataCount();
        }

        function updateDataCount() {
            const total = state.filteredData.length;

            }
        }

            const totalKK = countUnique(kkData);

            // ============================================================

            // ============================================================
            const statusIndex = getColumnIndex('STATUS HUBUNGAN DALAM KELUARGA');
            const genderIndex = getColumnIndex('JENIS KELAMIN');

            let kepalaLaki = 0;
            let kepalaPerempuan = 0;

                state.filteredData.forEach(row => {

                            kepalaPerempuan++;
                        }
                    }
                });
            }

            // Kumpulkan semua distribusi
            const agamaDist = getDistribution(getColumnData('AGAMA'));
            const pendidikanDist = getDistribution(getColumnData('PENDIDIKAN'));
            const tglLahirData = getColumnData('TANGGAL LAHIR');
            const ageGroups = {};
            tglLahirData.forEach(tgl => {
                const age = calculateAge(tgl);
                const group = getAgeGroup(age);
                if (!ageGroups[group]) ageGroups[group] = [];
                ageGroups[group].push(age);
            });
            const statusKawinDist = getDistribution(getColumnData('STATUS PERKAWINAN'));
            const pekerjaanDist = getDistribution(getColumnData('PEKERJAAN'));
            const domisiliDist = getDistribution(getColumnData('STATUS WARGA'));
            const kekayaanDist = getDistribution(getColumnData('STATUS KEKAYAAN'));
            const kesehatanDist = getDistribution(getColumnData('STATUS KESEHATAN'));
            const kebersihanDist = getDistribution(getColumnData('STATUS KEBERSIHAN'));
            const wargaNegaraDist = getDistribution(getColumnData('KEWARGANEGARAAN'));
            const sukuDist = getDistribution(getColumnData('SUKU'));

            function getGenderBreakdown(columnName, categoryValue) {
                const colIndex = getColumnIndex(columnName);
                if (colIndex === -1) return { laki: 0, perempuan: 0, total: 0 };
                const genderColIndex = getColumnIndex('JENIS KELAMIN');
                if (genderColIndex === -1) return { laki: 0, perempuan: 0, total: 0 };
                let laki = 0,
                    perempuan = 0;
                state.filteredData.forEach(row => {
                    if (row[colIndex] === categoryValue) {
                        const gender = row[genderColIndex];
                        if (isLakiLaki(gender)) {
                            laki++;
                        } else if (isPerempuan(gender)) {
                            perempuan++;
                        }
                    }
                });
                return { laki, perempuan, total: laki + perempuan };
            }

            function getGenderBreakdownForAge(ageGroup) {
                const genderColIndex = getColumnIndex('JENIS KELAMIN');
                const tglColIndex = getColumnIndex('TANGGAL LAHIR');
                if (genderColIndex === -1 || tglColIndex === -1) return { laki: 0, perempuan: 0, total: 0 };
                let laki = 0,
                    perempuan = 0;
                state.filteredData.forEach(row => {
                    const tgl = row[tglColIndex];
                    const age = calculateAge(tgl);
                    const group = getAgeGroup(age);
                    if (group === ageGroup) {
                        const gender = row[genderColIndex];
                        if (isLakiLaki(gender)) {
                            laki++;
                        } else if (isPerempuan(gender)) {
                            perempuan++;
                        }
                    }
                });
                return { laki, perempuan, total: laki + perempuan };
            }

            function renderCategoryRows(dist, columnName, isAge = false) {
                let html = '';
                if (isAge) {
                    const ageOrder = [
                        '0-4 TAHUN', '5-9 TAHUN', '10-14 TAHUN', '15-19 TAHUN',
                        '20-24 TAHUN', '25-29 TAHUN', '30-34 TAHUN', '35-39 TAHUN',
                        '40-44 TAHUN', '45-49 TAHUN', '50-54 TAHUN', '55-59 TAHUN',
                        '60-64 TAHUN', '65-69 TAHUN', '70-74 TAHUN', '75-79 TAHUN',
                        '80-84 TAHUN', '85-90 TAHUN'
                    ];
                    ageOrder.forEach(group => {
                        const breakdown = getGenderBreakdownForAge(group);
                        html += `
                            <div class="category-row">
                                <span class="cat-name">${group}</span>
                                <span class="cat-value laki ${breakdown.total === 0 ? 'zero' : ''}">${formatNumber(breakdown.laki)}</span>
                                <span class="cat-value perempuan ${breakdown.total === 0 ? 'zero' : ''}">${formatNumber(breakdown.perempuan)}</span>
                                <span class="cat-value total ${breakdown.total === 0 ? 'zero' : ''}">${formatNumber(breakdown.total)}</span>
                            </div>
                        `;
                    });
                    return html;
                }
                const sorted = Object.keys(dist).sort();
                sorted.forEach(cat => {
                    if (!cat) return;
                    const breakdown = getGenderBreakdown(columnName, cat);
                    const hasData = breakdown.total > 0;
                    html += `
                        <div class="category-row">
                            <span class="cat-name">${cat}</span>
                            <span class="cat-value laki ${!hasData ? 'zero' : ''}">${formatNumber(breakdown.laki)}</span>
                            <span class="cat-value perempuan ${!hasData ? 'zero' : ''}">${formatNumber(breakdown.perempuan)}</span>
                            <span class="cat-value total ${!hasData ? 'zero' : ''}">${formatNumber(breakdown.total)}</span>
                        </div>
                    `;
                });
                return html;
            }

            // Simpan data untuk modal
            window._detailData = {
                jumlahPenduduk: {
                    title: 'JUMLAH PENDUDUK',
                    icon: '👨‍👩‍👧‍👦',
                    total: total,
                    laki: laki,
                    perempuan: perempuan,
                    kk: totalKK,
                    kepalaLaki: kepalaLaki,
                    kepalaPerempuan: kepalaPerempuan
                },
                agama: { dist: agamaDist, column: 'AGAMA', title: 'AGAMA', icon: '🕌', isAge: false },
                pendidikan: { dist: pendidikanDist, column: 'PENDIDIKAN', title: 'PENDIDIKAN', icon: '📚',
                isAge: false },
                umur: { dist: ageGroups, column: 'TANGGAL LAHIR', title: 'UMUR', icon: '🎂', isAge: true },
                statusKawin: { dist: statusKawinDist, column: 'STATUS PERKAWINAN', title: 'STATUS PERKAWINAN',
                    icon: '💍', isAge: false },
                pekerjaan: { dist: pekerjaanDist, column: 'PEKERJAAN', title: 'PEKERJAAN', icon: '💼', isAge: false },
                domisili: { dist: domisiliDist, column: 'STATUS WARGA', title: 'STATUS DOMISILI', icon: '🏠',
                    isAge: false },
                kekayaan: { dist: kekayaanDist, column: 'STATUS KEKAYAAN', title: 'KEKAYAAN', icon: '💰',
                    isAge: false },
                kesehatan: { dist: kesehatanDist, column: 'STATUS KESEHATAN', title: 'KESEHATAN', icon: '🏥',
                    isAge: false },
                kebersihan: { dist: kebersihanDist, column: 'STATUS KEBERSIHAN', title: 'KEBERSIHAN', icon: '🧹',
                    isAge: false },
                wargaNegara: { dist: wargaNegaraDist, column: 'KEWARGANEGARAAN', title: 'WARGA NEGARA', icon: '🌍',
                    isAge: false },
                suku: { dist: sukuDist, column: 'SUKU', title: 'SUKU', icon: '🌾', isAge: false }
            };

            let html = `
                <div class="detail-cards-section">
                    <div class="section-title">
                        📊 ANALITIK LANJUTAN KEPENDUDUKAN
                        <span class="title-line"></span>
                        <span class="title-badge">${formatNumber(total)} data</span>
                    </div>
                    <div class="detail-cards-grid">
            `;

            // Card Jumlah Penduduk - DIPERBAIKI dengan Kepala Keluarga Laki/Perempuan
            html += `
                <div class="detail-card" onclick="openDetailModal('jumlahPenduduk')">
                    <div class="detail-card-header">
                        <span class="dc-icon">👨‍👩‍👧‍👦</span>
                        <span class="dc-title">JUMLAH PENDUDUK</span>
                        <span class="dc-badge">${formatNumber(total)} Jiwa</span>
                    </div>
                    <div class="category-row header-row">
                        <span>Kategori</span><span>Laki</span><span>Perempuan</span><span>Total</span>
                    </div>
                    <div class="category-row">
                        <span class="cat-name">Total Jiwa</span>
                        <span class="cat-value laki">${formatNumber(laki)}</span>
                        <span class="cat-value perempuan">${formatNumber(perempuan)}</span>
                        <span class="cat-value total">${formatNumber(total)}</span>
                    </div>
                    <div class="category-row">
                        <span class="cat-name">Kepala Keluarga</span>
                        <span class="cat-value laki">${formatNumber(kepalaLaki)}</span>
                        <span class="cat-value perempuan">${formatNumber(kepalaPerempuan)}</span>
                        <span class="cat-value total">${formatNumber(totalKK)}</span>
                    </div>
                    <div class="category-total">
                        <span>Total KK: <strong>${formatNumber(totalKK)}</strong></span>
                        <span>Rasio L:P: <strong>${(laki / (perempuan || 1)).toFixed(2)}</strong></span>
                    </div>
                    <div class="click-hint"><i class="fas fa-expand"></i> Klik untuk preview</div>
                </div>
            `;

            // Card lainnya
            const cardConfigs = [
                { key: 'agama', label: 'AGAMA', icon: '🕌' },
                { key: 'pendidikan', label: 'PENDIDIKAN', icon: '📚' },
                { key: 'umur', label: 'UMUR', icon: '🎂' },
                { key: 'statusKawin', label: 'STATUS PERKAWINAN', icon: '💍' },
                { key: 'pekerjaan', label: 'PEKERJAAN', icon: '💼' },
                { key: 'domisili', label: 'STATUS DOMISILI', icon: '🏠' },
                { key: 'kekayaan', label: 'KEKAYAAN', icon: '💰' },
                { key: 'kesehatan', label: 'KESEHATAN', icon: '🏥' },
                { key: 'kebersihan', label: 'KEBERSIHAN', icon: '🧹' },
                { key: 'wargaNegara', label: 'WARGA NEGARA', icon: '🌍' },
                { key: 'suku', label: 'SUKU', icon: '🌾' }
            ];

            cardConfigs.forEach(cfg => {
                const d = window._detailData[cfg.key];
                if (!d || !d.dist || Object.keys(d.dist).length === 0) {
                    html += `
                        <div class="detail-card" style="opacity:0.5;cursor:default;" onclick="openDetailModal('${cfg.key}')">
                            <div class="detail-card-header">
                                <span class="dc-icon">${cfg.icon}</span>
                                <span class="dc-title">${cfg.label}</span>
                                <span class="dc-badge">0 Kategori</span>
                            </div>
                            <div style="text-align:center;padding:12px;color:#445566;font-size:0.6rem;">
                                Tidak ada data
                            </div>
                        </div>
                    `;
                    return;
                }
                const keys = Object.keys(d.dist).filter(k => k);
                let previewRows = renderCategoryRows(d.dist, d.column, d.isAge);
                html += `
                    <div class="detail-card" onclick="openDetailModal('${cfg.key}')">
                        <div class="detail-card-header">
                            <span class="dc-icon">${cfg.icon}</span>
                            <span class="dc-title">${cfg.label}</span>
                            <span class="dc-badge">${keys.length} Kategori</span>
                        </div>
                        <div class="category-row header-row">
                            <span>Kategori</span><span>Laki</span><span>Perempuan</span><span>Total</span>
                        </div>
                        ${previewRows}
                        <div class="click-hint"><i class="fas fa-expand"></i> Klik untuk preview</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================================
        // MODAL PREVIEW DETAIL - DIPERBAIKI
        // ============================================================
        function openDetailModal(type) {
            const overlay = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');

            const detail = window._detailData[type];
            if (!detail) {
                showToast('Data tidak ditemukan', 'error');
                return;
            }

            if (type === 'jumlahPenduduk') {
                body.innerHTML = `
                    <div class="modal-title">
                        <span class="modal-icon">👨‍👩‍👧‍👦</span>
                        JUMLAH PENDUDUK
                    </div>
                    <div class="category-row header-row">
                        <span>Kategori</span><span>Laki-laki</span><span>Perempuan</span><span>Total</span>
                    </div>
                    <div class="category-row">
                        <span class="cat-name">Total Jiwa</span>
                        <span class="cat-value laki">${formatNumber(detail.laki)}</span>
                        <span class="cat-value perempuan">${formatNumber(detail.perempuan)}</span>
                        <span class="cat-value total">${formatNumber(detail.total)}</span>
                    </div>
                    <div class="category-row">
                        <span class="cat-name">Kepala Keluarga</span>
                        <span class="cat-value laki">${formatNumber(detail.kepalaLaki || 0)}</span>
                        <span class="cat-value perempuan">${formatNumber(detail.kepalaPerempuan || 0)}</span>
                        <span class="cat-value total">${formatNumber(detail.kk)}</span>
                    </div>
                    <div class="category-total">
                        <span>Total KK: <strong>${formatNumber(detail.kk)}</strong></span>
                        <span>Rasio L:P: <strong>${(detail.laki / (detail.perempuan || 1)).toFixed(2)}</strong></span>
                    </div>
                `;
            } else {
                const d = detail;
                let rows = '';
                if (d.isAge) {
                    const ageOrder = [
                        '0-4 TAHUN', '5-9 TAHUN', '10-14 TAHUN', '15-19 TAHUN',
                        '20-24 TAHUN', '25-29 TAHUN', '30-34 TAHUN', '35-39 TAHUN',
                        '40-44 TAHUN', '45-49 TAHUN', '50-54 TAHUN', '55-59 TAHUN',
                        '60-64 TAHUN', '65-69 TAHUN', '70-74 TAHUN', '75-79 TAHUN',
                        '80-84 TAHUN', '85-90 TAHUN'
                    ];
                    const genderColIndex = getColumnIndex('JENIS KELAMIN');
                    const tglColIndex = getColumnIndex('TANGGAL LAHIR');
                    ageOrder.forEach(group => {
                        let laki = 0,
                            perempuan = 0;
                        state.filteredData.forEach(row => {
                            const tgl = row[tglColIndex];
                            const age = calculateAge(tgl);
                            const ageGroup = getAgeGroup(age);
                            if (ageGroup === group) {
                                const gender = row[genderColIndex];
                                if (isLakiLaki(gender)) laki++;
                                else if (isPerempuan(gender)) perempuan++;
                            }
                        });
                        const total = laki + perempuan;
                        rows += `
                            <div class="category-row">
                                <span class="cat-name">${group}</span>
                                <span class="cat-value laki ${total === 0 ? 'zero' : ''}">${formatNumber(laki)}</span>
                                <span class="cat-value perempuan ${total === 0 ? 'zero' : ''}">${formatNumber(perempuan)}</span>
                                <span class="cat-value total ${total === 0 ? 'zero' : ''}">${formatNumber(total)}</span>
                            </div>
                        `;
                    });
                } else {
                    const sorted = Object.keys(d.dist).sort();
                    sorted.forEach(cat => {
                        if (!cat) return;
                        const colIndex = getColumnIndex(d.column);
                        const genderColIndex = getColumnIndex('JENIS KELAMIN');
                        let laki = 0,
                            perempuan = 0;
                        state.filteredData.forEach(row => {
                            if (row[colIndex] === cat) {
                                const gender = row[genderColIndex];
                                if (isLakiLaki(gender)) laki++;
                                else if (isPerempuan(gender)) perempuan++;
                            }
                        });
                        const total = laki + perempuan;
                        rows += `
                            <div class="category-row">
                                <span class="cat-name">${cat}</span>
                                <span class="cat-value laki ${total === 0 ? 'zero' : ''}">${formatNumber(laki)}</span>
                                <span class="cat-value perempuan ${total === 0 ? 'zero' : ''}">${formatNumber(perempuan)}</span>
                                <span class="cat-value total ${total === 0 ? 'zero' : ''}">${formatNumber(total)}</span>
                            </div>
                        `;
                    });
                }

                body.innerHTML = `
                    <div class="modal-title">
                        <span class="modal-icon">${d.icon || '📊'}</span>
                        ${d.title}
                    </div>
                    <div class="category-row header-row">
                        <span>Kategori</span><span>Laki-laki</span><span>Perempuan</span><span>Total</span>
                    </div>
                    ${rows}
                `;
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // RENDER: CHARTS
        // ============================================================
        function renderCharts() {
            const container = document.getElementById('chartsContainer');

            const chartConfigs = [
                { id: 'chart_kelurahan', title: '📊 Sebaran Penduduk per Kelurahan', column: 'KELURAHAN/DESA',
                    type: 'bar', label: 'Jumlah Jiwa' },
                { id: 'chart_gender', title: '🍩 Komposisi Jenis Kelamin', column: 'JENIS KELAMIN', type: 'pie',
                    label: '' },
                { id: 'chart_status_kawin', title: '📈 Status Perkawinan', column: 'STATUS PERKAWINAN', type: 'bar',
                    label: 'Jumlah' },
                { id: 'chart_pendidikan', title: '📊 Sebaran Pendidikan', column: 'PENDIDIKAN', type: 'bar',
                    label: 'Jumlah' },
                { id: 'chart_kesehatan', title: '🏥 Status Kesehatan', column: 'STATUS KESEHATAN', type: 'pie',
                    label: '' },
                { id: 'chart_kebersihan', title: '🧹 Status Kebersihan', column: 'STATUS KEBERSIHAN', type: 'pie',
                    label: '' },
                { id: 'chart_suku', title: '🌾 Sebaran Suku', column: 'SUKU', type: 'bar', label: 'Jumlah' }
            ];

            let html = `<div class="charts-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">`;
            chartConfigs.forEach(cfg => {
                html += `
                    <div class="chart-wrapper">
                        <div class="chart-title">
                            <i class="fas fa-chart-${cfg.type === 'pie' ? 'pie' : 'bar'}" style="color:var(--accent);"></i>
                            ${cfg.title}
                        </div>
                        <div class="chart-container">
                            <canvas id="${cfg.id}"></canvas>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            setTimeout(() => {
                chartConfigs.forEach(cfg => {
                    const canvas = document.getElementById(cfg.id);
                    if (!canvas) return;

                    const colData = getColumnData(cfg.column);
                    const distribution = getDistribution(colData);
                    const labels = Object.keys(distribution);
                    const values = Object.values(distribution);
                    const colors = generateColors(labels.length);

                    if (state.charts[cfg.id]) {
                        state.charts[cfg.id].destroy();
                    }

                    state.charts[cfg.id] = new Chart(canvas, {
                        type: cfg.type,
                        data: {
                            labels: labels,
                            datasets: [{
                                label: cfg.label || 'Jumlah',
                                data: values,
                                backgroundColor: cfg.type === 'pie' ? colors : colors.map(c => c +
                                    '60'),
                                borderColor: cfg.type === 'pie' ? colors : colors,
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: cfg.type === 'pie' ? 'right' : 'top',
                                    labels: {
                                        font: { size: 9 },
                                        color: '#8899aa',
                                        boxWidth: 10,
                                        padding: 6
                                    }
                                }
                            },
                            scales: cfg.type !== 'pie' ? {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1,
                                        color: '#667788',
                                        font: { size: 8 }
                                    },
                                    grid: {
                                        color: 'rgba(255,255,255,0.03)'
                                    }
                                },
                                x: {
                                    ticks: {
                                        color: '#667788',
                                        font: { size: 8 }
                                    },
                                    grid: {
                                        display: false
                                    }
                                }
                            } : {}
                        }
                    });
                });
            }, 150);
        }

                                            const colIndex = getColumnIndex(col.key);
                                            const value = colIndex !== -1 ? (rowData[colIndex] || '-') : '-';
                                            row.push(`<td class="${col.class}">${value}</td>`);
                                        }
                                    });
                                    return `<tr>${row.join('')}</tr>`;
                                }).join('')}
                                ${dataToShow.length > 100 ? `
                                    <tr>
                                        <td colspan="${columns.length}" style="text-align:center;color:#445566;font-style:italic;padding:10px;font-size:0.6rem;">
                                            ... dan ${formatNumber(dataToShow.length - 100)} data lainnya
                                        </td>
                                    </tr>
                                ` : ''}
                                ${dataToShow.length === 0 ? `
                                    <tr>
                                        <td colspan="${columns.length}" style="text-align:center;color:#445566;padding:20px;font-size:0.7rem;">
                                            <i class="fas fa-search" style="display:block;font-size:1.2rem;margin-bottom:6px;"></i>
                                            Tidak ada data yang ditemukan
                                        </td>
                                    </tr>
                                ` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            const searchSelect = document.getElementById('searchColumn');
            if (searchSelect && state.searchColumn) {
                searchSelect.value = state.searchColumn;
            }
            const searchInput = document.getElementById('searchInput');
            if (searchInput && state.searchTerm) {
                searchInput.value = state.searchTerm;
            }

            const input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        doSearch();
                    }
                });
            }
        }

        // ============================================================
        // MODAL KELUARGA - Menampilkan Anggota Keluarga
        // ============================================================
        function openKeluargaModal(noKK, namaKepala) {
            const overlay = document.getElementById('modalKeluargaOverlay');
            const body = document.getElementById('modalKeluargaBody');

            if (!noKK || noKK === '-') {
                showToast('Data keluarga tidak tersedia', 'error');
                return;
            }

            const kkIndex = getColumnIndex('NOMOR KK');
            const statusIndex = getColumnIndex('STATUS HUBUNGAN DALAM KELUARGA');

            if (kkIndex === -1 || statusIndex === -1) {
                showToast('Data tidak lengkap', 'error');
                return;
            }

            const semuaData = state.rawData;
            const anggotaKeluarga = semuaData.filter(row => {
                const kk = row[kkIndex];
                return kk && kk.toString() === noKK.toString();
            });

            if (anggotaKeluarga.length === 0) {
                body.innerHTML = `
                    <div class="family-empty">
                        <i class="fas fa-users"></i>
                        <p>Tidak ada anggota keluarga ditemukan untuk KK: ${noKK}</p>
                    </div>
                `;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            }

            const sortedAnggota = [...anggotaKeluarga].sort((a, b) => {
                const statusA = a[statusIndex] ? a[statusIndex].toString().toUpperCase().trim() : '';
                const statusB = b[statusIndex] ? b[statusIndex].toString().toUpperCase().trim() : '';

                const idxA = STATUS_URUTAN.indexOf(statusA);
                const idxB = STATUS_URUTAN.indexOf(statusB);

                if (idxA === -1 && idxB === -1) return 0;
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            const kelIndex = getColumnIndex('KELURAHAN/DESA');
            const rtIndex = getColumnIndex('RT');
            const rwIndex = getColumnIndex('RW');
            const alamatIndex = getColumnIndex('ALAMAT');

            let infoKK = '';
            if (sortedAnggota.length > 0) {
                const first = sortedAnggota[0];
                const kel = kelIndex !== -1 ? first[kelIndex] || '-' : '-';
                const rt = rtIndex !== -1 ? first[rtIndex] || '-' : '-';
                const rw = rwIndex !== -1 ? first[rwIndex] || '-' : '-';
                const alamat = alamatIndex !== -1 ? first[alamatIndex] || '-' : '-';
                infoKK = `
                    <div style="background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;">
                        <div style="display:flex;flex-wrap:wrap;gap:4px 16px;font-size:0.75rem;color:#8899aa;">
                            <span><strong style="color:#e8edf2;">No. KK:</strong> ${maskSensitiveNumber(noKK)}</span>
                            <span><strong style="color:#e8edf2;">Kelurahan:</strong> ${kel}</span>
                            <span><strong style="color:#e8edf2;">RT:</strong> ${rt}</span>
                            <span><strong style="color:#e8edf2;">RW:</strong> ${rw}</span>
                            <span><strong style="color:#e8edf2;">Alamat:</strong> ${alamat}</span>
                        </div>
                    </div>
                `;
            }

            let anggotaHtml = '';
            const namaIndex = getColumnIndex('NAMA LENGKAP');
            const genderIndex = getColumnIndex('JENIS KELAMIN');
            const nikIndex = getColumnIndex('NIK');
            const tglLahirIndex = getColumnIndex('TANGGAL LAHIR');
            const pekerjaanIndex = getColumnIndex('PEKERJAAN');

            sortedAnggota.forEach((row, idx) => {
                const status = row[statusIndex] || 'TIDAK DIKETAHUI';
                const statusDisplay = status.toString().toUpperCase().trim();
                const nama = namaIndex !== -1 ? row[namaIndex] || '-' : '-';
                const gender = genderIndex !== -1 ? row[genderIndex] || '-' : '-';
                const nik = nikIndex !== -1 ? row[nikIndex] || '-' : '-';
                const tglLahir = tglLahirIndex !== -1 ? row[tglLahirIndex] || '-' : '-';
                const pekerjaan = pekerjaanIndex !== -1 ? row[pekerjaanIndex] || '-' : '-';

                let statusClass = '';
                if (statusDisplay === 'KEPALA KELUARGA') statusClass = 'kepala';
                else if (statusDisplay === 'ISTRI') statusClass = 'istri';
                else if (statusDisplay === 'ANAK') statusClass = 'anak';

                let umur = '-';
                if (tglLahir !== '-') {
                    const age = calculateAge(tglLahir);
                    umur = age !== null ? age + ' tahun' : '-';
                }

                const genderIcon = isLakiLaki(gender) ? '👨' : (isPerempuan(gender) ? '👩' : '👤');

                anggotaHtml += `
                    <div class="family-member-card">
                        <div class="member-header">
                            <span class="member-name">${genderIcon} ${nama}</span>
                            <span class="member-status ${statusClass}">${status}</span>
                        </div>
                        <div class="member-detail">
                            <span><i class="fas fa-id-card"></i> ${maskSensitiveNumber(nik)}</span>
                            <span><i class="fas fa-calendar-alt"></i> ${tglLahir} (${umur})</span>
                            <span><i class="fas fa-briefcase"></i> ${pekerjaan}</span>
                            <span><i class="fas fa-venus-mars"></i> ${gender}</span>
                        </div>
                    </div>
                `;
            });

            const totalAnggota = sortedAnggota.length;

            body.innerHTML = `
                <div class="modal-title">
                    <span class="modal-icon">👨‍👩‍👧‍👦</span>
                    DATA KELUARGA - ${namaKepala || 'Keluarga'}
                    <span style="font-size:0.6rem;font-weight:400;color:#667788;margin-left:auto;">
                        ${totalAnggota} Anggota
                    </span>
                </div>
                ${infoKK}
                <div style="margin-top:8px;">
                    ${anggotaHtml}
                </div>
                <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--glass-border);font-size:0.65rem;color:#667788;text-align:center;">
                    Total ${totalAnggota} anggota keluarga
                </div>
            `;

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeKeluargaModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('modalKeluargaOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // SEARCH FUNCTIONS dengan Tombol
        // ============================================================
        function doSearch() {
            const select = document.getElementById('searchColumn');
            const input = document.getElementById('searchInput');

            if (select) {
                state.searchColumn = select.value;
            }
            if (input) {
                state.searchTerm = input.value;
            }

            applyAllFilters();
            showToast(`Pencarian: "${state.searchTerm || '(kosong)'}" di ${state.searchColumn}`, 'info');
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = '';
            }
            state.searchTerm = '';
            state.searchColumn = 'SEMUA KOLOM';
            const select = document.getElementById('searchColumn');
            if (select) {
                select.value = 'SEMUA KOLOM';
            }
            applyAllFilters();
            showToast('Pencarian dibersihkan', 'info');
        }

        // ============================================================
        // RENDER: FOOTER
        // ============================================================
        function renderFooter() {
            const container = document.getElementById('footerContainer');
            const total = state.filteredData.length;
            const totalAll = state.rawData.length;

            container.innerHTML = `
                <div class="dashboard-footer">
                    © 2026 - Dinas Kependudukan Kec. Senapelan
                    | Menampilkan <strong>${formatNumber(total)}</strong> dari <strong>${formatNumber(totalAll)}</strong> data
                    | Update: ${new Date().toLocaleString('id-ID')}
                </div>
            `;
        }

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            const success = await fetchDashboardData();
            if (success) {
                renderDashboard();
                showToast('Dashboard berhasil dimuat!', 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
