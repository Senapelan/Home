<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==================== KONFIGURASI ====================
const API_URL = 'https://script.google.com/macros/s/AKfycbz3rsFrjoQPg1cPCTxgZdJJOrUTftI4KwMpQ_l9KQMJKxyGITCAXtnfrGXw9AOXKGpm_A/exec';

// ==================== GLOBAL STATE ====================
let currentPage = 'input';
let dropdownData = null;
let pengunjungData = [];

// ==================== UTILITY ====================
function showLoading(show) {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.toggle('show', show);
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  try {
    const d = new Date(dateStr);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return dateStr; }
}

function convertToWhatsApp(phone) {
  if (!phone) return '';
  let cleaned = String(phone).replace(/\D/g, '');
  if (!cleaned || cleaned.length === 0) return '';
  if (cleaned.startsWith('62')) return cleaned;
  if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
  else if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
  return cleaned;
}

function buildSurveyLink(nama, hp, tujuan, linkTemplate) {
  if (!linkTemplate) {
    linkTemplate = 'https://senapelan.github.io/Home/publik/sikemas/survey.html?nama={nama}&hp={hp}&tujuan={tujuan}';
  }
  return linkTemplate
    .replace(/{nama}/g, encodeURIComponent(String(nama)))
    .replace(/{hp}/g, encodeURIComponent(String(hp)))
    .replace(/{tujuan}/g, encodeURIComponent(String(tujuan)));
}

// ==================== API CALLS ====================
function apiGet(action) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_callback_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    window[callbackName] = function(data) {
      delete window[callbackName];
      if (script.parentNode) document.body.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = `${API_URL}?action=${action}&callback=${callbackName}`;
    script.onerror = function() {
      delete window[callbackName];
      if (script.parentNode) document.body.removeChild(script);
      reject(new Error('Gagal terhubung ke server.'));
    };
    const timeout = setTimeout(() => {
      delete window[callbackName];
      if (script.parentNode) document.body.removeChild(script);
      reject(new Error('Timeout: Server tidak merespon'));
    }, 30000);
    const originalCallback = window[callbackName];
    window[callbackName] = function(data) {
      clearTimeout(timeout);
      originalCallback(data);
    };
    document.body.appendChild(script);
  });
}

async function apiPost(data) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return { success: true, message: 'Data berhasil disimpan! ✅' };
  } catch (error) {
    console.error('POST Error:', error);
    throw new Error('Gagal mengirim data: ' + error.message);
  }
}

// ==================== LOAD DROPDOWN ====================
async function loadDropdown() {
  showLoading(true);
  try {
    const result = await apiGet('getDropdown');
    if (result.success) {
      dropdownData = result.data;
      populateDropdown();
    }
  } catch (e) {
    console.error(e);
  } finally {
    showLoading(false);
  }
}

function populateDropdown() {
  const select = document.getElementById('tujuanBerkunjung');
  if (!select || !dropdownData) return;
  select.innerHTML = '<option value="">Pilih Tujuan Berkunjung</option>';
  if (dropdownData.tujuan && dropdownData.tujuan.length > 0) {
    dropdownData.tujuan.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      select.appendChild(opt);
    });
  }
}

// ==================== RENDER PAGES ====================
function renderPage(page) {
  currentPage = page;
  const container = document.getElementById('appContent');
  
  document.querySelectorAll('.bottom-nav .nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  if (page === 'input') {
    container.innerHTML = getInputPageHTML();
    populateDropdown();
    const dateInput = document.getElementById('tanggalLahir');
    if (dateInput) {
      const today = new Date().toISOString().split('T')[0];
      dateInput.max = today;
    }
    initValidation();
    const form = document.getElementById('formInput');
    if (form) {
      const newForm = form.cloneNode(true);
      form.parentNode.replaceChild(newForm, form);
      newForm.addEventListener('submit', handleSubmit);
    }
  } else if (page === 'pengunjung') {
    container.innerHTML = getPengunjungPageHTML();
    loadPengunjungData();
  } else if (page === 'status') {
    container.innerHTML = getStatusPageHTML();
    loadStatusData();
  }
}

// ==================== VALIDASI ====================
function initValidation() {
  const fields = document.querySelectorAll('#formInput .form-control, #formInput .form-select');
  fields.forEach(field => {
    field.addEventListener('blur', function() { validateField(this); });
    field.addEventListener('input', function() {
      if (this.classList.contains('is-valid') || this.classList.contains('is-invalid')) {
        validateField(this);
      }
    });
  });
}

function validateField(field) {
  const isRequired = field.hasAttribute('required');
  const value = field.value.trim();
  
  if (isRequired && !value) {
    field.classList.remove('is-valid');
    field.classList.add('is-invalid');
    return;
  }
  
  if (field.id === 'nik' || field.id === 'noKk') {
    const clean = value.replace(/\s/g, '');
    if (value && clean.length !== 16) {
      field.classList.remove('is-valid');
      field.classList.add('is-invalid');
      return;
    }
  }
  
  if (field.id === 'nomorHp') {
    const clean = value.replace(/\s/g, '');
    if (value && (clean.length < 10 || clean.length > 15)) {
      field.classList.remove('is-valid');
      field.classList.add('is-invalid');
      return;
    }
  }
  
  if (value) {
    field.classList.remove('is-invalid');
    field.classList.add('is-valid');
  } else {
    field.classList.remove('is-valid');
  }
}

          </div>

            <div class="invalid-feedback">Pekerjaan wajib diisi</div>
          </div>
          
          <div class="col-12">

// ==================== LOAD PENGUNJUNG ====================
async function loadPengunjungData() {
  const container = document.getElementById('pengunjungList');
  const counter = document.getElementById('totalPengunjung');
  
  showLoading(true);
  try {
    const result = await apiGet('getPengunjung');
    if (result.success && result.data && result.data.length > 0) {
      pengunjungData = result.data;
      if (counter) counter.textContent = pengunjungData.length;
      renderPengunjungTable(pengunjungData);
    } else {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-users-slash"></i>
          <p>${result.message || 'Belum ada data pengunjung'}</p>
          <button class="btn btn-primary btn-sm mt-3" onclick="renderPage('input')">
            <i class="fas fa-plus me-1"></i> Tambah Data
          </button>
        </div>
      `;
      if (counter) counter.textContent = '0';
    }
  } catch (e) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-triangle text-danger"></i>
        <p>Error: ${e.message}</p>
        <button class="btn btn-primary btn-sm mt-3" onclick="loadPengunjungData()">
          <i class="fas fa-refresh me-1"></i> Coba Lagi
        </button>
      </div>
    `;
  } finally {
    showLoading(false);
  }
}

function renderPengunjungTable(data) {
  const container = document.getElementById('pengunjungList');
  if (!container) return;

  if (!data || data.length === 0) {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash"></i><p>Belum ada data</p></div>`;
    return;
  }

  let html = `
    <div class="table-wrapper">
      <table class="table table-custom">
        <thead><tr><th>#</th><th>Nama</th><th>HP</th><th>Tujuan</th><th>Waktu</th><th>Aksi</th></tr></thead>
        <tbody>
  `;

  data.slice().reverse().forEach((row, index) => {
    const no = row['No'] || (index + 1);
    const nama = row['Nama'] || '-';
    const hp = row['Nomor HP'] || '-';
    const tujuan = row['Tujuan Berkunjung'] || '-';
    const waktu = row['Timestamp'] ? formatDate(row['Timestamp']) : '-';
    
    const hpString = String(hp);
    const waNumber = hpString !== '-' && hpString !== '' ? convertToWhatsApp(hpString) : '';
    
    const linkTemplate = dropdownData?.linkSkm || 'https://senapelan.github.io/Home/publik/sikemas/survey.html?nama={nama}&hp={hp}&tujuan={tujuan}';
    const surveyLink = buildSurveyLink(nama, hpString, tujuan, linkTemplate);
    
    const waMessage = encodeURIComponent(
      `Halo ${nama}, terimakasih telah mengunjungi Kecamatan Senapelan, mohon luangkan waktu untuk mengisi survey Kepuasan Masyarakat dengan mengklik link ini : ${surveyLink}`
    );
    const waUrl = `https://wa.me/${waNumber}?text=${waMessage}`;

    html += `
      <tr>
        <td><strong>${no}</strong></td>
        <td><strong>${nama}</strong></td>
        <td>${hp}</td>
        <td><span class="badge bg-info bg-opacity-10 text-info">${tujuan}</span></td>
        <td>${waktu}</td>
        <td>
          ${waNumber ? `<a href="${waUrl}" target="_blank" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Kirim</a>` : '-'}
        </td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

// ==================== HANDLE SUBMIT ====================
async function handleSubmit(e) {
  e.preventDefault();
  const form = document.getElementById('formInput');
  const btn = document.getElementById('btnSubmit');
  const feedback = document.getElementById('submitFeedback');
  
  feedback.className = 'submit-feedback';
  feedback.style.display = 'none';
  
  if (!form.checkValidity()) {
    form.classList.add('was-validated');
    return;
  }
  
  let nomorHp = document.getElementById('nomorHp').value.trim().replace(/\s/g, '').replace(/\D/g, '');
  if (nomorHp.startsWith('0')) nomorHp = '62' + nomorHp.substring(1);
  else if (!nomorHp.startsWith('62') && nomorHp.length > 0) nomorHp = '62' + nomorHp;
  
  const data = {
    nomorHp: nomorHp,
    nama: document.getElementById('nama').value.trim(),
    nik: document.getElementById('nik').value.trim().replace(/\s/g, ''),
    noKk: document.getElementById('noKk').value.trim().replace(/\s/g, ''),
    tempatLahir: document.getElementById('tempatLahir').value.trim(),
    tanggalLahir: document.getElementById('tanggalLahir').value,
    agama: document.getElementById('agama').value,
    jenisKelamin: document.getElementById('jenisKelamin').value,
    pekerjaan: document.getElementById('pekerjaan').value.trim(),
    alamat: document.getElementById('alamat').value.trim(),
    tujuanBerkunjung: document.getElementById('tujuanBerkunjung').value,
  };
  
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span> Menyimpan...';
  
  try {
    const result = await apiPost(data);
    
    feedback.className = 'submit-feedback success';
    feedback.innerHTML = `<i class="fas fa-check-circle"></i> ${result.message}`;
    feedback.style.display = 'block';
    
    form.reset();
    form.classList.remove('was-validated');
    document.querySelectorAll('.form-control, .form-select').forEach(el => {
      el.classList.remove('is-valid', 'is-invalid');
    });
    
    const dateInput = document.getElementById('tanggalLahir');
    if (dateInput) {
      const today = new Date().toISOString().split('T')[0];
      dateInput.max = today;
    }
    
    populateDropdown();
    
    document.getElementById('formCard').scrollIntoView({ 
      behavior: 'smooth', 
      block: 'start' 
    });
    
    document.getElementById('nomorHp').focus();
    
  } catch (e) {
    feedback.className = 'submit-feedback error';
    feedback.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: ${e.message}`;
    feedback.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Kirim Data';
  }
}
