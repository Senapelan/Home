<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title id="pageTitle">Pelayanan - Kelurahan</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website">     
    <meta property="og:url" id="ogUrl" content="">
    <meta property="og:title" id="ogTitle" content="Pelayanan Kelurahan">
    <meta property="og:description" id="ogDescription" content="Pelayanan Live Chat WhatsApp Kelurahan">
    <meta property="og:image" id="ogImage" content="">
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FONTAWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="32x32" id="faviconLink" href="https://senapelan.github.io/Home/data/foto/favico/favico.png">
    
    <!-- SOUND EFFECT -->
    <script>
        var clickSound = null;
        
        function loadSoundEffect() {
            try {
                clickSound = new Audio('https://senapelan.github.io/Home/data/sound/open-card.mp3');
                clickSound.volume = 0.5;
                clickSound.preload = 'auto';
            } catch(e) {}
        }
        
        function playClickSound() {
            if (clickSound) {
                try {
                    clickSound.currentTime = 0;
                    var playPromise = clickSound.play();
                    if (playPromise) {
                        playPromise.catch(function() {
                            document.addEventListener('click', function playOnInteraction() {
                                try { clickSound.play(); } catch(e) {}
                                document.removeEventListener('click', playOnInteraction);
                            }, { once: true });
                        });
                    }
                } catch(e) {}
            }
        }
    </script>
    
    <style>
        :root {
            --primary: #1e6bff;
            --primary-dark: #0a4fcc;
            --primary-light: #e8f1ff;
            --secondary: #00c9b7;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --gray: #e9ecef;
            --dark-gray: #6c757d;
            --dark: #212529;
            --border: #dee2e6;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
            --border-radius: 16px;
            --glass-border: rgba(255, 255, 255, 0.2);
            --dark-bg: #0c1f33;
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* LOADING */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .loader-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: contain;
            animation: floatAnim 3s ease-in-out infinite;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .loader-bar {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 2px;
            animation: barProgress 2s ease-in-out infinite;
        }
        @keyframes barProgress {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 100%; }
        }
        .loader-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
        }
        .loader-status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 300;
            animation: statusPulse 1.5s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(12, 31, 51, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            transition: var(--transition);
        }
        .header.scrolled {
            background: rgba(12, 31, 51, 0.98);
            backdrop-filter: blur(30px);
            height: 70px;
            box-shadow: var(--shadow-lg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            text-decoration: none;
        }
        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent !important;
            padding: 0 !important;
        }
        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .logo-img:hover { transform: scale(1.1); }

        .logo-text { display: flex; flex-direction: column; }
        .logo-main {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a3d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-sub {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
        }
        .btn-back:hover {
            background: rgba(30, 107, 255, 0.3);
            transform: translateY(-2px);
            border-color: rgba(30, 107, 255, 0.5);
        }

        /* MAIN */
        .main-content {
            max-width: 1400px;
            margin: 120px auto 100px;
            padding: 0 40px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 60px;
        }
        .page-title h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        .page-title h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }
        .page-title p {
            color: var(--dark-gray);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 25px auto 0;
        }

        /* CARD GRID */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .service-card {
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(30, 107, 255, 0.1);
            opacity: 0;
            transform: translateY(30px);
        }
        .service-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(30, 107, 255, 0.3);
        }

        .card-avatar {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }
        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .service-card:hover .card-avatar img { transform: scale(1.05); }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .card-role {
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .service-list {
            list-style: none;
            margin: 15px 0;
            flex-grow: 1;
        }
        .service-list li {
            padding: 8px 0;
            color: var(--dark-gray);
            font-size: 0.9rem;
            position: relative;
            padding-left: 20px;
        }
        .service-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        /* BUTTON */
        .btn-conversation {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            width: 100%;
        }
        .btn-conversation:hover {
            background: linear-gradient(135deg, var(--primary-dark), #00b3a1);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 107, 255, 0.3);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--white);
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--primary-light), var(--white));
        }
        .modal-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .modal-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
            background: var(--white);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 107, 255, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        .btn-modal {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }
        .btn-close { background: var(--light-gray); color: var(--dark); }
        .btn-close:hover { background: var(--gray); }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-dark), #00b3a1);
        }

        /* RUNNING TEXT */
        .running-footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(12, 31, 51, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 0;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            animation: runningText 60s linear infinite;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        @keyframes runningText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .running-text span {
            margin: 0 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .running-text i { color: var(--primary); }

        /* RESPONSIVE */
        @media (max-width: 1200px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .header { padding: 0 20px; height: 70px; }
            .main-content { margin: 100px auto 80px; padding: 0 20px; }
            .page-title h1 { font-size: 2rem; }
            .card-grid { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; gap: 25px; }
            .form-row { grid-template-columns: 1fr; }
            .modal-footer { flex-direction: column; }
            .btn-modal { width: 100%; }
        }
        @media (max-width: 480px) {
            .page-title h1 { font-size: 1.8rem; }
            .modal-body { padding: 20px; }
            .modal-header { padding: 20px; }
        }
    </style>
</head>

<body>
    <!-- LOADING -->
    <div id="loading">
        <div class="loader-container">
            <img class="loader-logo" src="https://senapelan.github.io/Home/data/foto/favico/favico.png" alt="Logo">
            <div class="loader-bar"><div class="loader-bar-fill"></div></div>
            <div class="loader-text" id="loadingText">Memuat data pelayanan...</div>
            <div class="loader-status" id="loadingStatus">Menyiapkan data...</div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header" id="header">
        <a href="#" class="logo" id="logoLink">
            <div class="logo-img">
                <img id="logoImage" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Logo_lambang_kota_pekanbaru.png/960px-Logo_lambang_kota_pekanbaru.png" alt="Logo">
            </div>
            <div class="logo-text">
                <div class="logo-main" id="headerTitle">Kelurahan</div>
                <div class="logo-sub" id="headerSubtitle">Pelayanan Kelurahan</div>
            </div>
        </a>
        <a href="#" class="btn-back" id="backButton" title="Kembali ke Beranda">
            <i class="fas fa-arrow-left"></i>
        </a>
    </header>

    <!-- MAIN -->
    <main class="main-content">
        <div class="page-title">
            <h1 id="pageTitleText">Pelayanan Kelurahan</h1>
            <p id="pageSubtitleText">Pilih petugas untuk memulai percakapan</p>
        </div>
        <div class="card-grid" id="cardGrid"></div>
    </main>

    <!-- RUNNING TEXT -->
    <div class="running-footer">
        <div class="running-text" id="runningText"></div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="conversationModal">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalPetugasName">Mulai Percakapan</h2></div>
            <div class="modal-body">
                <form id="conversationForm">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" class="form-control" required placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap *</label>
                        <textarea id="alamat" class="form-control" rows="2" required placeholder="Masukkan alamat lengkap"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rt">RT *</label>
                            <input type="text" id="rt" class="form-control" required placeholder="Contoh: 004">
                        </div>
                        <div class="form-group">
                            <label for="rw">RW *</label>
                            <input type="text" id="rw" class="form-control" required placeholder="Contoh: 005">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="kelurahan">Kelurahan *</label>
                        <input type="text" id="kelurahan" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="kecamatan">Kecamatan *</label>
                        <input type="text" id="kecamatan" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="kota">Kota *</label>
                        <input type="text" id="kota" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="provinsi">Provinsi *</label>
                        <input type="text" id="provinsi" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="no_hp">No. HP / WhatsApp *</label>
                        <input type="tel" id="no_hp" class="form-control" required placeholder="081234567890">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com">
                    </div>
                    <div class="form-group">
                        <label for="tujuan">Tujuan Percakapan *</label>
                        <select id="tujuan" class="form-control" required>
                            <option value="">Pilih tujuan</option>
                            <option value="Pelaporan">Pelaporan</option>
                            <option value="Pelayanan Surat">Pelayanan Surat</option>
                            <option value="Kunjungan">Kunjungan</option>
                            <option value="Konsultasi">Konsultasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tujuan_optional">Tujuan (Opsional)</label>
                        <textarea id="tujuan_optional" class="form-control" rows="2" placeholder="Jelaskan detail jika diperlukan"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-close" onclick="closeModal()">Batal</button>
                <button type="button" class="btn-modal btn-submit" onclick="submitConversation()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI - GANTI SCRIPT ID ANDA!
        // ============================================
        var CONFIG = {
            API_URL: 'https://script.google.com/macros/s/AKfycbySO5ZdlrPQNAa8ing2iCfNxXkDl16O-CJyOllfKqsLknt0kgg1X6g1AzgL_rDH6ZDM/exec',
            API_KEY: 'KELURAHAN2026',
            DEFAULT_SHEET: 'Sago'
        };

        var SHEET_MAPPING = {
            'sago': 'Sago',
            'kampung_bandar': 'Kampung_Bandar',
            'kampung_baru': 'Kampung_Baru',
            'kampung_dalam': 'Kampung_Dalam',
            'padang_bulan': 'Padang_Bulan',
            'padang_terubuk': 'Padang_Terubuk'
        };

        var selectedPetugas = '';
        var selectedPhone = '';

        // ============================================
        // FUNGSI UTAMA
        // ============================================
        function getParameter() {
            var params = new URLSearchParams(window.location.search);
            var kelurahan = params.get('kelurahan');
            if (kelurahan && SHEET_MAPPING[kelurahan.toLowerCase()]) {
                return SHEET_MAPPING[kelurahan.toLowerCase()];
            }
            return CONFIG.DEFAULT_SHEET;
        }

        function fetchData(sheetName) {
            var url = CONFIG.API_URL + '?api_key=' + CONFIG.API_KEY + '&cmd=getData&sheet=' + encodeURIComponent(sheetName);
            
            return fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error('Gagal mengambil data');
                    return response.json();
                })
                .then(function(result) {
                    if (!result.success) throw new Error(result.message || 'Gagal mengambil data');
                    return result.data;
                });
        }

        // ============================================
        // RENDER HALAMAN
        // ============================================
        function renderPage(data, sheetName) {
            var get = function(key, defaultVal) {
                defaultVal = defaultVal || '';
                return data[key] ? data[key].value : defaultVal;
            };

            // HEADER
            document.getElementById('headerTitle').textContent = get('header_title', 'Kelurahan');
            document.getElementById('headerSubtitle').textContent = get('header_subtitle', 'Pelayanan Kelurahan');
            
            var logoUrl = get('logo_image_url');
            if (logoUrl) document.getElementById('logoImage').src = logoUrl;
            
            var backUrl = get('back_button_url', '#');
            document.getElementById('backButton').href = backUrl;
            document.getElementById('logoLink').href = backUrl;

            // TITLE
            document.getElementById('pageTitleText').textContent = get('page_title', 'Pelayanan Kelurahan');
            document.getElementById('pageSubtitleText').textContent = get('page_subtitle', 'Pilih petugas untuk memulai percakapan');
            document.title = get('meta_title', 'Pelayanan Kelurahan');

            // META
            document.getElementById('ogTitle').setAttribute('content', get('meta_title', 'Pelayanan Kelurahan'));
            document.getElementById('ogDescription').setAttribute('content', get('meta_description', 'Pelayanan Live Chat WhatsApp'));
            document.getElementById('ogImage').setAttribute('content', get('meta_image', ''));
            document.getElementById('ogUrl').setAttribute('content', window.location.href);
            
            var favicon = get('favicon_url');
            if (favicon) document.getElementById('faviconLink').href = favicon;

            // RUNNING TEXT
            renderRunningText(data);

            // FORM DEFAULTS
            document.getElementById('kelurahan').value = get('default_kelurahan', '');
            document.getElementById('kecamatan').value = get('default_kecamatan', '');
            document.getElementById('kota').value = get('default_kota', '');
            document.getElementById('provinsi').value = get('default_provinsi', '');

            // PETUGAS CARDS
            renderPetugasCards(data);

            // HILANGKAN LOADING
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        }

        // ============================================
        // RENDER RUNNING TEXT
        // ============================================
        function renderRunningText(data) {
            var get = function(key, defaultVal) {
                defaultVal = defaultVal || '';
                return data[key] ? data[key].value : defaultVal;
            };
            
            var texts = [];
            for (var i = 1; i <= 6; i++) {
                var text = get('running_text_' + i);
                if (text) texts.push(text);
            }
            
            var container = document.getElementById('runningText');
            if (texts.length === 0) {
                container.innerHTML = 
                    '<span><i class="fas fa-check-circle"></i> Pelayanan terbaik lahir dari keikhlasan</span>' +
                    '<span><i class="fas fa-users"></i> Masyarakat Sejahtera, Kelurahan Maju</span>' +
                    '<span><i class="fas fa-handshake"></i> Gotong Royong Membangun Negeri</span>';
                return;
            }
            
            var html = '';
            for (var r = 0; r < 3; r++) {
                for (var t = 0; t < texts.length; t++) {
                    html += '<span><i class="fas fa-check-circle"></i> ' + texts[t] + '</span>';
                }
            }
            container.innerHTML = html;
        }

        // ============================================
        // RENDER PETUGAS CARDS
        // ============================================
        function renderPetugasCards(data) {
            var get = function(key, defaultVal) {
                defaultVal = defaultVal || '';
                return data[key] ? data[key].value : defaultVal;
            };
            
            var grid = document.getElementById('cardGrid');
            var html = '';
            var found = 0;

            for (var i = 1; i <= 4; i++) {
                var nama = get('petugas_' + i + '_nama');
                
                if (!nama) continue;
                
                found++;
                
                var jabatan = get('petugas_' + i + '_jabatan', 'Petugas Pelayanan');
                var foto = get('petugas_' + i + '_foto', '');
                var wa = get('petugas_' + i + '_wa', '');
                
                var layanan = [];
                for (var j = 1; j <= 4; j++) {
                    var l = get('petugas_' + i + '_layanan_' + j);
                    if (l) layanan.push(l);
                }
                
                html += '<div class="service-card" data-index="' + i + '">';
                html += '<div class="card-avatar">';
                html += '<img src="' + (foto || 'https://via.placeholder.com/200x200/1e6bff/ffffff?text=' + encodeURIComponent(nama)) + '" alt="' + nama + '" onerror="this.src=\'https://via.placeholder.com/200x200/1e6bff/ffffff?text=Petugas\'">';
                html += '</div>';
                html += '<div class="card-content">';
                html += '<h3 class="card-name">' + nama + '</h3>';
                html += '<p class="card-role">' + jabatan + '</p>';
                html += '<ul class="service-list">';
                for (var lIdx = 0; lIdx < layanan.length; lIdx++) {
                    html += '<li>' + layanan[lIdx] + '</li>';
                }
                html += '</ul>';
                html += '<button class="btn-conversation" onclick="openConversationModal(\'' + nama + '\', \'' + wa + '\')">';
                html += '<i class="fab fa-whatsapp"></i> ' + (wa ? 'Mulai Percakapan' : 'Nomor Tidak Tersedia');
                html += '</button>';
                html += '</div></div>';
            }

            if (found === 0) {
                html = '<div style="grid-column:1/-1; text-align:center; padding:60px 20px; background:#fff3cd; border-radius:16px; border:2px solid #ffc107;">';
                html += '<i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ffc107;"></i>';
                html += '<h3 style="margin-top:20px; color:#856404;">Data Petugas Tidak Ditemukan</h3>';
                html += '<p style="color:#856404; margin:10px 0;">Pastikan spreadsheet memiliki format key:</p>';
                html += '<div style="background:#f8f9fa; padding:20px; border-radius:10px; text-align:left; max-width:500px; margin:20px auto; font-family:monospace; font-size:13px;">';
                html += 'petugas_1_nama<br>petugas_1_jabatan<br>petugas_1_foto<br>petugas_1_wa<br>petugas_1_layanan_1 s/d 4';
                html += '</div></div>';
            }

            grid.innerHTML = html;

            // Animasi muncul
            setTimeout(function() {
                var cards = document.querySelectorAll('.service-card');
                for (var c = 0; c < cards.length; c++) {
                    (function(idx) {
                        setTimeout(function() {
                            cards[idx].classList.add('visible');
                        }, idx * 100);
                    })(c);
                }
            }, 300);
        }

        // ============================================
        // MODAL FUNCTIONS - DENGAN SOUND EFFECT
        // ============================================
        function openConversationModal(petugasName, phoneNumber) {
            // Play sound effect saat buka modal
            playClickSound();
            
            selectedPetugas = petugasName;
            selectedPhone = phoneNumber;
            document.getElementById('modalPetugasName').textContent = 'Percakapan dengan ' + petugasName;
            document.getElementById('conversationModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            loadFormData();
            setTimeout(function() {
                document.getElementById('nama').focus();
            }, 100);
        }

        function closeModal() {
            document.getElementById('conversationModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================
        // FORM DATA
        // ============================================
        function saveFormData() {
            var formData = {
                nama: document.getElementById('nama').value,
                alamat: document.getElementById('alamat').value,
                rt: document.getElementById('rt').value,
                rw: document.getElementById('rw').value,
                no_hp: document.getElementById('no_hp').value,
                email: document.getElementById('email').value,
                tujuan: document.getElementById('tujuan').value,
                tujuan_optional: document.getElementById('tujuan_optional').value
            };
            try {
                localStorage.setItem('pelayananFormData', JSON.stringify(formData));
            } catch(e) {}
        }

        function loadFormData() {
            try {
                var saved = localStorage.getItem('pelayananFormData');
                if (saved) {
                    var fd = JSON.parse(saved);
                    document.getElementById('nama').value = fd.nama || '';
                    document.getElementById('alamat').value = fd.alamat || '';
                    document.getElementById('rt').value = fd.rt || '';
                    document.getElementById('rw').value = fd.rw || '';
                    document.getElementById('no_hp').value = fd.no_hp || '';
                    document.getElementById('email').value = fd.email || '';
                    document.getElementById('tujuan').value = fd.tujuan || '';
                    document.getElementById('tujuan_optional').value = fd.tujuan_optional || '';
                }
            } catch(e) {}
        }

        function clearFormData() {
            try {
                localStorage.removeItem('pelayananFormData');
            } catch(e) {}
        }

        // ============================================
        // SUBMIT
        // ============================================
        function submitConversation() {
            var nama = document.getElementById('nama').value.trim();
            var alamat = document.getElementById('alamat').value.trim();
            var rt = document.getElementById('rt').value.trim();
            var rw = document.getElementById('rw').value.trim();
            var kelurahan = document.getElementById('kelurahan').value.trim();
            var kecamatan = document.getElementById('kecamatan').value.trim();
            var kota = document.getElementById('kota').value.trim();
            var provinsi = document.getElementById('provinsi').value.trim();
            var no_hp = document.getElementById('no_hp').value.trim();
            var email = document.getElementById('email').value.trim();
            var tujuan = document.getElementById('tujuan').value;
            var tujuan_optional = document.getElementById('tujuan_optional').value.trim();

            if (!nama || !alamat || !rt || !rw || !no_hp || !tujuan) {
                alert('Harap isi semua field yang wajib diisi (*)');
                return;
            }

            var cleanPhone = no_hp.replace(/\D/g, '');
            if (cleanPhone.length < 10 || cleanPhone.length > 13) {
                alert('Nomor HP tidak valid. Masukkan 10-13 digit angka.');
                return;
            }

            var finalTujuan = tujuan_optional ? tujuan + ': ' + tujuan_optional : tujuan;
            var message = 'Assalamualaikum Bapak/Ibu ' + selectedPetugas + '\n\n';
            message += 'Perkenalkan,\n';
            message += 'Nama: ' + nama + '\n';
            message += 'Alamat: ' + alamat + '\n';
            message += 'RT: ' + rt + ', RW: ' + rw + '\n';
            message += 'Kelurahan: ' + kelurahan + '\n';
            message += 'Kecamatan: ' + kecamatan + '\n';
            message += 'Kota: ' + kota + '\n';
            message += 'Provinsi: ' + provinsi + '\n';
            message += 'No HP: ' + no_hp + '\n';
            if (email) message += 'Email: ' + email + '\n';
            message += '\nSaya ingin memulai percakapan tentang ' + finalTujuan + '\n\n';
            message += 'Terimakasih.\n' + window.location.href;

            var whatsappURL = 'https://wa.me/' + selectedPhone + '?text=' + encodeURIComponent(message);
            
            clearFormData();
            closeModal();
            setTimeout(function() {
                window.open(whatsappURL, '_blank');
            }, 300);
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // ===== LOAD SOUND EFFECT =====
            loadSoundEffect();
            
            // Preload sound saat hover tombol
            document.addEventListener('mouseover', function(e) {
                if (e.target.closest('.btn-conversation')) {
                    if (clickSound) {
                        try { clickSound.load(); } catch(e) {}
                    }
                }
            });
            // ===== END SOUND =====
            
            // Header scroll
            window.addEventListener('scroll', function() {
                var header = document.getElementById('header');
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Modal close on overlay
            document.getElementById('conversationModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // Modal close on Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            // Form auto-save
            var formIds = ['nama', 'alamat', 'rt', 'rw', 'no_hp', 'email', 'tujuan', 'tujuan_optional'];
            for (var fi = 0; fi < formIds.length; fi++) {
                var el = document.getElementById(formIds[fi]);
                if (el) {
                    el.addEventListener('input', saveFormData);
                    el.addEventListener('change', saveFormData);
                }
            }

            // Format nomor HP
            document.getElementById('no_hp').addEventListener('input', function(e) {
                var value = e.target.value.replace(/\D/g, '');
                if (value.length > 4) {
                    value = value.replace(/(\d{4})(\d{4})(\d+)/, '$1-$2-$3');
                }
                e.target.value = value;
            });

            // MAIN
            var sheetName = getParameter();
            document.getElementById('loadingText').textContent = 'Memuat ' + sheetName.replace('_', ' ') + '...';
            
            fetchData(sheetName)
                .then(function(data) {
                    renderPage(data, sheetName);
                })
                .catch(function(error) {
                    document.getElementById('loading').innerHTML = 
                        '<div style="color:#ff6b6b; font-size:48px; margin-bottom:20px;">❌</div>' +
                        '<div style="color:white; font-size:18px; max-width:400px; text-align:center;">' +
                        'Gagal memuat data.<br>' +
                        '<span style="font-size:14px; opacity:0.7;">' + error.message + '</span>' +
                        '<br><br>' +
                        '<button onclick="location.reload()" style="padding:12px 30px; background:#1e6bff; color:white; border:none; border-radius:10px; font-size:16px; cursor:pointer;">' +
                        '🔄 Coba Lagi</button></div>';
                });
        });
    </script>
</body>
</html>
