<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FONTAWESOME ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" sizes="32x32" href="https://senapelan.github.io/Home/data/foto/favico/favico.png">
    
    <style>
        :root {
            --primary: #1e6bff;
            --primary-dark: #0a4fcc;
            --primary-light: #e8f1ff;
            --secondary: #00c9b7;
            --accent: #ff6b6b;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --gray: #e9ecef;
            --dark-gray: #6c757d;
            --dark: #212529;
            --border: #dee2e6;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
            --border-radius: 16px;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --dark-bg: #0c1f33;
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(12, 31, 51, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            transition: var(--transition);
        }

        .header.scrolled {
            background: rgba(12, 31, 51, 0.98);
            backdrop-filter: blur(30px);
            height: 70px;
            box-shadow: var(--shadow-lg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            text-decoration: none;
            position: relative;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            background: transparent !important;
            padding: 0 !important;
        }

        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: var(--transition);
            filter: none !important;
            border-radius: 12px;
        }

        .logo-img:hover {
            transform: scale(1.1);
        }

        .logo-img:hover img {
            transform: rotate(10deg);
            filter: brightness(1.2) saturate(1.5) !important;
        }

        .logo-img:hover::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, 
                rgba(30, 107, 255, 0.4), 
                rgba(0, 201, 183, 0.4), 
                rgba(255, 107, 107, 0.4));
            border-radius: 18px;
            z-index: -1;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { opacity: 0.5; filter: hue-rotate(0deg); }
            50% { opacity: 0.8; filter: hue-rotate(45deg); }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-main {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a3d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-back:hover {
            background: rgba(30, 107, 255, 0.3);
            color: white;
            transform: translateY(-2px) rotate(-5deg);
            box-shadow: 0 10px 20px rgba(30, 107, 255, 0.2);
            border-color: rgba(30, 107, 255, 0.5);
        }

        .btn-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn-back:hover::before {
            left: 100%;
        }

        .main-content {
            max-width: 1400px;
            margin: 120px auto 100px;
            padding: 0 40px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-title h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .page-title h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .page-title p {
            color: var(--dark-gray);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 25px auto 0;
        }

        .loading-container {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .loading-container i {
            font-size: 3rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .loading-container p {
            margin-top: 20px;
            color: var(--dark-gray);
            font-size: 1.1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .error-container i {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .error-container h2 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .error-container p {
            color: var(--dark-gray);
            margin-bottom: 20px;
        }

        .btn-retry {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-retry:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .service-card {
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(30, 107, 255, 0.1);
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .service-card:nth-child(1) { animation-delay: 0.1s; }
        .service-card:nth-child(2) { animation-delay: 0.2s; }
        .service-card:nth-child(3) { animation-delay: 0.3s; }
        .service-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(30, 107, 255, 0.3);
        }

        .card-avatar {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background: var(--light-gray);
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .service-card:hover .card-avatar img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .card-role {
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .service-list {
            list-style: none;
            margin: 15px 0;
            flex-grow: 1;
        }

        .service-list li {
            padding: 8px 0;
            color: var(--dark-gray);
            font-size: 0.9rem;
            position: relative;
            padding-left: 20px;
        }

        .service-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--gray);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--dark-gray);
        }

        .btn-conversation {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn-conversation:hover {
            background: linear-gradient(135deg, var(--primary-dark), #00b3a1);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 107, 255, 0.3);
        }

        .btn-conversation::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn-conversation:hover::before {
            left: 100%;
        }

        .btn-conversation i {
            font-size: 18px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--white);
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--primary-light), var(--white));
        }

        .modal-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: var(--transition);
            background: var(--white);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 107, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-modal {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-close {
            background: var(--light-gray);
            color: var(--dark);
        }

        .btn-close:hover {
            background: var(--gray);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-dark), #00b3a1);
        }

        .running-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(12, 31, 51, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 0;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .running-text-container {
            position: relative;
            height: 100%;
        }

        .running-text {
            display: inline-block;
            white-space: nowrap;
            animation: runningText 60s linear infinite;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes runningText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .running-text span {
            margin: 0 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .running-text i {
            color: var(--primary);
        }

        @media (max-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 20px;
                height: 70px;
            }
            
            .main-content {
                margin: 100px auto 80px;
                padding: 0 20px;
            }
            
            .page-title h1 {
                font-size: 2rem;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto;
                gap: 25px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .modal-footer {
                flex-direction: column;
            }
            
            .btn-modal {
                width: 100%;
            }
            
            .logo-img {
                width: 50px;
                height: 50px;
            }
            
            .logo-main {
                font-size: 18px;
            }
            
            .logo-sub {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                margin: 90px auto 70px;
            }
            
            .page-title h1 {
                font-size: 1.8rem;
            }
            
            .modal-body {
                padding: 20px;
            }
            
            .modal-header {
                padding: 20px;
            }
            
            .running-text span {
                margin: 0 25px;
            }
        }
    </style>
</head>

<body>
    <header class="header" id="header">
        <a href="https://senapelan.github.io/Home/" class="logo">
            <div class="logo-img">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Logo_lambang_kota_pekanbaru.png/960px-Logo_lambang_kota_pekanbaru.png" alt="Logo Pekanbaru">
            </div>
            <div class="logo-text">
                <div class="logo-main" id="kelurahanDisplayName">Kelurahan</div>
                <div class="logo-sub">Pelayanan Kelurahan</div>
            </div>
        </a>
        
        <a href="https://senapelan.github.io/Home/" class="btn-back" title="Kembali ke Beranda">
            <i class="fas fa-arrow-left"></i>
        </a>
    </header>

    <main class="main-content">
        <div class="page-title">
            <h1 id="pageTitleText">Pelayanan Kelurahan</h1>
            <p id="pageDescription">Pilih petugas untuk memulai percakapan dan mendapatkan pelayanan terbaik</p>
        </div>
 
        <div class="card-grid" id="cardGrid">
            <div class="loading-container" id="loadingState">
                <i class="fas fa-spinner"></i>
                <p>Memuat data petugas...</p>
                <p style="font-size:0.8rem;color:var(--dark-gray);margin-top:10px;">
                    <small>⏳ Mohon tunggu sebentar</small>
                </p>
            </div>
        </div>
    </main>

    <div class="running-footer">
        <div class="running-text-container">
            <div class="running-text" id="runningText">
                <span><i class="fas fa-check-circle"></i> Memuat teks berjalan...</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="conversationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalPetugasName">Mulai Percakapan</h2>
            </div>
            <div class="modal-body">
                <form id="conversationForm">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" class="form-control" required placeholder="Masukkan nama lengkap">
                    </div>
                    
                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap *</label>
                        <textarea id="alamat" class="form-control" rows="2" required placeholder="Masukkan alamat lengkap"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rt">RT *</label>
                            <input type="text" id="rt" class="form-control" required placeholder="Contoh: 004">
                        </div>
                        <div class="form-group">
                            <label for="rw">RW *</label>
                            <input type="text" id="rw" class="form-control" required placeholder="Contoh: 005">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="kelurahan">Kelurahan *</label>
                        <input type="text" id="kelurahan" class="form-control" required placeholder="Nama Kelurahan">
                    </div>
                    
                    <div class="form-group">
                        <label for="kecamatan">Kecamatan *</label>
                        <input type="text" id="kecamatan" class="form-control" required placeholder="Senapelan">
                    </div>
                    
                    <div class="form-group">
                        <label for="kota">Kota *</label>
                        <input type="text" id="kota" class="form-control" required placeholder="Pekanbaru">
                    </div>
                    
                    <div class="form-group">
                        <label for="provinsi">Provinsi *</label>
                        <input type="text" id="provinsi" class="form-control" required placeholder="Riau">
                    </div>
                    
                    <div class="form-group">
                        <label for="no_hp">No. HP / WhatsApp *</label>
                        <input type="tel" id="no_hp" class="form-control" required placeholder="Contoh: 081234567890">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="tujuan">Tujuan Percakapan *</label>
                        <select id="tujuan" class="form-control" required>
                            <option value="">Pilih tujuan percakapan</option>
                            <option value="Pelaporan">Pelaporan</option>
                            <option value="Pelayanan Surat">Pelayanan Surat</option>
                            <option value="Kunjungan">Kunjungan</option>
                            <option value="Konsultasi">Konsultasi</option>
                            <option value="Informasi">Informasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="tujuan_optional">Tujuan Percakapan (Opsional)</label>
                        <textarea id="tujuan_optional" class="form-control" rows="2" placeholder="Jelaskan secara detail jika diperlukan"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-close" onclick="closeModal()">Batal</button>
                <button type="button" class="btn-modal btn-submit" onclick="submitConversation()">Kirim Percakapan</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // KONFIGURASI
        // =====================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbyNgmXQII-Unb5m6T7MqjdI3xeK1BDCbRqCLa5cbd8449mNV5FfB5XWoPq31rPRJ7g/exec';
        
        function getKelurahanFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('kelurahan') || 'Padang_Terubuk';
        }

        let currentKelurahan = '';
        let allData = null;
        let selectedPetugas = '';
        let selectedPhone = '';

        // =====================================================
        // CACHE MANAGEMENT (Frontend)
        // =====================================================
        function getCachedData(key) {
            try {
                const cached = localStorage.getItem('pelayananCache_' + key);
                if (cached) {
                    const data = JSON.parse(cached);
                    const age = Date.now() - data.timestamp;
                    if (age < 300000) { // 5 menit
                        return data.value;
                    }
                }
            } catch (e) {
                console.log('Cache error:', e);
            }
            return null;
        }

        function setCachedData(key, value) {
            try {
                localStorage.setItem('pelayananCache_' + key, JSON.stringify({
                    value: value,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.log('Cache save error:', e);
            }
        }

        // =====================================================
        // SOUND EFFECT
        // =====================================================
        let clickSound;
        
        function loadSoundEffect() {
            clickSound = new Audio('https://senapelan.github.io/Home/data/sound/open-card.mp3');
            clickSound.volume = 0.5;
        }
        
        function playClickSound() {
            if (clickSound) {
                clickSound.currentTime = 0;
                clickSound.play().catch(e => {
                    console.log('Sound tidak bisa diputar otomatis:', e);
                });
            }
        }

        // =====================================================
        // HEADER SCROLL EFFECT
        // =====================================================
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // =====================================================
        // FETCH DATA DARI API (Dengan Cache & Timeout)
        // =====================================================
        async function fetchAllData(kelurahan) {
            try {
                // Cek cache dulu
                const cacheKey = 'allData_' + kelurahan;
                const cached = getCachedData(cacheKey);
                if (cached) {
                    console.log('✅ Data from cache');
                    return cached;
                }
                
                console.log('🔄 Fetching from API...');
                const url = `${API_URL}?action=getAllData&kelurahan=${encodeURIComponent(kelurahan)}`;
                
                // Timeout 30 detik
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    setCachedData(cacheKey, result.data);
                    console.log('✅ Data saved to cache');
                    return result.data;
                } else {
                    throw new Error(result.message || 'Gagal mengambil data');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                throw error;
            }
        }

        // =====================================================
        // UPDATE META TAGS
        // =====================================================
        function updateMetaTags(metaData, kelurahanInfo) {
            const displayName = kelurahanInfo?.nama_display || 'Kelurahan';
            
            let title = metaData?.page_title || `Pelayanan - Kelurahan ${displayName}`;
            document.title = title;
            document.getElementById('pageTitle').textContent = title;
            
            let description = metaData?.og_description || `Pelayanan Live Chat WhatsApp Kelurahan ${displayName}`;
            document.querySelector('meta[name="description"]')?.setAttribute('content', description);
            
            document.querySelector('meta[property="og:title"]')?.setAttribute('content', metaData?.og_title || title);
            document.querySelector('meta[property="og:description"]')?.setAttribute('content', metaData?.og_description || description);
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', metaData?.og_image || 'https://senapelan.github.io/Home/data/foto/thumbnailkelurahan.png');
            document.querySelector('meta[property="og:url"]')?.setAttribute('content', window.location.href);
            
            document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', metaData?.twitter_title || title);
            document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', metaData?.twitter_description || description);
            document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', metaData?.og_image || 'https://senapelan.github.io/Home/data/foto/thumbnailkelurahan.png');
            
            document.getElementById('kelurahanDisplayName').textContent = displayName;
            document.getElementById('pageTitleText').textContent = `Pelayanan Kelurahan ${displayName}`;
            document.getElementById('pageDescription').textContent = `Pilih petugas untuk memulai percakapan dan mendapatkan pelayanan terbaik di Kelurahan ${displayName}`;
            document.getElementById('kelurahan').value = displayName;
        }

        // =====================================================
        // RENDER PETUGAS CARDS
        // =====================================================
        function renderPetugasCards(petugasData) {
    const grid = document.getElementById('cardGrid');
    const loadingState = document.getElementById('loadingState');
    if (loadingState) loadingState.remove();
    
    if (!petugasData || petugasData.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-user-slash"></i>
                <h3>Belum Ada Petugas</h3>
                <p>Belum ada data petugas untuk kelurahan ini. Silakan tambahkan data di spreadsheet.</p>
            </div>
        `;
        return;
    }
    
    let cardsHTML = '';
    
    petugasData.forEach((petugas) => {
        const layanan = [];
        for (let i = 1; i <= 4; i++) {
            const layananKey = `layanan_${i}`;
            if (petugas[layananKey] && petugas[layananKey].trim() !== '') {
                layanan.push(petugas[layananKey]);
            }
        }
        
        if (layanan.length === 0) {
            layanan.push('Pelayanan Administrasi', 'Pelayanan Informasi', 'Pelayanan Publik', 'Pelayanan Sosial');
        }
        
        const namaPetugas = petugas.nama_petugas || 'Petugas';
        const jabatan = petugas.jabatan || 'Petugas Kelurahan';
        const nomorWa = petugas.nomor_wa || '';
        
        // === PERBAIKAN FOTO ===
        let fotoUrl = petugas.foto_url || '';
        
        // Jika URL kosong atau hanya placeholder, gunakan UI Avatars
        if (!fotoUrl || fotoUrl.trim() === '' || fotoUrl.includes('placeholder')) {
            fotoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(namaPetugas)}&background=1e6bff&color=fff&size=200&bold=true&font-size=0.5`;
        }
        
        // Buat fallback ke UI Avatars jika gambar gagal load
        const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(namaPetugas)}&background=1e6bff&color=fff&size=200&bold=true&font-size=0.5`;
        
        cardsHTML += `
            <div class="service-card">
                <div class="card-avatar">
                    <img src="${fotoUrl}" 
                         alt="${namaPetugas}" 
                         loading="lazy"
                         onerror="this.onerror=null; this.src='${fallbackUrl}'">
                </div>
                <div class="card-content">
                    <h3 class="card-name">${namaPetugas}</h3>
                    <p class="card-role">${jabatan}</p>
                    <ul class="service-list">
                        ${layanan.map(l => `<li>${l}</li>`).join('')}
                    </ul>
                    <button class="btn-conversation" onclick="openConversationModal('${namaPetugas.replace(/'/g, "\\'")}', '${nomorWa}')">
                        <i class="fab fa-whatsapp"></i> Mulai Percakapan
                    </button>
                </div>
            </div>
        `;
    });
    
    grid.innerHTML = cardsHTML;
}

        // =====================================================
        // RENDER RUNNING TEXT
        // =====================================================
        function renderRunningText(runningTextData) {
            const container = document.getElementById('runningText');
            
            if (!runningTextData || runningTextData.length === 0) {
                container.innerHTML = `
                    <span><i class="fas fa-check-circle"></i> Pelayanan terbaik lahir dari keikhlasan dan kebersamaan</span>
                    <span><i class="fas fa-users"></i> Masyarakat Sejahtera, Kelurahan Maju</span>
                `;
                return;
            }
            
            let html = '';
            const duplicated = [...runningTextData, ...runningTextData, ...runningTextData];
            
            duplicated.forEach(item => {
                const icon = item.ikon || 'fa-check-circle';
                const teks = item.teks_running || '';
                html += `<span><i class="fas ${icon}"></i> ${teks}</span>`;
            });
            
            container.innerHTML = html;
        }

        // =====================================================
        // LOAD DATA
        // =====================================================
        async function loadData() {
            const kelurahan = getKelurahanFromURL();
            currentKelurahan = kelurahan;
            
            console.log('Loading data for:', kelurahan);
            
            try {
                const data = await fetchAllData(kelurahan);
                allData = data;
                
                updateMetaTags(data.meta, data.kelurahan_info);
                renderPetugasCards(data.petugas);
                renderRunningText(data.running_text);
                
            } catch (error) {
                console.error('Error loading data:', error);
                const grid = document.getElementById('cardGrid');
                const loadingState = document.getElementById('loadingState');
                if (loadingState) loadingState.remove();
                
                grid.innerHTML = `
                    <div class="error-container">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Gagal Memuat Data</h2>
                        <p>${error.message || 'Terjadi kesalahan saat memuat data. Silakan coba lagi.'}</p>
                        <p style="font-size:0.9rem;color:var(--dark-gray);">
                            <strong>Kelurahan:</strong> ${kelurahan}<br>
                            <strong>API URL:</strong> ${API_URL}
                        </p>
                        <button class="btn-retry" onclick="location.reload()">
                            <i class="fas fa-sync"></i> Muat Ulang
                        </button>
                    </div>
                `;
            }
        }

        // =====================================================
        // MODAL FUNCTIONS
        // =====================================================
        function openConversationModal(petugasName, phoneNumber) {
            playClickSound();
            
            selectedPetugas = petugasName;
            selectedPhone = phoneNumber;
            document.getElementById('modalPetugasName').textContent = `Percakapan dengan ${petugasName}`;
            document.getElementById('conversationModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            setTimeout(() => {
                document.getElementById('nama').focus();
            }, 100);
            
            loadFormData();
        }
        
        function closeModal() {
            document.getElementById('conversationModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // =====================================================
        // FORM DATA MANAGEMENT
        // =====================================================
        function saveFormData() {
            const formData = {
                nama: document.getElementById('nama').value,
                alamat: document.getElementById('alamat').value,
                rt: document.getElementById('rt').value,
                rw: document.getElementById('rw').value,
                no_hp: document.getElementById('no_hp').value,
                email: document.getElementById('email').value,
                tujuan: document.getElementById('tujuan').value,
                tujuan_optional: document.getElementById('tujuan_optional').value
            };
            localStorage.setItem('pelayananFormData', JSON.stringify(formData));
        }
        
        function loadFormData() {
            const savedData = localStorage.getItem('pelayananFormData');
            if (savedData) {
                try {
                    const formData = JSON.parse(savedData);
                    document.getElementById('nama').value = formData.nama || '';
                    document.getElementById('alamat').value = formData.alamat || '';
                    document.getElementById('rt').value = formData.rt || '';
                    document.getElementById('rw').value = formData.rw || '';
                    document.getElementById('no_hp').value = formData.no_hp || '';
                    document.getElementById('email').value = formData.email || '';
                    document.getElementById('tujuan').value = formData.tujuan || '';
                    document.getElementById('tujuan_optional').value = formData.tujuan_optional || '';
                } catch (e) {
                    console.error('Error loading saved form data:', e);
                }
            }
        }
        
        function clearFormData() {
            localStorage.removeItem('pelayananFormData');
        }
        
        // =====================================================
        // SUBMIT CONVERSATION
        // =====================================================
        function submitConversation() {
            const nama = document.getElementById('nama').value.trim();
            const alamat = document.getElementById('alamat').value.trim();
            const rt = document.getElementById('rt').value.trim();
            const rw = document.getElementById('rw').value.trim();
            const kelurahan = document.getElementById('kelurahan').value.trim();
            const kecamatan = document.getElementById('kecamatan').value.trim();
            const kota = document.getElementById('kota').value.trim();
            const provinsi = document.getElementById('provinsi').value.trim();
            const no_hp = document.getElementById('no_hp').value.trim();
            const email = document.getElementById('email').value.trim();
            const tujuan = document.getElementById('tujuan').value;
            const tujuan_optional = document.getElementById('tujuan_optional').value.trim();
            
            if (!nama || !alamat || !rt || !rw || !no_hp || !tujuan) {
                alert('Harap isi semua field yang wajib diisi (*)');
                return;
            }
            
            const phoneRegex = /^[0-9]{10,13}$/;
            const cleanPhone = no_hp.replace(/\D/g, '');
            if (!phoneRegex.test(cleanPhone)) {
                alert('Nomor HP tidak valid. Harap masukkan 10-13 digit angka.');
                return;
            }
            
            const finalTujuan = tujuan_optional ? `${tujuan}: ${tujuan_optional}` : tujuan;
            
            const message = `Assalamualaikum Bapak/Ibu ${selectedPetugas} selamat beraktifitas

Perkenalkan,
nama saya : ${nama}
alamat : ${alamat}
RT : ${rt}
RW : ${rw}
Kelurahan : ${kelurahan}
Kecamatan : ${kecamatan}
Kota : ${kota}
Provinsi : ${provinsi}
No HP : ${no_hp}
Email : ${email}

Saya ingin memulai percakapan tentang ${finalTujuan}

Atas kesediaan waktu Bapak/Ibu, saya ucapkan terimakasih.

Percakapan ini bersumber dari Pelayanan Online Kelurahan - ${kelurahan}:
(${window.location.href})
"Senapelan Satu Pintu - Kelurahan ${kelurahan}"`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${selectedPhone}?text=${encodedMessage}`;
            
            clearFormData();
            closeModal();
            
            setTimeout(() => {
                window.open(whatsappURL, '_blank');
            }, 300);
        }

        // =====================================================
        // SETUP FORM LISTENERS
        // =====================================================
        function setupFormListeners() {
            const formElements = ['nama', 'alamat', 'rt', 'rw', 'no_hp', 'email', 'tujuan', 'tujuan_optional'];
            
            formElements.forEach(elementId => {
                const element = document.getElementById(elementId);
                if (element) {
                    element.addEventListener('input', saveFormData);
                    element.addEventListener('change', saveFormData);
                }
            });
            
            document.getElementById('no_hp').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 0) {
                    value = value.replace(/(\d{4})(\d{4})(\d+)/, '$1-$2-$3');
                }
                e.target.value = value;
            });
            
            document.getElementById('conversationForm').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const inputs = Array.from(this.querySelectorAll('input, textarea, select'));
                    const currentIndex = inputs.indexOf(document.activeElement);
                    if (currentIndex < inputs.length - 1) {
                        inputs[currentIndex + 1].focus();
                    }
                }
            });
        }

        // =====================================================
        // EVENT LISTENERS
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSoundEffect();
            setupFormListeners();
            
            document.getElementById('conversationModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
            
            loadData();
        });
        
        window.addEventListener('beforeunload', function() {
            saveFormData();
        });
    </script>
</body>
</html>
