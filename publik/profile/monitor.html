<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Kantor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 10px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header h1 { font-size: 16px; background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.05); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.online { background: #00ff00; animation: pulse 1.5s infinite; }
        .dot.offline { background: #ff4444; }
        .dot.checking { background: #ffaa00; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            aspect-ratio: 16/9;
            min-height: 200px;
        }
        #cctvFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        .video-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .rec-badge {
            display: none;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.7);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
        }
        .rec-badge.active { display: flex; }
        .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff0000; animation: pulse 1s infinite; }
        .cam-label { background: rgba(0,0,0,0.7); padding: 3px 10px; border-radius: 16px; font-size: 10px; }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 12px 8px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            background: rgba(255,255,255,0.06);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.94); opacity: 0.8; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .btn-primary { background: #3a7bd5; color: #fff; }
        .btn-danger { background: #e17055; color: #fff; }
        .btn-warning { background: #fdcb6e; color: #000; }
        .btn-success { background: #00b894; color: #fff; }
        .btn-secondary { background: #636e72; color: #fff; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-card .label { font-size: 8px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 15px; font-weight: 700; margin-top: 2px; }
        
        .logs {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.04);
            max-height: 150px;
            overflow-y: auto;
        }
        .logs h3 { font-size: 11px; color: #666; font-weight: 400; margin-bottom: 6px; }
        .log-item {
            display: flex;
            gap: 8px;
            font-size: 10px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-family: monospace;
        }
        .log-item .time { color: #666; min-width: 65px; }
        .log-item .type { color: #3a7bd5; min-width: 55px; font-weight: 600; }
        .log-item .detail { color: #aaa; word-break: break-all; }
        
        .loading {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 12px;
        }
        .loading.active { display: flex; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3a7bd5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: #888; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            z-index: 10000;
            transition: transform 0.3s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background: #00b894; color: #fff; }
        .toast-error { background: #e17055; color: #fff; }
        .toast-info { background: #0984e3; color: #fff; }
        .toast-warning { background: #fdcb6e; color: #000; }
        
        .btn-group-extra {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        
        @media (max-width: 400px) {
            .controls { grid-template-columns: repeat(2, 1fr); }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <h1>📹 CCTV Kantor</h1>
        <div class="status-badge">
            <span id="statusText">Memulai</span>
            <span class="dot checking" id="statusDot"></span>
        </div>
    </div>
    
    <div class="video-wrapper">
        <video id="cctvFeed" autoplay playsinline muted></video>
        <div class="video-overlay">
            <div class="rec-badge" id="recBadge">
                <span class="rec-dot"></span>
                <span>REC</span>
                <span id="recTimer">00:00</span>
            </div>
            <span class="cam-label" id="camLabel">PC Kantor</span>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-primary" id="btnStart">▶ Mulai</button>
        <button class="btn btn-danger" id="btnRecord" disabled>🔴 Rekam</button>
        <button class="btn btn-warning" id="btnScreenshot" disabled>📸 Foto</button>
    </div>
    
    <div class="btn-group-extra">
        <button class="btn btn-secondary" id="btnStatus">📊 Status</button>
        <button class="btn btn-secondary" id="btnClear">🗑️ Bersih</button>
    </div>
    
    <div class="stats">
        <div class="stat-card"><div class="label">Kamera</div><div class="value" id="statCam">⏹️</div></div>
        <div class="stat-card"><div class="label">Rekaman</div><div class="value" id="statRecord">0</div></div>
        <div class="stat-card"><div class="label">Foto</div><div class="value" id="statPhoto">0</div></div>
        <div class="stat-card"><div class="label">Login</div><div class="value" id="statLogin">-</div></div>
    </div>
    
    <div class="logs" id="logContainer">
        <h3>📋 Log Aktivitas</h3>
        <div id="logList">
            <div class="log-item"><span class="time">-</span><span class="type">SISTEM</span><span class="detail">Menunggu...</span></div>
        </div>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// KONFIGURASI - GANTI DENGAN URL WEB APP ANDA!
// ============================================================
const CONFIG = {
    APP_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbylzMYRmEtEflG30RceIJjqHsMIbK8Y-cMevyTwPbn5ozPnrlg_Tij2eVw4v55LGu0m/exec', // <-- GANTI
    COMPUTER_NAME: 'DESKTOP-93NJ0FE',
    USER_EMAIL: 'arsip.senapelan@gmail.com',
    SHEET_ID: '1P1ExAFeNzNuAiXl23-oaaXvWzZINix9rKm8Wjv7X5_k'
};

// ============================================================
// STATE
// ============================================================
let stream = null;
let recorder = null;
let chunks = [];
let isRecording = false;
let recStart = 0;
let timerInterval = null;
let logData = [];
let totalRecords = 0;
let totalPhotos = 0;
let isCameraStarted = false;

// ============================================================
// DOM REFS
// ============================================================
const video = document.getElementById('cctvFeed');
const btnStart = document.getElementById('btnStart');
const btnRecord = document.getElementById('btnRecord');
const btnScreenshot = document.getElementById('btnScreenshot');
const btnStatus = document.getElementById('btnStatus');
const btnClear = document.getElementById('btnClear');
const statCam = document.getElementById('statCam');
const statRecord = document.getElementById('statRecord');
const statPhoto = document.getElementById('statPhoto');
const statLogin = document.getElementById('statLogin');
const logList = document.getElementById('logList');
const recBadge = document.getElementById('recBadge');
const recTimer = document.getElementById('recTimer');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const toast = document.getElementById('toast');

// ============================================================
// UTILITY FUNCTIONS
// ============================================================

function showToast(msg, type = 'info') {
    toast.textContent = msg;
    toast.className = 'toast toast-' + type;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

function showLoading(show, text = 'Memproses...') {
    loading.classList.toggle('active', show);
    if (show) loadingText.textContent = text;
}

function addLog(type, detail) {
    const time = new Date().toLocaleString('id-ID');
    logData.unshift({ time, type, detail });
    renderLogs();
}

function renderLogs() {
    if (logData.length === 0) {
        logList.innerHTML = `<div class="log-item"><span class="time">-</span><span class="type">SISTEM</span><span class="detail">Belum ada aktivitas</span></div>`;
        return;
    }
    logList.innerHTML = logData.slice(0, 50).map(l => `
        <div class="log-item">
            <span class="time">${l.time}</span>
            <span class="type">${l.type}</span>
            <span class="detail">${l.detail}</span>
        </div>
    `).join('');
}

function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return String(m).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB';
    return (bytes/1048576).toFixed(1) + 'MB';
}

function getIP() {
    return fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => d.ip)
        .catch(() => 'Unknown');
}

// ============================================================
// KIRIM KE GOOGLE APPS SCRIPT
// ============================================================

async function sendToServer(data) {
    try {
        const payload = {
            ...data,
            timestamp: new Date().toISOString(),
            spreadsheetId: CONFIG.SHEET_ID
        };
        
        const response = await fetch(CONFIG.APP_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
        
    } catch (error) {
        console.error('Send error:', error);
        throw new Error('Gagal koneksi ke server');
    }
}

// ============================================================
// FUNGSI UTAMA
// ============================================================

// 1. MULAI CCTV
async function startCCTV() {
    try {
        showLoading(true, 'Mengakses kamera...');
        
        // Cek dukungan browser
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('Browser tidak mendukung kamera');
        }
        
        // Minta izin dengan constraint yang kompatibel HP
        const constraints = {
            video: {
                facingMode: { ideal: 'environment' }, // Untuk HP, coba kamera belakang
                width: { min: 640, ideal: 1280 },
                height: { min: 480, ideal: 720 }
            },
            audio: false // Matikan audio untuk mengurangi error
        };
        
        // Coba dengan kamera depan dulu
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false
            });
        } catch (e) {
            // Coba tanpa facingMode
            stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 },
                audio: false
            });
        }
        
        video.srcObject = stream;
        await video.play();
        
        isCameraStarted = true;
        statCam.textContent = '✅ Online';
        statCam.style.color = '#00b894';
        btnStart.disabled = true;
        btnStart.textContent = '✅ Aktif';
        btnRecord.disabled = false;
        btnScreenshot.disabled = false;
        
        statLogin.textContent = new Date().toLocaleString('id-ID');
        addLog('START', 'CCTV dimulai di HP');
        
        // Kirim login
        const ip = await getIP();
        await sendToServer({
            action: 'login',
            user: CONFIG.USER_EMAIL,
            ip: ip,
            browser: navigator.userAgent,
            computer: CONFIG.COMPUTER_NAME + ' (HP)'
        });
        
        showToast('✅ CCTV aktif', 'success');
        updateStatus('online');
        
    } catch (error) {
        console.error('Error:', error);
        statCam.textContent = '❌ Error';
        statCam.style.color = '#e17055';
        showToast('❌ ' + error.message, 'error');
        addLog('ERROR', error.message);
    } finally {
        showLoading(false);
    }
}

// 2. REKAM VIDEO
function toggleRecord() {
    if (isRecording) stopRecord();
    else startRecord();
}

function startRecord() {
    if (!stream) { showToast('Kamera belum aktif!', 'warning'); return; }
    
    chunks = [];
    try {
        // Coba dengan codec yang didukung
        let options = { mimeType: 'video/webm;codecs=vp8' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }
        recorder = new MediaRecorder(stream, options);
    } catch (e) {
        recorder = new MediaRecorder(stream);
    }
    
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = saveRecord;
    recorder.start(1000);
    
    isRecording = true;
    recStart = Date.now();
    btnRecord.textContent = '⏹️ Stop';
    btnRecord.className = 'btn btn-secondary';
    recBadge.classList.add('active');
    timerInterval = setInterval(() => {
        recTimer.textContent = formatTime(Date.now() - recStart);
    }, 1000);
    
    addLog('RECORD', 'Mulai rekaman');
    showToast('⏺️ Merekam...', 'info');
}

function stopRecord() {
    if (recorder && recorder.state !== 'inactive') {
        recorder.stop();
        isRecording = false;
        btnRecord.textContent = '🔴 Rekam';
        btnRecord.className = 'btn btn-danger';
        recBadge.classList.remove('active');
        clearInterval(timerInterval);
        recTimer.textContent = '00:00';
        addLog('RECORD', 'Rekaman dihentikan');
        showToast('⏹️ Menyimpan...', 'info');
    }
}

function saveRecord() {
    if (chunks.length === 0) {
        showToast('Tidak ada data', 'warning');
        return;
    }
    
    const blob = new Blob(chunks, { type: 'video/webm' });
    if (blob.size > 50 * 1024 * 1024) {
        showToast('File terlalu besar!', 'warning');
        return;
    }
    
    showLoading(true, 'Upload rekaman...');
    
    const reader = new FileReader();
    reader.onloadend = async function() {
        try {
            const base64 = reader.result.split(',')[1];
            const duration = formatTime(Date.now() - recStart);
            
            const result = await sendToServer({
                action: 'record',
                file: base64,
                duration: duration,
                size: formatSize(blob.size),
                computer: CONFIG.COMPUTER_NAME,
                user: CONFIG.USER_EMAIL
            });
            
            if (result.status === 'success') {
                totalRecords++;
                statRecord.textContent = totalRecords;
                addLog('SAVED', 'Rekaman: ' + (result.fileName || 'OK'));
                showToast('✅ Rekaman tersimpan!', 'success');
            } else {
                throw new Error(result.message || 'Gagal');
            }
        } catch (error) {
            console.error(error);
            showToast('❌ Gagal upload', 'error');
            addLog('ERROR', 'Gagal upload rekaman');
        } finally {
            showLoading(false);
        }
    };
    reader.onerror = () => { showLoading(false); showToast('❌ Gagal baca file', 'error'); };
    reader.readAsDataURL(blob);
}

// 3. SCREENSHOT
async function takePhoto() {
    if (!stream) { showToast('Kamera belum aktif!', 'warning'); return; }
    
    try {
        showLoading(true, 'Ambil foto...');
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const now = new Date();
        ctx.font = 'bold 12px Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText('📹 CCTV Kantor', 10, 25);
        ctx.font = '10px Arial';
        ctx.fillText(now.toLocaleString('id-ID'), 10, 42);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
        
        const imageData = canvas.toDataURL('image/png');
        
        const result = await sendToServer({
            action: 'screenshot',
            image: imageData,
            notes: now.toLocaleString('id-ID'),
            computer: CONFIG.COMPUTER_NAME,
            user: CONFIG.USER_EMAIL
        });
        
        if (result.status === 'success') {
            totalPhotos++;
            statPhoto.textContent = totalPhotos;
            addLog('PHOTO', 'Foto: ' + (result.fileName || 'OK'));
            showToast('📸 Foto tersimpan!', 'success');
        } else {
            throw new Error(result.message || 'Gagal');
        }
    } catch (error) {
        console.error(error);
        showToast('❌ Gagal foto', 'error');
        addLog('ERROR', 'Gagal ambil foto');
    } finally {
        showLoading(false);
    }
}

// 4. CEK STATUS
async function checkStatus() {
    try {
        showLoading(true, 'Cek status...');
        const result = await sendToServer({ action: 'status' });
        if (result.status === 'online') {
            showToast('✅ Server Online', 'success');
            updateStatus('online');
            addLog('STATUS', 'Server online');
        }
    } catch (error) {
        showToast('❌ Server offline', 'error');
        updateStatus('offline');
        addLog('STATUS', 'Server offline');
    } finally {
        showLoading(false);
    }
}

function updateStatus(state) {
    statusText.textContent = state === 'online' ? 'Online' : 'Offline';
    statusDot.className = 'dot ' + state;
}

// ============================================================
// EVENT LISTENERS
// ============================================================

btnStart.addEventListener('click', startCCTV);
btnStart.addEventListener('touchend', (e) => { e.preventDefault(); startCCTV(); });

btnRecord.addEventListener('click', toggleRecord);
btnRecord.addEventListener('touchend', (e) => { e.preventDefault(); toggleRecord(); });

btnScreenshot.addEventListener('click', takePhoto);
btnScreenshot.addEventListener('touchend', (e) => { e.preventDefault(); takePhoto(); });

btnStatus.addEventListener('click', checkStatus);
btnStatus.addEventListener('touchend', (e) => { e.preventDefault(); checkStatus(); });

btnClear.addEventListener('click', () => {
    if (confirm('Hapus semua log lokal?')) {
        logData = [];
        renderLogs();
        showToast('Log dihapus', 'info');
    }
});

// ============================================================
// INISIALISASI
// ============================================================

console.log('🚀 CCTV Kantor System');
console.log('📧', CONFIG.USER_EMAIL);
console.log('💻', CONFIG.COMPUTER_NAME);
console.log('🔗', CONFIG.APP_SCRIPT_URL);
console.log('📱', navigator.userAgent);

// Cek koneksi saat startup
(async function init() {
    try {
        updateStatus('checking');
        statusText.textContent = 'Menghubungi...';
        
        const result = await sendToServer({ action: 'status' });
        if (result.status === 'online') {
            updateStatus('online');
            addLog('SISTEM', '✅ Terhubung ke server');
            showToast('✅ Sistem siap', 'success');
        }
    } catch (error) {
        updateStatus('offline');
        addLog('SISTEM', '❌ Gagal koneksi ke server');
        showToast('⚠️ Gagal koneksi ke server', 'warning');
        console.error('Init error:', error);
    }
})();

// Auto cek status tiap 30 detik
setInterval(async () => {
    try {
        const result = await sendToServer({ action: 'status' });
        if (result.status === 'online') updateStatus('online');
        else updateStatus('offline');
    } catch {
        updateStatus('offline');
    }
}, 30000);
</script>
</body>
</html>
