<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login | Bank Sampah Senapelan</title>
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://senapelan.github.io/Home/publik/senapelankencana/banksampah/login.html">
    <meta property="og:title" content="Bank Sampah Senapelan - Sistem Informasi">
    <meta property="og:description" content="Sistem informasi dan pengelolaan Bank Sampah Kecamatan Senapelan. Mawar Utama, Lorong Utama, Kemuning">
    <meta property="og:site_name" content="Bank Sampah Senapelan">
    
    <!-- Gambar preview -->
    <meta property="og:image" content="https://senapelan.github.io/Home/data/foto/BANKSAMPAH.png">
    <meta property="og:image:secure_url" content="https://senapelan.github.io/Home/data/foto/BANKSAMPAH.png">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Bank Sampah Senapelan">
    <meta name="twitter:description" content="Sistem informasi Bank Sampah Senapelan">
    <meta name="twitter:image" content="https://senapelan.github.io/Home/data/foto/BANKSAMPAH.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://senapelan.github.io/Home/data/foto/BANKSAMPAH.png">
    <link rel="apple-touch-icon" href="https://senapelan.github.io/Home/data/foto/BANKSAMPAH.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Overlay hijau tipis - tema bank sampah */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 60, 30, 0.55), rgba(0, 80, 40, 0.45));
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 460px;
            margin: 1.5rem;
            animation: fadeSlideUp 0.6s ease;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* EFEK KACA */
        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-3px);
        }

        .brand {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .brand img {
            width: 180px;
            height: auto;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            padding: 8px;
        }

        .brand h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a8ffc0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 4px;
        }

        /* Kategori Select Styling */
        .category-group {
            margin-bottom: 1.3rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
        }

        .category-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            transition: all 0.2s;
            outline: none;
            color: white;
            cursor: pointer;
        }

        .category-select option {
            background: #1a4d2a;
            color: white;
        }

        .category-select:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(100, 255, 150, 0.3);
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            transition: all 0.2s;
            outline: none;
            color: white;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(100, 255, 150, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(105deg, #2d6a4f, #40916c);
            border: none;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #3b825f, #52b788);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(220, 60, 60, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .info-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 16px;
            border-radius: 30px;
        }

        .info-banksampah {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            color: #ccffcc;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .info-banksampah span {
            background: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
            .brand h2 { font-size: 1.2rem; }
            .brand img { width: 100px; }
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://senapelan.github.io/Home/data/video/home.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <img src="https://senapelan.github.io/Home/publik/senapelankencana/image/fac_senapelan_kencana.png" alt="Logo Bank Sampah Senapelan">
                <h2>🌿 BANK SAMPAH SENAPELAN 🌿</h2>
                <p>Sistem Informasi & Pengelolaan</p>
            </div>

            <form id="loginForm">
                <!-- Pilihan Kategori Bank Sampah -->
                <div class="category-group">
                    <div class="input-label">
                        <span>🗑️</span>
                        <span>Pilih Bank Sampah</span>
                    </div>
                    <select id="bankCategory" class="category-select" required>
                        <option value="" disabled selected>-- Pilih Kategori --</option>
                        <option value="MAWAR_UTAMA">🌹 Mawar Utama</option>
                        <option value="LORONG_UTAMA">🏘️ Lorong Utama</option>
                        <option value="KEMUNING">🌼 Kemuning</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>👤</span>
                        <span>Username</span>
                    </div>
                    <input type="text" id="username" class="input-field" placeholder="Masukkan username" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>🔒</span>
                        <span>Password</span>
                    </div>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="off" required>
                </div>

                <button type="submit" id="loginButton" class="login-btn">
                    <span>♻️</span>
                    <span>MASUK</span>
                </button>
            </form>

            <div id="errorBox" style="min-height: 65px;"></div>
            
            <div class="info-banksampah">
                <span>🌹 Mawar Utama</span>
                <span>🏘️ Lorong Utama</span>
                <span>🌼 Kemuning</span>
            </div>
            
            <div class="info-footer">
                <span>♻️</span> Bank Sampah Senapelan - Inovasi REIN RIZKA KARVY, S.STP., M.Si
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Apps Script dengan Spreadsheet ID yang diberikan
        const SPREADSHEET_ID = "1GDWfulRCusHXNZgUzeFfChZZoX9Nat_5BkvrSeRfoZI";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyz61k5gdObTBNrzFx1fw-OJ_JzAo6QjaP_-RBZkz61iFBSnXpodsReElDfqKhyrhLtXA/exec";
        
        // Mapping kategori ke sheet name
        const SHEET_CONFIG = {
            "MAWAR_UTAMA": {
                sheetName: "ADMIN_MU",
                bankName: "Mawar Utama",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/adminbanksampahsenapelan.html"
            },
            "LORONG_UTAMA": {
                sheetName: "ADMIN_LU",
                bankName: "Lorong Utama",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/adminbanksampahsenapelan.html"
            },
            "KEMUNING": {
                sheetName: "ADMIN_KEMUNING",
                bankName: "Kemuning",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/adminbanksampahsenapelan.html"
            }
        };
        
        const loginForm = document.getElementById('loginForm');
        const categorySelect = document.getElementById('bankCategory');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginButton');
        const errorContainer = document.getElementById('errorBox');
        
        function showError(msg) {
            errorContainer.innerHTML = `<div class="error-message"><span>⚠️</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 4500);
        }
        
        function showSuccess(msg) {
            errorContainer.innerHTML = `<div class="success-message"><span>✅</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 3000);
        }
        
        function setLoading(isLoad) {
            if(isLoad) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = `<span class="loader"></span> <span>Memverifikasi...</span>`;
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>♻️</span> <span>MASUK</span>`;
            }
        }
        
        // Tambahkan style loader jika belum ada
        if (!document.querySelector('#loader-style')) {
            const style = document.createElement('style');
            style.id = 'loader-style';
            style.textContent = `
                .loader {
                    display: inline-block;
                    width: 16px;
                    height: 16px;
                    border: 2px solid rgba(255,255,255,0.3);
                    border-radius: 50%;
                    border-top-color: white;
                    animation: spin 0.6s linear infinite;
                }
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
        
        // Fungsi autentikasi ke Apps Script
        async function authenticateUser(category, username, password) {
            try {
                const config = SHEET_CONFIG[category];
                if (!config) {
                    return { success: false, message: "Kategori tidak valid!" };
                }
                
                // Kirim request ke Apps Script dengan parameter yang sesuai
                const url = `${APPS_SCRIPT_URL}?action=login&spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(config.sheetName)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return data;
            } catch (err) {
                console.error('Auth error:', err);
                return { success: false, message: `Gagal terhubung ke server: ${err.message}` };
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            errorContainer.innerHTML = '';
            
            const selectedCategory = categorySelect.value;
            if (!selectedCategory) {
                return showError("Silakan pilih kategori Bank Sampah terlebih dahulu!");
            }
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username) return showError("Username tidak boleh kosong!");
            if (!password) return showError("Password tidak boleh kosong!");
            
            setLoading(true);
            
            const result = await authenticateUser(selectedCategory, username, password);
            setLoading(false);
            
            if (result && result.success === true) {
                const config = SHEET_CONFIG[selectedCategory];
                
                // Simpan data session
                sessionStorage.setItem('banksampah_loggedIn', 'true');
                sessionStorage.setItem('banksampah_category', selectedCategory);
                sessionStorage.setItem('banksampah_bankName', config.bankName);
                sessionStorage.setItem('banksampah_username', username);
                sessionStorage.setItem('banksampah_userFullName', result.name || username);
                if (result.photoUrl) {
                    sessionStorage.setItem('banksampah_photoUrl', result.photoUrl);
                }
                
                showSuccess(`Login berhasil sebagai ${config.bankName}! Mengalihkan...`);
                
                setTimeout(() => {
                    window.location.href = config.redirectUrl;
                }, 1200);
            } else {
                let errorMsg = result?.message || "Username atau password salah.";
                // Tambahkan info kategori jika perlu
                if (errorMsg.includes("tidak ditemukan") || errorMsg.includes("credentials")) {
                    errorMsg = "Username atau password tidak sesuai dengan kategori yang dipilih.";
                }
                showError(errorMsg);
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
        
        loginForm.addEventListener('submit', handleLogin);
        
        // Auto focus ke kategori dulu biar pengguna ingat pilih
        categorySelect.focus();
        
        // Set pesan default ketika klik tanpa kategori
        categorySelect.addEventListener('change', function() {
            if (categorySelect.value) {
                usernameInput.focus();
            }
        });
        
        // Tambahkan info dev
        console.log("Bank Sampah Login System - Spreadsheet ID:", SPREADSHEET_ID);
    </script>
</body>
</html>
