<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login | Senapelan Kencana</title>
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://senapelan.github.io/Home/publik/senapelankencana/login.html">
    <meta property="og:title" content="Login | Senapelan Kencana - Inovasi Camat Senapelan">
    <meta property="og:description" content="Akses sistem Kendali dan evaluasi network center analisis. Inovasi Camat Senapelan REIN RIZKA KARVY, S.STP., M.Si. Senapelan Hebat - Pekanbaru Aman">
    <meta property="og:site_name" content="Senapelan Kencana">
    
    <!-- Gambar preview - Ukuran diperbesar untuk WhatsApp -->
    <meta property="og:image" content="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    <meta property="og:image:secure_url" content="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    <meta property="og:image:width" content="512">

    <meta property="og:image:alt" content="Logo Senapelan Kencana">
    
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Login | Senapelan Kencana">
    <meta name="twitter:description" content="Akses sistem Kendali dan evaluasi network center analisis. Inovasi Camat Senapelan REIN RIZKA KARVY, S.STP., M.Si.">
    <meta name="twitter:image" content="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    <meta name="twitter:image:alt" content="Logo Senapelan Kencana">
    
    <!-- WhatsApp Specific -->
    <meta property="og:image" content="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    <link rel="apple-touch-icon" href="https://senapelan.github.io/Home/assets/metatag/senapelankencanalogo/senapelankencana512.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Overlay tipis agar teks tetap terbaca */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 20, 40, 0.5), rgba(0, 40, 70, 0.4));
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 440px;
            margin: 1.5rem;
            animation: fadeSlideUp 0.6s ease;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* EFEK KACA */
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(0,3px);
            border-radius: 2rem;
            padding: 0.2rem 1rem 0.2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand img {
            width: 200px;
            height: auto;
            margin-bottom: 0.1rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
        }

        .brand h2 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a0d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 2px;
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 6px;
        }

        /* Container untuk input password dengan tombol show/hide */
        .password-container {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            outline: none;
            color: white;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        /* Tombol Show/Hide Password */
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 1);
        }

        /* Container untuk checkbox remember me */
        .remember-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1rem 0 0.5rem 0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2c7eb6;
        }

        .checkbox-wrapper span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .login-btn {
            width: 100%;
            padding: 5px;
            background: linear-gradient(105deg, #1a5f8b, #2c7eb6);
            border: none;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #2273a3, #3a91cf);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Tombol Lupa Password */
        .forgot-password-btn {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.75rem;
            backdrop-filter: blur(5px);
        }

        .forgot-password-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .error-message {
            background: rgba(220, 60, 60, 0.9);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.9);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .info-footer {
            text-align: center;
            margin-top: 0.1rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.3);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 5px 14px;
            border-radius: 30px;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
            .brand h2 { font-size: 1.4rem; }
            .brand img { width: 200px; }
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://senapelan.github.io/Home/data/video/home.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <img src="https://senapelan.github.io/Home/publik/senapelankencana/image/fac_senapelan_kencana.png" alt="Logo Senapelan Kencana">
                <h2>SENAPELAN KENCANA</h2>
                <p>Kendali dan evaluasi network center analisis</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <div class="input-label">
                        <span>👤</span>
                        <span>Username</span>
                    </div>
                    <input type="text" id="username" class="input-field" placeholder="Masukkan username" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <div class="input-label">
                        <span>🔒</span>
                        <span>Password</span>
                    </div>
                    <div class="password-container">
                        <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="off" required>
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="remember-container">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberCheckbox">
                        <span>💾 Ingat Saya</span>
                    </label>
                </div>

                <button type="submit" id="loginButton" class="login-btn">
                    <span>🚪</span>
                    <span>LOGIN</span>
                </button>
            </form>

            <!-- Tombol Lupa Password -->
            <button id="forgotPasswordBtn" class="forgot-password-btn">
                <span>🔐</span>
                <span>Lupa Password ?</span>
            </button>

            <div id="errorBox" style="min-height: 65px;"></div>
            <div class="info-footer">
                <span>🗄️</span> Senapelan Kencana - Inovasi REIN RIZKA KARVY, S.STP., M.Si
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Apps Script
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqHrTRt9i-QLUMDzJ7Ce2pFSolfqa-IMBJH5-0a-5fT9Q2q1bEToLOxmt1REdcS_0Rxg/exec";
        
        // Nomor WhatsApp tujuan (format internasional tanpa +)
        const WA_NUMBER = "6282170089590";
        // Pesan otomatis yang akan dikirim via WhatsApp
        const WA_MESSAGE = "Assalamualaikum admin Senapelan Kencana, saya mau login di Aplikasi Senapelan Kencana. Mohon kirimkan Username dan password, terima kasih.";
        
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginButton');
        const errorContainer = document.getElementById('errorBox');
        const forgotBtn = document.getElementById('forgotPasswordBtn');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const rememberCheckbox = document.getElementById('rememberCheckbox');
        
        // Storage key untuk remember me
        const STORAGE_USERNAME_KEY = 'saved_username';
        const STORAGE_PASSWORD_KEY = 'saved_password';
        const STORAGE_REMEMBER_KEY = 'remember_me';
        
        function showError(msg) {
            errorContainer.innerHTML = `<div class="error-message"><span>⚠️</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 4000);
        }
        
        function showSuccess(msg) {
            errorContainer.innerHTML = `<div class="success-message"><span>✅</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 3000);
        }
        
        function setLoading(isLoad) {
            if(isLoad) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = `<span class="loader"></span> <span>Memverifikasi...</span>`;
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>🚪</span> <span>LOGIN</span>`;
            }
        }
        
        // Fungsi untuk membuka WhatsApp dengan pesan otomatis
        function openWhatsApp() {
            const encodedMessage = encodeURIComponent(WA_MESSAGE);
            const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        }
        
        // Fungsi untuk menyimpan data login (remember me)
        function saveCredentials(username, password, isChecked) {
            if (isChecked) {
                localStorage.setItem(STORAGE_USERNAME_KEY, username);
                localStorage.setItem(STORAGE_PASSWORD_KEY, password);
                localStorage.setItem(STORAGE_REMEMBER_KEY, 'true');
            } else {
                localStorage.removeItem(STORAGE_USERNAME_KEY);
                localStorage.removeItem(STORAGE_PASSWORD_KEY);
                localStorage.setItem(STORAGE_REMEMBER_KEY, 'false');
            }
        }
        
        // Fungsi untuk memuat data login yang tersimpan
        function loadSavedCredentials() {
            const remember = localStorage.getItem(STORAGE_REMEMBER_KEY);
            if (remember === 'true') {
                const savedUsername = localStorage.getItem(STORAGE_USERNAME_KEY);
                const savedPassword = localStorage.getItem(STORAGE_PASSWORD_KEY);
                
                if (savedUsername) {
                    usernameInput.value = savedUsername;
                    rememberCheckbox.checked = true;
                }
                if (savedPassword) {
                    passwordInput.value = savedPassword;
                }
            } else {
                rememberCheckbox.checked = false;
            }
        }
        
        // Fungsi toggle show/hide password
        function togglePasswordVisibility() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Ubah icon mata
            togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
        }
        
        async function authenticateUser(user, pass) {
            try {
                const url = `${APPS_SCRIPT_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
                const res = await fetch(url);
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch(err) {
                console.error('Auth error:', err);
                return { success: false, message: `Gagal konek: ${err.message}` };
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            errorContainer.innerHTML = '';
            
            const user = usernameInput.value.trim();
            const pass = passwordInput.value;
            const remember = rememberCheckbox.checked;
            
            if(!user) return showError("Username tidak boleh kosong!");
            if(!pass) return showError("Password tidak boleh kosong!");
            
            setLoading(true);
            const result = await authenticateUser(user, pass);
            setLoading(false);
            
            if(result && result.success === true) {
                // Simpan credentials jika remember me dicentang
                saveCredentials(user, pass, remember);
                
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', user);
                sessionStorage.setItem('adminName', result.name || user);
                showSuccess("Login berhasil! Mengalihkan...");
                setTimeout(() => {
                    window.location.href = "dashboard_kencana.html";
                }, 1000);
            } else {
                showError(result?.message || "Username atau password salah.");
                passwordInput.value = '';
                passwordInput.focus();
                // Jika login gagal dan remember me tidak dicentang, hapus data
                if (!remember) {
                    localStorage.removeItem(STORAGE_USERNAME_KEY);
                    localStorage.removeItem(STORAGE_PASSWORD_KEY);
                }
            }
        }
        
        // Event listeners
        forgotBtn.addEventListener('click', openWhatsApp);
        loginForm.addEventListener('submit', handleLogin);
        togglePasswordBtn.addEventListener('click', togglePasswordVisibility);
        
        // Load saved credentials saat halaman dimuat
        loadSavedCredentials();
        
        // Optional: Auto focus on username
        usernameInput.focus();
    </script>
</body>
</html>
