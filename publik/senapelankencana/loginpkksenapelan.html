    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Overlay Hijau campur Biru PKK */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 100, 80, 0.55), rgba(25, 80, 120, 0.5));
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 460px;
            margin: 1.5rem;
            animation: fadeSlideUp 0.6s ease;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* EFEK KACA */
        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-3px);
        }

        /* Logo berpasangan (kiri dan kanan) */
        .brand {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-pair {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .logo-pair img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 8px;
        }

        @media (max-width: 480px) {
            .logo-pair img {
                width: 60px;
                height: 60px;
            }
        }

        .brand h2 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a8e0ff, #a8ffc0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 4px;
        }

        /* Kategori Select Styling */
        .category-group {
            margin-bottom: 1.3rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
        }

        .category-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            transition: all 0.2s;
            outline: none;
            color: white;
            cursor: pointer;
        }

        .category-select option {
            background: #1a5d6a;
            color: white;
        }

        .category-select:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(100, 200, 200, 0.3);
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            transition: all 0.2s;
            outline: none;
            color: white;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(100, 200, 200, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(105deg, #1a7a6a, #2c6e9e);
            border: none;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #22967a, #3a80b5);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(220, 60, 60, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #ffc107;
        }

        .info-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 16px;
            border-radius: 30px;
        }

        .info-pkk {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            color: #ccffee;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .info-pkk span {
            background: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
            .brand h2 { font-size: 1.1rem; }
        }

</head>
<body>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://senapelan.github.io/Home/data/video/home.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="logo-pair">
                    <img src="https://senapelan.github.io/Home/data/foto/LOGO%20PKK.png" alt="Logo PKK">
                    <img src="https://senapelan.github.io/Home/data/foto/PKK%20MART%20LOGO.png" alt="Logo PKK MART">
                </div>
                <h2>🌟 PKK MART BERSINAR 🌟</h2>
                <p>Sistem Informasi & Pengelolaan</p>
            </div>

            <form id="loginForm">
                <!-- Pilihan Kategori/Kelurahan -->
                <div class="category-group">
                    <div class="input-label">
                        <span>🏢</span>
                        <span>Pilih Kelurahan</span>
                    </div>
                    <select id="pkkCategory" class="category-select" required>
                        <option value="" disabled selected>-- Pilih Kelurahan --</option>
                        <option value="KB">👥 Kampung Baru</option>
                        <option value="KAMBAN">👥 Kampung Bandar</option>
                        <option value="KD">👥 Kampung Dalam</option>
                        <option value="PB">👥 Padang Bulan</option>
                        <option value="PT">👥 Padang Terubuk</option>
                        <option value="SG">👥 Sago</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>👤</span>
                        <span>Username</span>
                    </div>
                    <input type="text" id="username" class="input-field" placeholder="Masukkan username" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <div class="input-label">
                        <span>🔒</span>
                        <span>Password</span>
                    </div>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="off" required>
                </div>

                <button type="submit" id="loginButton" class="login-btn">
                    <span>✨</span>
                    <span>MASUK</span>
                </button>
            </form>

            <div id="errorBox" style="min-height: 65px;"></div>
            
            <div class="info-pkk">
                <span>👥 KB</span>
                <span>👥 KAMBAN</span>
                <span>👥 KD</span>
                <span>👥 PB</span>
                <span>👥 PT</span>
                <span>👥 SG</span>
            </div>
            
            <div class="info-footer">
                <span>🌟</span> PKK MART BERSINAR - Sistem Informasi PKK
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Apps Script dengan Spreadsheet ID yang baru
        const SPREADSHEET_ID = "1P1kzFFSiEc-VIsX1Fbi_UwV4Q7eV9DEu7rLUOvGQulY";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVlUAuiVZwn1DTSTP1uX01-LthBaRLPISG5LC5zYPuejCJyS6kpIqx2aoBJteMzcdsRw/exec";
        
        // Mapping kategori ke sheet name (sesuai dengan nama sheet yang diberikan)
        const SHEET_CONFIG = {
            "KB": {
                sheetName: "ADMIN_KB",
                groupName: "KB",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            },
            "KAMBAN": {
                sheetName: "ADMIN_KAMBAN",
                groupName: "KAMBAN",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            },
            "KD": {
                sheetName: "ADMIN_KD",
                groupName: "KD",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            },
            "PB": {
                sheetName: "ADMIN_PB",
                groupName: "PB",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            },
            "PT": {
                sheetName: "ADMIN_PT",
                groupName: "PT",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            },
            "SG": {
                sheetName: "ADMIN_SG",
                groupName: "SG",
                redirectUrl: "https://senapelan.github.io/Home/publik/senapelankencana/dashboardpkk.html"
            }
        };
        
        const loginForm = document.getElementById('loginForm');
        const categorySelect = document.getElementById('pkkCategory');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginButton');
        const errorContainer = document.getElementById('errorBox');
        
        function showError(msg) {
            errorContainer.innerHTML = `<div class="error-message"><span>⚠️</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 4500);
        }
        
        function showSuccess(msg) {
            errorContainer.innerHTML = `<div class="success-message"><span>✅</span> <span>${msg}</span></div>`;
            setTimeout(() => { 
                if(errorContainer.innerHTML) errorContainer.innerHTML = ''; 
            }, 3000);
        }
        
        function setLoading(isLoad) {
            if(isLoad) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = `<span class="loader"></span> <span>Memverifikasi...</span>`;
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>✨</span> <span>MASUK</span>`;
            }
        }
        
        // Tambahkan style loader jika belum ada
        if (!document.querySelector('#loader-style')) {
            const style = document.createElement('style');
            style.id = 'loader-style';
            style.textContent = `
                .loader {
                    display: inline-block;
                    width: 16px;
                    height: 16px;
                    border: 2px solid rgba(255,255,255,0.3);
                    border-radius: 50%;
                    border-top-color: white;
                    animation: spin 0.6s linear infinite;
                }
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
        
        // Fungsi autentikasi ke Apps Script
        async function authenticateUser(category, username, password) {
            try {
                const config = SHEET_CONFIG[category];
                if (!config) {
                    return { success: false, message: "Kelurahan tidak valid!" };
                }
                
                // Kirim request ke Apps Script dengan parameter yang sesuai
                const url = `${APPS_SCRIPT_URL}?action=login&spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(config.sheetName)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                return data;
            } catch (err) {
                console.error('Auth error:', err);
                return { success: false, message: `Gagal terhubung ke server: ${err.message}` };
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            errorContainer.innerHTML = '';
            
            const selectedCategory = categorySelect.value;
            if (!selectedCategory) {
                return showError("Silakan pilih Kelurahan terlebih dahulu!");
            }
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username) return showError("Username tidak boleh kosong!");
            if (!password) return showError("Password tidak boleh kosong!");
            
            setLoading(true);
            
            const result = await authenticateUser(selectedCategory, username, password);
            setLoading(false);
            
            if (result && result.success === true) {
                const config = SHEET_CONFIG[selectedCategory];
                
                // Simpan data session
                sessionStorage.setItem('pkk_loggedIn', 'true');
                sessionStorage.setItem('pkk_category', selectedCategory);
                sessionStorage.setItem('pkk_groupName', config.groupName);
                sessionStorage.setItem('pkk_username', username);
                sessionStorage.setItem('pkk_userFullName', result.name || username);
                if (result.photoUrl) {
                    sessionStorage.setItem('pkk_photoUrl', result.photoUrl);
                }
                
                showSuccess(`Login berhasil sebagai Kelurahan ${config.groupName}! Mengalihkan...`);
                
                setTimeout(() => {
                    window.location.href = config.redirectUrl;
                }, 1200);
            } else {
                let errorMsg = result?.message || "Username atau password salah.";
                if (errorMsg.includes("tidak ditemukan") || errorMsg.includes("credentials")) {
                    errorMsg = "Username atau password tidak sesuai dengan Kelurahan yang dipilih.";
                }
                showError(errorMsg);
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
        
        loginForm.addEventListener('submit', handleLogin);
        
        categorySelect.focus();
        
        categorySelect.addEventListener('change', function() {
            if (categorySelect.value) {
                usernameInput.focus();
            }
        });
        
        console.log("PKK MART BERSINAR Login System - Spreadsheet ID:", SPREADSHEET_ID);
    </script>
</body>
</html>
