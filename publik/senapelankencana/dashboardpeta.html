<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Wilayah - Senapelan Kencana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .map-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }
        .map-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .map-title h2 {
            color: #0a2a3a;
            font-size: 1.8rem;
        }
        .map-title p {
            color: #6c757d;
            margin-top: 5px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        @media (max-width: 768px) {
            iframe {
                height: 450px;
            }
            .map-title h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div class="map-title">
            <h2>🗺️ PETA WILAYAH KECAMATAN SENAPELAN</h2>
            <p>Kecamatan Senapelan - Pekanbaru, Riau</p>
        </div>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d9465.01409574012!2d101.4358219294975!3d0.5360524126969863!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31d5ac745b5bc549%3A0xfe07919eb5876a60!2sSenapelan%2C%20Pekanbaru%20City%2C%20Riau!5e1!3m2!1sen!2sid!4v1780745151029!5m2!1sen!2sid" 
            width="100%" 
            height="600" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
</body>
</html>
