        /* ... CSS sama seperti sebelumnya ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea; --primary-dark: #5a67d8; --secondary: #764ba2;
            --success: #48bb78; --warning: #ed8936; --danger: #fc8181;

        .main-content { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 16px; transition: var(--transition); }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 20px; flex-shrink: 0; }

        .filter-group input, .filter-group select { padding: 10px 16px; border: 2px solid var(--gray-300); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; transition: var(--transition); background: var(--white); flex: 1; min-width: 150px; }

        .card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: var(--transition); animation: fadeInUp 0.5s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-slider { position: relative; height: 260px; background: var(--gray-100); overflow: hidden; }

        .card-slider .slide img { width: 100%; height: 100%; object-fit: cover; }

        .card-slider .slide .no-image i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: var(--white); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 14px; transition: var(--transition); z-index: 5; backdrop-filter: blur(5px); }
        .slider-btn:hover { background: rgba(0,0,0,0.8); }
        .slider-btn.prev { left: 8px; }

        .slider-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }

        .card-badge { position: absolute; top: 12px; right: 12px; padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; z-index: 5; backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
        .badge-sudah { background: rgba(72,187,120,0.9); color: white; }

        .card-body { padding: 16px 20px 20px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: start; }

        .card-footer .coordinator i { color: var(--primary); }
        .card-actions { display: flex; gap: 8px; }
        .btn-edit { background: var(--primary); color: var(--white); border: none; padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 4px; }
        .btn-edit:hover { background: var(--primary-dark); transform: scale(1.05); }
        .btn-delete { background: var(--danger); color: var(--white); border: none; padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 4px; }
        .btn-delete:hover { opacity: 0.8; transform: scale(1.05); }
        .loading-container { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--gray-500); }
        .loading-container.active { display: flex; }
        .loader { width: 48px; height: 48px; border: 4px solid var(--gray-300); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-500); grid-column: 1 / -1; }
        .empty-state i { font-size: 64px; opacity: 0.3; margin-bottom: 16px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; animation: fadeIn 0.3s ease; }
        .modal.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--white); border-radius: var(--radius); width: 92%; max-width: 720px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-300); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--white); z-index: 10; border-radius: var(--radius) var(--radius) 0 0; }
        .modal-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--dark); }
        .modal-header h2 i { color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 24px; color: var(--gray-500); cursor: pointer; transition: var(--transition); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--gray-100); color: var(--dark); }
        .modal-body { padding: 24px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row.full-width { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--gray-700); display: flex; align-items: center; gap: 6px; }
        .form-group label i { color: var(--primary); width: 16px; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px 14px; border: 2px solid var(--gray-300); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; transition: var(--transition); background: var(--white); width: 100%; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .upload-section { margin: 20px 0; padding: 16px; background: var(--gray-100); border-radius: var(--radius-sm); border: 2px dashed var(--gray-300); transition: var(--transition); }
        .upload-section.dragover { border-color: var(--primary); background: rgba(102,126,234,0.05); }
        .upload-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .upload-header h3 { font-size: 15px; font-weight: 600; color: var(--dark); display: flex; align-items: center; gap: 8px; }
        .upload-header h3 i { color: var(--primary); }
        .upload-badge { font-size: 11px; padding: 4px 12px; border-radius: 50px; background: var(--primary); color: var(--white); font-weight: 600; }
        .upload-dropzone { padding: 30px 20px; text-align: center; cursor: pointer; border-radius: var(--radius-sm); transition: var(--transition); border: 2px dashed var(--gray-300); }
        .upload-dropzone:hover { border-color: var(--primary); background: rgba(102,126,234,0.05); }
        .upload-dropzone i { font-size: 36px; color: var(--primary); opacity: 0.6; }
        .upload-dropzone p { margin: 8px 0 4px; font-weight: 500; color: var(--gray-700); }
        .upload-dropzone span { font-size: 12px; color: var(--gray-500); }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px; }
        .preview-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--white); box-shadow: var(--shadow-sm); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .remove-file { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: var(--white); border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .preview-item .remove-file:hover { background: var(--danger); }
        .preview-item .file-index { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.6); color: var(--white); font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .upload-progress { margin-top: 10px; }
        .progress-bar { width: 100%; height: 6px; background: var(--gray-300); border-radius: 3px; overflow: hidden; }
        .progress-bar .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
        .progress-text { font-size: 12px; color: var(--gray-500); margin-top: 4px; text-align: center; }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--gray-300); }
        .btn-cancel { padding: 10px 24px; border: 2px solid var(--gray-300); border-radius: 50px; background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); color: var(--gray-700); }
        .btn-cancel:hover { background: var(--gray-100); }
        .btn-submit { padding: 10px 32px; border: none; border-radius: 50px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: var(--white); font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; width: 100%; }
        .toast { padding: 14px 20px; border-radius: var(--radius-sm); color: var(--white); font-weight: 500; font-size: 14px; box-shadow: var(--shadow-lg); animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; gap: 10px; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: var(--info); }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.hide { animation: slideOutRight 0.3s ease forwards; }
        @keyframes slideOutRight { to { opacity: 0; transform: translateX(40px); } }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: stretch; gap: 12px; }
            .logo-section { justify-content: center; }
            .header-actions { justify-content: center; }
            .btn-primary { padding: 10px 18px; font-size: 13px; }
            .cards-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .modal-content { width: 95%; max-height: 95vh; top: 50%; transform: translate(-50%, -50%); }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .filter-group input, .filter-group select { min-width: 120px; flex: 1 1 auto; }
            .card-slider { height: 200px; }
            .modal-header h2 { font-size: 17px; }
            .logo-text h1 { font-size: 18px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .filter-group { flex-direction: column; }
            .filter-group input, .filter-group select { width: 100%; }
            .card-meta { grid-template-columns: 1fr; }
        }

    <!-- HEADER -->
    <header class="header">

            SHEET_NAME: 'EDITOR_KOORDINATOR',

        // ============================================
        // FUNGSI TANGGAL WIB
        // ============================================
        function getTodayWIB() {
            const now = new Date();
            const wibOffset = 7 * 60;
            const localOffset = now.getTimezoneOffset();
            const wibTime = new Date(now.getTime() + (wibOffset + localOffset) * 60000);
            return wibTime;
        }

        function formatDateWIB(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        function formatDateDisplayWIB(dateStr) {
            if (!dateStr) return '-';
            if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
                const parts = dateStr.split('-');
                const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                return parseInt(parts[2]) + ' ' + bulan[parseInt(parts[1]) - 1] + ' ' + parts[0];
            }
            try {
                const date = new Date(dateStr);
                if (!isNaN(date.getTime())) {
                    const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                    return date.getDate() + ' ' + bulan[date.getMonth()] + ' ' + date.getFullYear();
                }
            } catch(e) {}
            return dateStr;
        }

        // ============================================

        // ============================================

        function showToast(message, type = 'info') {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
            container.appendChild(toast);
            setTimeout(function() {
                toast.classList.add('hide');
                setTimeout(function() { toast.remove(); }, 300);
            }, 4000);
        }

        // ============================================
        // LOAD KOORDINATORS
        // ============================================
        async function loadKoordinators() {
            try {
                const cached = localStorage.getItem('koordinators');
                const cacheTime = localStorage.getItem('koordinators_time');
                const now = Date.now();

                if (cached && cacheTime && (now - parseInt(cacheTime) < 3600000)) {
                    const parsed = JSON.parse(cached);
                    koordinatorNames = parsed;
                    populateKoordinatorSelect(parsed);
                    return;
                }

                const response = await fetch(CONFIG.API_URL + '?action=getKoordinators&spreadsheetId=' + CONFIG.SPREADSHEET_ID, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();
                
                if (result.success && result.data && result.data.length > 0) {
                    koordinatorNames = result.data;
                    localStorage.setItem('koordinators', JSON.stringify(result.data));
                    localStorage.setItem('koordinators_time', String(now));
                    populateKoordinatorSelect(result.data);
                } else {
                    const fallback = ['Budi Santoso', 'Siti Rahayu', 'Ahmad Fauzi', 'Dewi Lestari', 'Rudi Hartono'];
                    koordinatorNames = fallback;
                    populateKoordinatorSelect(fallback);
                }
            } catch (error) {
                console.error('Load Koordinator Error:', error);
                const fallback = ['Budi Santoso', 'Siti Rahayu', 'Ahmad Fauzi', 'Dewi Lestari', 'Rudi Hartono'];
                koordinatorNames = fallback;
                populateKoordinatorSelect(fallback);
            }
        }

        function populateKoordinatorSelect(data) {
            const select = $('namaKoordinator');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Pilih Koordinator</option>';
            data.forEach(function(name) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            if (currentValue && data.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        // ============================================
        // FUNGSI SET KOORDINATOR
        // ============================================
        function setKoordinatorValue(value) {
            const select = $('namaKoordinator');
            if (!value) {
                select.value = '';
                return;
            }
            
            const trimmed = value.trim();
            let found = false;
            for (let i = 0; i < select.options.length; i++) {
                const opt = select.options[i];
                if (opt.value && opt.value.trim().toLowerCase() === trimmed.toLowerCase()) {
                    select.value = opt.value;
                    found = true;
                    break;
                }
            }
            
            if (!found && trimmed) {
                const newOption = document.createElement('option');
                newOption.value = trimmed;
                newOption.textContent = trimmed;
                select.appendChild(newOption);
                select.value = trimmed;
                if (!koordinatorNames.includes(trimmed)) {
                    koordinatorNames.push(trimmed);
                }
            }
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function loadData() {
            loadingContainer.classList.add('active');
            cardsGrid.innerHTML = '';

            try {
                const response = await fetch(CONFIG.API_URL + '?action=getData&spreadsheetId=' + CONFIG.SPREADSHEET_ID + '&sheetName=' + CONFIG.SHEET_NAME, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                const result = await response.json();
                
                if (result.success) {
                    allData = result.data || [];
                    console.log('📊 Data dari spreadsheet:', allData);
                    renderCards(allData);
                    updateStats(allData);
                } else {
                    showToast('Gagal memuat data: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Load Data Error:', error);
                showToast('Gagal memuat data. Silakan refresh.', 'error');
            } finally {
                loadingContainer.classList.remove('active');
            }
        }

        // ============================================
        // RENDER CARDS
        // ============================================
        function renderCards(data) {
            if (!data || data.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Belum Ada Data</h3>
                        <p>Klik "Tambah Data" untuk memulai</p>
                    </div>
                `;
                return;
            }

            const searchTerm = searchInput.value.toLowerCase();
            const statusFilter = filterStatus.value;
            const dateFilter = filterTanggal.value;

            let filtered = data.filter(function(item) {
                const lokasi = (item['Lokasi/Rute Pembersihan'] || '').toLowerCase();
                const kelurahan = (item['Kelurahan'] || '').toLowerCase();
                const pj = (item['Penanggung Jawab'] || '').toLowerCase();
                const status = item['Status'] || '';
                const tanggal = item['Hari/Tanggal'] || item['tanggal'] || '';

                const matchSearch = lokasi.includes(searchTerm) ||
                    kelurahan.includes(searchTerm) ||
                    pj.includes(searchTerm);
                
                const matchStatus = statusFilter ? 
                    status.toLowerCase() === statusFilter.toLowerCase() : 
                    true;
                
                let matchDate = true;
                if (dateFilter && tanggal) {
                    if (tanggal.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        matchDate = tanggal === dateFilter;
                    } else {
                        try {
                            const d = new Date(tanggal);
                            if (!isNaN(d.getTime())) {
                                const year = d.getFullYear();
                                const month = String(d.getMonth() + 1).padStart(2, '0');
                                const day = String(d.getDate()).padStart(2, '0');
                                const formatted = year + '-' + month + '-' + day;
                                matchDate = formatted === dateFilter;
                            } else {
                                matchDate = false;
                            }
                        } catch(e) {
                            matchDate = false;
                        }
                    }
                }
                
                return matchSearch && matchStatus && matchDate;
            });

            filtered.sort(function(a, b) {
                const dateA = a['Hari/Tanggal'] || a['tanggal'] || '2000-01-01';
                const dateB = b['Hari/Tanggal'] || b['tanggal'] || '2000-01-01';
                return dateB.localeCompare(dateA);
            });

            if (filtered.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>Tidak Ada Data</h3>
                        <p>Coba ubah filter pencarian</p>
                    </div>
                `;
                return;
            }

            cardsGrid.innerHTML = filtered.map(function(item, index) {
                var fotoLinks = [];
                for (var i = 1; i <= 10; i++) {
                    var key = 'Link_Foto_' + i;
                    if (item[key]) fotoLinks.push(item[key]);
                }

                var slidesHtml = '';
                if (fotoLinks.length === 0) {
                    slidesHtml = `
                        <div class="slide">
                            <div class="no-image">
                                <i class="fas fa-image"></i>
                                <span>Tidak ada foto</span>
                            </div>
                        </div>
                    `;
                } else {
                    slidesHtml = fotoLinks.map(function(url) {
                        return `
                            <div class="slide">
                                <img src="${url}" alt="Foto" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-image\\'></i><span>Gagal load</span></div>'">
                            </div>
                        `;
                    }).join('');
                }

                var statusText = item['Status'] || 'Belum Selesai';
                var badgeClass = 'badge-belum';
                if (statusText === 'Sudah Bekerja') badgeClass = 'badge-sudah';
                else if (statusText === 'Hari Libur') badgeClass = 'badge-libur';

                var cardId = 'card-' + index + '-' + Date.now();
                var rowId = item._row || index;

                var lokasi = item['Lokasi/Rute Pembersihan'] || '-';
                var tanggal = item['Hari/Tanggal'] || item['tanggal'] || '';
                var jamMulai = formatTime(item['Jam Mulai'] || '');
                var jamSelesai = formatTime(item['Jam Selesai'] || '');
                var jumlahPersonil = item['Jumlah Personil'] || '0';
                var rt = item['RT'] || '-';
                var rw = item['RW'] || '-';
                var kelurahan = item['Kelurahan'] || '-';
                var penanggungJawab = item['Penanggung Jawab'] || '-';
                var namaKoordinator = item['Koordinator'] || '-';
                var keterangan = item['Keterangan'] || '';

                return `
                    <div class="card" data-id="${rowId}">
                        <div class="card-slider" id="${cardId}">
                            <div class="slides">${slidesHtml}</div>
                            ${fotoLinks.length > 1 ? `
                                <button class="slider-btn prev" onclick="slideCard('${cardId}', -1)">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <button class="slider-btn next" onclick="slideCard('${cardId}', 1)">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                                <div class="slider-dots">
                                    ${fotoLinks.map(function(_, i) {
                                        return `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide('${cardId}', ${i})"></div>`;
                                    }).join('')}
                                </div>
                            ` : ''}
                            <span class="card-badge ${badgeClass}">${statusText}</span>
                        </div>
                        <div class="card-body">
                            <div class="card-title">
                                <span class="location"><i class="fas fa-map-pin" style="color:var(--primary);margin-right:6px;"></i>${lokasi}</span>
                                <span class="date">${formatDateDisplayWIB(tanggal)}</span>
                            </div>
                            <div class="card-meta">
                                <div class="meta-item">
                                    <i class="fas fa-clock"></i>
                                    <span>${jamMulai} - ${jamSelesai}</span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-users"></i>
                                    <span>${jumlahPersonil} Personil</span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-home"></i>
                                    <span>RT ${rt} / RW ${rw}</span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-city"></i>
                                    <span>${kelurahan}</span>
                                </div>
                                <div class="meta-item" style="grid-column: 1 / -1;">
                                    <i class="fas fa-user-tie"></i>
                                    <span><span class="label">PJ:</span> ${penanggungJawab}</span>
                                </div>
                                ${keterangan ? `
                                    <div class="meta-item" style="grid-column: 1 / -1;">
                                        <i class="fas fa-info-circle"></i>
                                        <span>${keterangan}</span>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="card-footer">
                                <div class="coordinator">
                                    <i class="fas fa-user-cog"></i>
                                    ${namaKoordinator}
                                </div>
                                <div class="card-actions">
                                    <button class="btn-edit" onclick="editData('${rowId}')">

                                    <!-- Tombol hapus dinonaktifkan -->

                                        <i class="fas fa-trash"></i>
                                    </button> -->
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.card-slider').forEach(function(slider) {
                var id = slider.id;
                if (id) {
                    sliderStates[id] = 0;
                }

        // ============================================
        // FORMAT FUNCTIONS
        // ============================================
        function formatTime(timeStr) {
            if (!timeStr) return '-';
            if (timeStr.match(/^\d{1,2}:\d{2}$/)) {
                return timeStr;
            }
            try {
                var date = new Date(timeStr);
                if (!isNaN(date.getTime())) {
                    return date.getHours().toString().padStart(2, '0') + ':' + 
                           date.getMinutes().toString().padStart(2, '0');
                }
            } catch(e) {}
            return timeStr;
        }

        function formatRT_RW(value) {
            if (!value) return '';
            return String(value).padStart(3, '0');
        }

        function formatTimeForInput(timeStr) {
            if (!timeStr) return '';
            if (timeStr.match(/^\d{1,2}:\d{2}$/)) {
                return timeStr.length === 4 ? '0' + timeStr : timeStr;
            }
            try {
                var date = new Date(timeStr);
                if (!isNaN(date.getTime())) {
                    return date.getHours().toString().padStart(2, '0') + ':' + 
                           date.getMinutes().toString().padStart(2, '0');
                }
            } catch(e) {}
            return '';
        }

        function generateKinerja(jamMulai, jamSelesai) {
            if (!jamMulai || !jamSelesai) return 'Belum dikerjakan';
            try {
                var start = parseTime(jamMulai);
                var end = parseTime(jamSelesai);
                if (start === null || end === null) return 'Belum dikerjakan';
                var duration = end - start;
                if (duration >= 540) return 'Sudah dikerjakan sepanjang 200m';
                if (duration > 0) return 'Sedang dikerjakan';
                return 'Belum dikerjakan';
            } catch(e) {
                return 'Belum dikerjakan';
            }
        }

        function parseTime(timeStr) {
            if (!timeStr) return null;
            var parts = timeStr.toString().split(':');
            if (parts.length === 2) {
                return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }
            try {
                var date = new Date(timeStr);
                if (!isNaN(date.getTime())) {
                    return date.getHours() * 60 + date.getMinutes();
                }
            } catch(e) {}
            return null;
        }

        function generateStatus(jumlahPersonil, kinerja) {
            if (parseInt(jumlahPersonil) === 0) return 'Hari Libur';
            if (kinerja && kinerja.includes('Sudah')) return 'Sudah Bekerja';
            return 'Belum Selesai';
        }

        // ============================================
        // SLIDER FUNCTIONS
        // ============================================
        function slideCard(cardId, direction) {
            var slider = document.getElementById(cardId);
            if (!slider) return;
            var slides = slider.querySelector('.slides');
            if (!slides) return;
            var totalSlides = slides.querySelectorAll('.slide').length;
            if (totalSlides <= 1) return;
            
            var current = sliderStates[cardId] || 0;
            current = Math.max(0, Math.min(totalSlides - 1, current + direction));
            sliderStates[cardId] = current;
            slides.style.transform = 'translateX(-' + (current * 100) + '%)';
            
            var dots = slider.querySelectorAll('.dot');
            dots.forEach(function(dot, i) {
                dot.classList.toggle('active', i === current);
            });
        }

        function goToSlide(cardId, index) {
            var slider = document.getElementById(cardId);
            if (!slider) return;
            var slides = slider.querySelector('.slides');
            if (!slides) return;
            var totalSlides = slides.querySelectorAll('.slide').length;
            if (index >= totalSlides) return;
            
            sliderStates[cardId] = index;
            slides.style.transform = 'translateX(-' + (index * 100) + '%)';
            
            var dots = slider.querySelectorAll('.dot');
            dots.forEach(function(dot, i) {
                dot.classList.toggle('active', i === index);
            });
        }

        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats(data) {
            var total = data.length;
            var selesai = data.filter(function(d) { return d['Status'] === 'Sudah Bekerja'; }).length;
            var belum = data.filter(function(d) { return d['Status'] === 'Belum Selesai'; }).length;
            
            const todayWIB = getTodayWIB();
            const todayStr = formatDateWIB(todayWIB);
            
            var hariIni = data.filter(function(d) { 
                var tanggal = d['Hari/Tanggal'] || d['tanggal'] || '';
                if (tanggal) {
                    if (tanggal.match(/^\d{4}-\d{2}-\d{2}$/)) {
                        return tanggal === todayStr;
                    } else {
                        try {
                            var d = new Date(tanggal);
                            if (!isNaN(d.getTime())) {
                                var year = d.getFullYear();
                                var month = String(d.getMonth() + 1).padStart(2, '0');
                                var day = String(d.getDate()).padStart(2, '0');
                                return (year + '-' + month + '-' + day) === todayStr;
                            }
                        } catch(e) {}
                    }
                }
                return false;
            }).length;
            
            totalData.textContent = total;
            totalSelesai.textContent = selesai;
            totalBelum.textContent = belum;
            totalHariIni.textContent = hariIni;
        }

        // ============================================
        // UPLOAD HANDLING - FIXED
        // ============================================
        function setupUpload() {
            dropzone.addEventListener('click', function(e) {
                e.preventDefault();
                fileInput.click();
            });

            uploadSection.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });

            uploadSection.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
            });

            uploadSection.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                var files = Array.from(e.dataTransfer.files);
                if (files.length > 0) handleFiles(files);
            });

            fileInput.addEventListener('change', function(e) {
                var files = Array.from(e.target.files);
                if (files.length > 0) handleFiles(files);
                e.target.value = '';
            });
        }

        function handleFiles(files) {
            var maxPhotos = CONFIG.MAX_PHOTOS;
            var maxSize = CONFIG.MAX_FILE_SIZE;

            var validFiles = files.filter(function(file) {
                if (!file.type.startsWith('image/')) {
                    showToast('File ' + file.name + ' bukan gambar', 'error');
                    return false;
                }
                if (file.size > maxSize) {
                    showToast('File ' + file.name + ' melebihi 10MB', 'error');
                    return false;
                }
                return true;
            });

            var currentCount = uploadedFiles.length + existingUrls.length;
            var available = maxPhotos - currentCount;

            if (validFiles.length === 0) {
                showToast('Tidak ada file yang valid', 'warning');
                return;
            }

            if (validFiles.length > available) {
                showToast('Maksimal ' + maxPhotos + ' foto. Sisa ' + available + ' slot', 'warning');
                uploadedFiles.push.apply(uploadedFiles, validFiles.slice(0, available));
            } else {
                uploadedFiles.push.apply(uploadedFiles, validFiles);
            }

            renderPreview();
            updateFotoCount();
            showToast(validFiles.length + ' foto ditambahkan', 'success');
        }

        function renderPreview() {
            var items = [];

            existingUrls.forEach(function(url) {
                items.push({ type: 'url', url: url });
            });

            uploadedFiles.forEach(function(file) {
                var url = URL.createObjectURL(file);
                items.push({ type: 'file', url: url, file: file });
            });

            if (items.length === 0) {
                previewGrid.innerHTML = '';
                return;
            }

            previewGrid.innerHTML = items.map(function(item, idx) {
                return `
                    <div class="preview-item">
                        <img src="${item.url}" alt="Preview ${idx + 1}">
                        <span class="file-index">#${idx + 1}</span>
                        <button class="remove-file" onclick="removeFile(${idx})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function removeFile(index) {
            if (index < existingUrls.length) {
                existingUrls.splice(index, 1);
            } else {
                var fileIndex = index - existingUrls.length;
                uploadedFiles.splice(fileIndex, 1);
            }
            renderPreview();
            updateFotoCount();
        }

        function updateFotoCount() {
            var total = existingUrls.length + uploadedFiles.length;
            fotoCount.textContent = total + ' / ' + CONFIG.MAX_PHOTOS;
        }

        function resetUploads() {
            uploadedFiles = [];
            existingUrls = [];
            previewGrid.innerHTML = '';
            updateFotoCount();
            fileInput.value = '';
            uploadProgress.style.display = 'none';
            progressFill.style.width = '0%';
            progressText.textContent = 'Mengupload 0%';
        }

        function setExistingPhotos(urls) {
            existingUrls = urls || [];
            renderPreview();
            updateFotoCount();
        }

        function showProgress(percent, message) {
            uploadProgress.style.display = 'block';
            progressFill.style.width = percent + '%';
            progressText.textContent = message;
        }

        function hideProgress() {
            setTimeout(function() {
                uploadProgress.style.display = 'none';
                progressFill.style.width = '0%';
                progressText.textContent = 'Mengupload 0%';
            }, 1000);
        }

        // ============================================
        // FUNGSI KONVERSI FILE KE BASE64
        // ============================================
        function fileToBase64(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var base64 = e.target.result;
                    resolve(base64);
                };
                reader.onerror = function(error) {
                    reject(error);
                };
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        // MODAL HANDLING
        // ============================================
        function openModal(data) {
            isEditing = !!data;
            
            if (isEditing) {
                modalTitle.innerHTML = '<i class="fas fa-edit"></i> Edit Data';
                btnSubmit.innerHTML = '<i class="fas fa-save"></i> Update Data';
                editRowIdInput.value = data._row || '';
                
                var tanggal = data['Hari/Tanggal'] || data['tanggal'] || '';
                var dateInput = document.getElementById('tanggal');
                
                if (tanggal && tanggal.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    dateInput.value = tanggal;
                } else {
                    try {
                        var d = new Date(tanggal);
                        if (!isNaN(d.getTime())) {
                            var year = d.getFullYear();
                            var month = String(d.getMonth() + 1).padStart(2, '0');
                            var day = String(d.getDate()).padStart(2, '0');
                            dateInput.value = year + '-' + month + '-' + day;
                        } else {
                            dateInput.value = '';
                        }
                    } catch(e) {
                        dateInput.value = '';
                    }
                }
                
                document.getElementById('jamMulai').value = formatTimeForInput(data['Jam Mulai'] || '');
                document.getElementById('jamSelesai').value = formatTimeForInput(data['Jam Selesai'] || '');
                document.getElementById('lokasi').value = data['Lokasi/Rute Pembersihan'] || '';
                document.getElementById('rt').value = formatRT_RW(data['RT']);
                document.getElementById('rw').value = formatRT_RW(data['RW']);
                document.getElementById('kelurahan').value = data['Kelurahan'] || '';
                document.getElementById('jumlahPersonil').value = data['Jumlah Personil'] || '';
                document.getElementById('penanggungJawab').value = data['Penanggung Jawab'] || '';
                
                const koordinatorValue = data['Koordinator'] || '';
                setKoordinatorValue(koordinatorValue);
                
                const keteranganValue = data['Keterangan'] || '';
                document.getElementById('keterangan').value = keteranganValue;

                var urls = [];
                for (var i = 1; i <= 10; i++) {
                    var key = 'Link_Foto_' + i;
                    if (data[key]) urls.push(data[key]);
                }
                setExistingPhotos(urls);
            } else {
                modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> Tambah Data Baru';
                btnSubmit.innerHTML = '<i class="fas fa-save"></i> Simpan Data';
                dataForm.reset();
                editRowIdInput.value = '';
                resetUploads();
                
                const todayWIB = getTodayWIB();
                document.getElementById('tanggal').value = formatDateWIB(todayWIB);
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            resetUploads();
        }

        // ============================================
        // VALIDATE FORM
        // ============================================
        function validateForm() {
            const errors = [];
            
            if (!document.getElementById('tanggal').value) {
                errors.push('Tanggal harus diisi');
            }
            
            const jamMulai = document.getElementById('jamMulai').value;
            const jamSelesai = document.getElementById('jamSelesai').value;
            
            if (!jamMulai) errors.push('Jam Mulai harus diisi');
            if (!jamSelesai) errors.push('Jam Selesai harus diisi');
            if (jamMulai && jamSelesai && jamMulai >= jamSelesai) {
                errors.push('Jam selesai harus lebih besar dari jam mulai');
            }
            
            if (!document.getElementById('lokasi').value) errors.push('Lokasi/Rute Pembersihan harus diisi');
            if (!document.getElementById('rt').value) errors.push('RT harus diisi');
            if (!document.getElementById('rw').value) errors.push('RW harus diisi');
            if (!document.getElementById('kelurahan').value) errors.push('Kelurahan harus diisi');
            if (!document.getElementById('jumlahPersonil').value) errors.push('Jumlah Personil harus dipilih');
            if (!document.getElementById('penanggungJawab').value) errors.push('Penanggung Jawab harus diisi');
            if (!document.getElementById('namaKoordinator').value) errors.push('Nama Koordinator harus dipilih');
            
            if (errors.length > 0) {
                showToast(errors.join(' • '), 'error');
                return false;
            }
            return true;
        }

        // ============================================
        // SUBMIT FORM - DENGAN BASE64
        // ============================================
        dataForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!validateForm()) return;

            var formData = {
                'Hari/Tanggal': document.getElementById('tanggal').value,
                'Jam Mulai': document.getElementById('jamMulai').value,
                'Jam Selesai': document.getElementById('jamSelesai').value,
                'Lokasi/Rute Pembersihan': document.getElementById('lokasi').value,
                'RT': formatRT_RW(document.getElementById('rt').value),
                'RW': formatRT_RW(document.getElementById('rw').value),
                'Kelurahan': document.getElementById('kelurahan').value,
                'Jumlah Personil': document.getElementById('jumlahPersonil').value,
                'Penanggung Jawab': document.getElementById('penanggungJawab').value,
                'Koordinator': document.getElementById('namaKoordinator').value,
                'Keterangan': document.getElementById('keterangan').value,
            };

            var jamMulai = formData['Jam Mulai'];
            var jamSelesai = formData['Jam Selesai'];
            var kinerja = generateKinerja(jamMulai, jamSelesai);
            var status = generateStatus(formData['Jumlah Personil'], kinerja);
            
            formData['Kinerja'] = kinerja;
            formData['Status'] = status;

            console.log('📝 Data yang akan disimpan:', formData);
            console.log('📸 Jumlah file yang diupload:', uploadedFiles.length);
            console.log('📸 Existing URLs:', existingUrls);

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

            // TAMPILKAN PROGRESS BAR
            uploadProgress.style.display = 'block';
            showProgress(5, 'Mempersiapkan data...');

            // BUAT FORM DATA UNTUK DIKIRIM
            var formDataToSend = new FormData();
            formDataToSend.append('action', isEditing ? 'updateData' : 'addData');
            formDataToSend.append('rowId', editRowIdInput.value);
            formDataToSend.append('spreadsheetId', CONFIG.SPREADSHEET_ID);
            formDataToSend.append('sheetName', CONFIG.SHEET_NAME);
            formDataToSend.append('driveFolderId', CONFIG.DRIVE_FOLDER_ID);
            formDataToSend.append('data', JSON.stringify(formData));
            formDataToSend.append('existingUrls', JSON.stringify(existingUrls));

            // Jika ada file, konversi ke base64 dan tambahkan ke FormData
            if (uploadedFiles.length > 0) {
                showProgress(10, 'Membaca ' + uploadedFiles.length + ' file...');
                
                var filePromises = uploadedFiles.map(function(file, index) {
                    return fileToBase64(file).then(function(base64) {
                        formDataToSend.append('photo_' + index, base64);
                        var progress = 10 + ((index + 1) / uploadedFiles.length) * 30;
                        showProgress(Math.round(progress), 'Memproses file ' + (index + 1) + '/' + uploadedFiles.length + ': ' + file.name);
                        console.log('✅ File ' + (index + 1) + ' siap: ' + file.name);
                        return true;
                    });
                });

                Promise.all(filePromises)
                    .then(function() {
                        showProgress(45, 'Mengirim ' + uploadedFiles.length + ' file ke server...');
                        return fetch(CONFIG.API_URL, {
                            method: 'POST',
                            body: formDataToSend
                        });
                    })
                    .then(function(response) {
                        showProgress(70, 'Menunggu response dari server...');
                        if (!response.ok) {
                            throw new Error('HTTP error! status: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function(result) {
                        showProgress(90, 'Menyimpan ke spreadsheet...');
                        if (result.success) {
                            showProgress(100, '✅ Selesai!');
                            showToast(isEditing ? 'Data berhasil diupdate!' : 'Data berhasil disimpan!', 'success');
                            setTimeout(function() {
                                closeModal();
                                loadData();
                                hideProgress();
                            }, 1000);
                        } else {
                            showToast('Gagal menyimpan data: ' + (result.error || 'Unknown error'), 'error');
                            console.error('Error response:', result);
                            hideProgress();
                        }
                    })
                    .catch(function(error) {
                        console.error('Submit Error:', error);
                        showToast('Gagal menyimpan data: ' + error.message, 'error');
                        hideProgress();
                    })
                    .finally(function() {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = isEditing 
                            ? '<i class="fas fa-save"></i> Update Data' 
                            : '<i class="fas fa-save"></i> Simpan Data';
                    });
            } else {
                // Tidak ada file, langsung kirim
                showProgress(30, 'Mengirim data ke server...');
                
                fetch(CONFIG.API_URL, {
                    method: 'POST',
                    body: formDataToSend
                })
                .then(function(response) { 
                    showProgress(60, 'Memproses response...');
                    return response.json(); 
                })
                .then(function(result) {
                    showProgress(90, 'Menyimpan ke spreadsheet...');
                    if (result.success) {
                        showProgress(100, '✅ Selesai!');
                        showToast(isEditing ? 'Data berhasil diupdate!' : 'Data berhasil disimpan!', 'success');
                        setTimeout(function() {
                            closeModal();
                            loadData();
                            hideProgress();
                        }, 1000);
                    } else {
                        showToast('Gagal menyimpan data: ' + (result.error || 'Unknown error'), 'error');
                        console.error('Error response:', result);
                        hideProgress();
                    }
                })
                .catch(function(error) {
                    console.error('Submit Error:', error);
                    showToast('Gagal menyimpan data. Silakan coba lagi.', 'error');
                    hideProgress();
                })
                .finally(function() {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = isEditing 
                        ? '<i class="fas fa-save"></i> Update Data' 
                        : '<i class="fas fa-save"></i> Simpan Data';
                });
            }
        });

        // ============================================
        // FUNGSI UPDATE PROGRESS
        // ============================================
        function showProgress(percent, message) {
            var fill = document.getElementById('progressFill');
            var text = document.getElementById('progressText');
            var container = document.getElementById('uploadProgress');
            
            container.style.display = 'block';
            
            var currentPercent = parseInt(fill.style.width) || 0;
            var targetPercent = Math.min(100, Math.max(0, percent));
            
            if (targetPercent > currentPercent) {
                var step = 1;
                var interval = setInterval(function() {
                    currentPercent += step;
                    if (currentPercent >= targetPercent) {
                        currentPercent = targetPercent;
                        clearInterval(interval);
                    }
                    fill.style.width = currentPercent + '%';
                    text.textContent = message + ' (' + currentPercent + '%)';
                }, 50);
            } else {
                fill.style.width = targetPercent + '%';
                text.textContent = message + ' (' + targetPercent + '%)';
            }
        }

        // ============================================
        // FUNGSI HIDE PROGRESS
        // ============================================
        function hideProgress() {
            setTimeout(function() {
                var container = document.getElementById('uploadProgress');
                var fill = document.getElementById('progressFill');
                var text = document.getElementById('progressText');
                container.style.display = 'none';
                fill.style.width = '0%';
                text.textContent = 'Mengupload 0%';
            }, 1500);
        }

        // ============================================
        // EDIT DATA
        // ============================================
        function editData(rowId) {
            var data = allData.find(function(d) { return d._row == rowId; });
            if (data) {
                console.log('📝 Edit data:', data);
                openModal(data);
            } else {
                showToast('Data tidak ditemukan', 'error');
            }
        }

        // ============================================
        // DELETE DATA
        // ============================================
        function deleteData(rowId) {
            if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;

            fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'deleteData',
                    rowId: rowId,
                    spreadsheetId: CONFIG.SPREADSHEET_ID,
                    sheetName: CONFIG.SHEET_NAME,
                })
            })
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) {
                    showToast('Data berhasil dihapus!', 'success');
                    loadData();
                } else {
                    showToast('Gagal menghapus data', 'error');
                }
            })
            .catch(function(error) {
                console.error('Delete Error:', error);
                showToast('Gagal menghapus data', 'error');
            });
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        btnTambahData.addEventListener('click', function() { openModal(null); });
        btnRefresh.addEventListener('click', loadData);
        btnCancel.addEventListener('click', closeModal);
        modalClose.addEventListener('click', closeModal);
        modal.querySelector('.modal-overlay').addEventListener('click', closeModal);

        let searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                renderCards(allData);
            }, 300);
        });
        
        filterStatus.addEventListener('change', function() { renderCards(allData); });
        filterTanggal.addEventListener('input', function() { renderCards(allData); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================
        // INIT UPLOAD
        // ============================================
        setupUpload();

        // ============================================
        // INIT
        // ============================================
        async function init() {
            console.log('🚀 Inisialisasi aplikasi...');
            await loadKoordinators();
            await loadData();
            console.log('✅ Aplikasi siap digunakan!');
            console.log('📍 Timezone:', Intl.DateTimeFormat().resolvedOptions().timeZone);
            console.log('📅 Hari ini (WIB):', formatDateWIB(getTodayWIB()));
        }

        init();

        // ============================================
        // EXPOSE GLOBAL FUNCTIONS
        // ============================================
        window.slideCard = slideCard;
        window.goToSlide = goToSlide;
        window.editData = editData;
        window.deleteData = deleteData;
        window.removeFile = removeFile;
    </script>
</body>
