<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portal Bank Sampah | Kecamatan Senapelan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Full Width */
        .header {
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6e 100%);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area i {
            font-size: 1.8rem;
            color: #4caf50;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .logo-area h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .logo-area p {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
        }

        /* Tab Navigation - Tanpa border/kotak berlebih */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .tab-btn i {
            font-size: 0.9rem;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .tab-btn.active {
            background: white;
            color: #1a4a6e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .tab-btn.active i {
            color: #1a4a6e;
        }

        /* Right Side Header */
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-badge {
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: white;
            backdrop-filter: blur(5px);
        }

        /* Konten Full - Tanpa grid/kotak */
        .content {
            flex: 1;
            position: relative;
            background: #f5f7fb;
            overflow: hidden;
        }

        .tab-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .tab-pane.active {
            opacity: 1;
            visibility: visible;
        }

        /* Iframe Full */
        .full-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: block;
        }

        /* Loading Overlay */
        .iframe-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f7fb, #e8edf2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .iframe-loading i {
            font-size: 2.5rem;
            color: #1a4a6e;
            animation: spin 1s linear infinite;
        }

        .iframe-loading span {
            font-size: 0.85rem;
            color: #5b6e8c;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 800px) {
            .header { padding: 12px 16px; }
            .logo-area h1 { font-size: 1rem; }
            .logo-area i { font-size: 1.4rem; }
            .tab-btn { padding: 6px 12px; font-size: 0.7rem; }
            .tab-btn i { font-size: 0.75rem; }
            .date-badge { display: none; }
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .tab-nav { justify-content: center; border-radius: 30px; }
        }
    </style>
</head>
<body>

<!-- Header Full Width - Tanpa Grid -->
<div class="header">
    <div class="logo-area">
        <i class="fas fa-leaf"></i>
        <div>
            <h1>Bank Sampah Senapelan</h1>
            <p>Kecamatan Senapelan · Kota Pekanbaru</p>
        </div>
    </div>
    
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="kelurahan1">
            <i class="fas fa-home"></i> Kampung Baru
        </button>
        <button class="tab-btn" data-tab="kelurahan2">
            <i class="fas fa-building"></i> Kampung Bandar
        </button>
        <button class="tab-btn" data-tab="kelurahan3">
            <i class="fas fa-tree"></i> Kampung Dalam
        </button>
        <button class="tab-btn" data-tab="kelurahan4">
            <i class="fas fa-sun"></i> Padang Bulan
        </button>
        <button class="tab-btn" data-tab="kelurahan5">
            <i class="fas fa-water"></i> Padang Terubuk
        </button>
        <button class="tab-btn" data-tab="kelurahan6">
            <i class="fas fa-landmark"></i> Sago
        </button>
    </div>
    
    <div class="header-right">
        <div class="date-badge" id="dateBadge"></div>
    </div>
</div>

<!-- Content Full Page - Tanpa Grid/Kotak -->
<div class="content">
    <!-- Tab 1: Kampung Baru -->
    <div id="kelurahan1" class="tab-pane active">
        <div class="iframe-loading" id="loading1">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Kampung Baru...</span>
        </div>
        <iframe id="iframe1" class="full-iframe" data-src="https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html" style="display:none;"></iframe>
    </div>

    <!-- Tab 2: Kampung Bandar -->
    <div id="kelurahan2" class="tab-pane">
        <div class="iframe-loading" id="loading2">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Kampung Bandar...</span>
        </div>
        <iframe id="iframe2" class="full-iframe" data-src="https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html" style="display:none;"></iframe>
    </div>

    <!-- Tab 3: Kampung Dalam -->
    <div id="kelurahan3" class="tab-pane">
        <div class="iframe-loading" id="loading3">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Kampung Dalam...</span>
        </div>
        <iframe id="iframe3" class="full-iframe" data-src="https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html" style="display:none;"></iframe>
    </div>

    <!-- Tab 4: Padang Bulan -->
    <div id="kelurahan4" class="tab-pane">
        <div class="iframe-loading" id="loading4">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Padang Bulan...</span>
        </div>
        <iframe id="iframe4" class="full-iframe" data-src="https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html" style="display:none;"></iframe>
    </div>

    <!-- Tab 5: Padang Terubuk -->
    <div id="kelurahan5" class="tab-pane">
        <div class="iframe-loading" id="loading5">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Padang Terubuk...</span>
        </div>
        <iframe id="iframe5" class="full-iframe" data-src="https://lpspadangterubukasri.github.io/Home/potensi/datapesertalps.html" style="display:none;"></iframe>
    </div>

    <!-- Tab 6: Sago -->
    <div id="kelurahan6" class="tab-pane">
        <div class="iframe-loading" id="loading6">
            <i class="fas fa-spinner fa-pulse"></i>
            <span>Memuat dashboard Sago...</span>
        </div>
        <iframe id="iframe6" class="full-iframe" data-src="https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html" style="display:none;"></iframe>
    </div>
</div>

<script>
    // Konfigurasi URL
    const config = {
        kelurahan1: { name: 'Kampung Baru', url: 'https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html' },
        kelurahan2: { name: 'Kampung Bandar', url: 'https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html' },
        kelurahan3: { name: 'Kampung Dalam', url: 'https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html' },
        kelurahan4: { name: 'Padang Bulan', url: 'https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html' },
        kelurahan5: { name: 'Padang Terubuk', url: 'https://lpspadangterubukasri.github.io/Home/potensi/datapesertalps.html' },
        kelurahan6: { name: 'Sago', url: 'https://senapelan.github.io/Home/publik/senapelankencana/maintenance-kencana.html' }
    };

    // State untuk tracking iframe yang sudah dimuat
    const loaded = {
        kelurahan1: false, kelurahan2: false, kelurahan3: false,
        kelurahan4: false, kelurahan5: false, kelurahan6: false
    };

    // Fungsi load iframe
    function loadIframe(tabId, iframeId, loadingId, url) {
        if (loaded[tabId]) return;
        
        const iframe = document.getElementById(iframeId);
        const loading = document.getElementById(loadingId);
        
        if (iframe && url) {
            iframe.src = url;
            iframe.style.display = 'block';
            
            iframe.onload = function() {
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 300);
                loaded[tabId] = true;
            };
            
            // Timeout fallback
            setTimeout(() => {
                if (!loaded[tabId]) {
                    loading.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Memuat ulang...</span>';
                    iframe.src = iframe.src;
                }
            }, 8000);
        }
    }

    // Fungsi ganti tab
    function switchTab(tabId) {
        // Sembunyikan semua tab pane
        document.querySelectorAll('.tab-pane').forEach(pane => {
            pane.classList.remove('active');
        });
        
        // Tampilkan tab yang dipilih
        const activePane = document.getElementById(tabId);
        if (activePane) {
            activePane.classList.add('active');
        }
        
        // Load iframe untuk tab yang aktif
        const num = tabId.slice(-1);
        const iframeId = `iframe${num}`;
        const loadingId = `loading${num}`;
        const url = config[tabId]?.url;
        
        if (url) {
            loadIframe(tabId, iframeId, loadingId, url);
        }
    }

    // Event listener untuk tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            // Update active class pada button
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Ganti tab
            const tabId = btn.getAttribute('data-tab');
            if (tabId) {
                switchTab(tabId);
            }
        });
    });

    // Tampilkan tanggal hari ini
    function updateDate() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const dateString = now.toLocaleDateString('id-ID', options);
        document.getElementById('dateBadge').innerHTML = `<i class="far fa-calendar-alt"></i> ${dateString}`;
    }
    updateDate();

    // Load iframe pertama saat halaman dimuat
    document.addEventListener('DOMContentLoaded', () => {
        const activeTab = document.querySelector('.tab-btn.active');
        if (activeTab) {
            const tabId = activeTab.getAttribute('data-tab');
            if (tabId) {
                const num = tabId.slice(-1);
                const iframeId = `iframe${num}`;
                const loadingId = `loading${num}`;
                const url = config[tabId]?.url;
                if (url) {
                    loadIframe(tabId, iframeId, loadingId, url);
                }
            }
        }
    });
</script>
</body>
</html>
