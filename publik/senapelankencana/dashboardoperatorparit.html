<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OP Drainase | Dashboard Pemeliharaan Saluran Air</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f0f2f5 0%, #e6eef5 100%);

        .container { max-width: 1600px; margin: 0 auto; }
        
        .dashboard-header {

            padding: 1.8rem 2rem;

        }

        .badge-update {

        .toolbar {
            display: flex;

        .search-box {

        .date-filter {
            display: flex;

            padding: 5px 20px;

        }

        }
        .date-filter input {

        .btn-clear-date {

            background: #1e5f6e;

        .cards-grid {

        .card.card-selesai {

            background: #c62828;

        .card.card-menunggu {

        }
        
        .card {
            border-radius: 32px;

        .card:hover { transform: translateY(-6px); box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.2); }
        
        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;

        .date-badge {

        }
        .lokasi-box {
            background: rgba(255,255,255,0.5);

        }
        .lokasi-title {
            font-weight: 700;
            color: #0f2b3d;
            display: flex;
            gap: 8px;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .rt-rw {
            font-size: 0.7rem;

            border-radius: 20px;

        }
        .kelurahan { font-size: 0.8rem; color: #2c5a74; margin-top: 6px; }
        .detail-item {
            padding: 0.7rem 1.5rem;
            display: flex;
            align-items: center;

            border-bottom: 1px solid rgba(0,0,0,0.05);

        .detail-icon { width: 32px; color: #5b8cae; font-size: 1.1rem; }
        .detail-content { flex: 1; font-weight: 500; }
        .label-small {
            font-size: 0.65rem;
            color: #6c86a3;
            text-transform: uppercase;

        }
        .countdown-timer {
            font-family: monospace;
            font-weight: 800;
            font-size: 0.85rem;
            background: #1e293b;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 32px;
            color: #facc15;
            margin-top: 6px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .foto-icon {
            cursor: pointer;
            background: rgba(255,255,255,0.7);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .foto-icon:hover { background: rgba(255,255,255,0.9); transform: scale(1.05); }
        
        .modal-img {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal-img img { max-width: 85%; max-height: 85%; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .close-modal {
            position: absolute;
            top: 24px;

            cursor: pointer;

        .loader-container { text-align: center; padding: 4rem; }
        .loader-container i { font-size: 2rem; margin-bottom: 1rem; display: block; }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1f6e8c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .success-notice {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #065f46;
            transition: opacity 0.5s;
        }
        
        .filter-stats {
            font-size: 0.75rem;
            color: #64748b;
            margin-left: 8px;
        }
        
        @media (max-width: 700px) {
            .cards-grid { grid-template-columns: 1fr; }
            body { padding: 1rem; }
            .date-filter { width: 100%; justify-content: center; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="dashboard-header">
        <div class="title-section">
            <h1><i class="fas fa-droplet"></i> OP Drainase Kecamatan Senapelan</h1>
            <p><i class="fas fa-map-marked-alt"></i> Jadwal Operasi & Pemeliharaan Saluran Air / Drainase</p>
        </div>
        <div class="badge-update">
            <i class="fas fa-sync-alt"></i> Database Senapelan Satu Pintu
        </div>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari kelurahan, lokasi, penanggung jawab..." autocomplete="off">
        </div>
        
        <div class="date-filter">
            <label><i class="fas fa-calendar-alt"></i> Filter Tanggal:</label>
            <input type="date" id="dateFilterInput" placeholder="Pilih tanggal">
            <button class="btn-clear-date" id="clearDateBtn"><i class="fas fa-times"></i> Hapus</button>
        </div>
        
        <button class="btn-refresh" id="refreshBtn"><i class="fas fa-cloud-download-alt"></i> Refresh Data</button>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="loader-container">
            <div class="spinner"></div>
            <p>Menghubungkan ke Google Sheets...</p>
        </div>
    </div>
</div>

<div id="imageModal" class="modal-img">
    <span class="close-modal">&times;</span>
    <img id="modalImg" src="" alt="Foto Kegiatan Drainase">
</div>

<script>
    // =============== KONFIGURASI ===============
    // PERBAIKAN: URL yang benar untuk Web App yang sudah dipublish
    // Ganti URL ini dengan URL Web App Anda yang sudah dipublish
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlvHa_wVGTVX61DLl8k4KzaSVPspuZ2ESh-mRe4qUavV-lMl70Xvb7o19ZAqILxtsL/exec';
    
    // Cache data di localStorage (30 menit)
    const CACHE_KEY = 'op_drainase_data_v2';
    const CACHE_DURATION = 30 * 60 * 1000;
    
    let globalData = [];
    let currentSearchTerm = '';
    let currentDateFilter = '';
    let isLoading = false;
    let countdownInterval = null;

    function saveToCache(data) {
        try {
            const cacheData = {
                timestamp: Date.now(),
                data: data
            };
            localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
        } catch(e) {
            console.warn('Cache gagal:', e);
        }
    }
    
    function loadFromCache() {
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (!cached) return null;
            
            const cacheData = JSON.parse(cached);
            const isExpired = (Date.now() - cacheData.timestamp) > CACHE_DURATION;
            
            if (!isExpired && cacheData.data && cacheData.data.length > 0) {
                console.log('✅ Memuat dari cache, usia:', Math.round((Date.now() - cacheData.timestamp)/1000), 'detik');
                return cacheData.data;
            }
        } catch(e) {
            console.warn('Gagal baca cache:', e);
        }
        return null;
    }

    // PERBAIKAN: Fungsi fetch dengan error handling yang lebih baik
    async function fetchDataFromAppsScript(forceRefresh = false) {
        if (!forceRefresh) {
            const cachedData = loadFromCache();
            if (cachedData) {
                return cachedData;
            }
        }
        
        if (isLoading) return null;
        isLoading = true;
        
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            
            const response = await fetch(APPS_SCRIPT_URL, { 
                method: 'GET',
                mode: 'cors',
                cache: 'no-store',
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const result = await response.json();
            let dataArray = null;
            
            // PERBAIKAN: Penanganan format response yang lebih fleksibel
            if (result && result.success === true && Array.isArray(result.data)) {
                dataArray = result.data;
            } 
            else if (Array.isArray(result)) {
                dataArray = result;
            }
            else if (result && result.data && Array.isArray(result.data)) {
                dataArray = result.data;
            }
            else if (result && typeof result === 'object') {
                // Coba cari array di dalam object
                for (let key in result) {
                    if (Array.isArray(result[key]) && result[key].length > 0) {
                        dataArray = result[key];
                        break;
                    }
                }
            }
            
            if (dataArray && dataArray.length > 0) {
                const filteredData = dataArray.filter(item => item && item["Hari/Tanggal"] && item["Hari/Tanggal"] !== '');
                if (filteredData.length > 0) {
                    saveToCache(filteredData);
                    isLoading = false;
                    return filteredData;
                } else if (dataArray.length > 0) {
                    // Data ada tapi tidak memenuhi filter
                    saveToCache(dataArray);
                    isLoading = false;
                    return dataArray;
                }
            }
            
            // Jika response tidak valid, lempar error
            throw new Error('Format data tidak dikenali');
            
        } catch (error) {
            console.error('Fetch error:', error);
            isLoading = false;
            return null;
        }
    }

    function parseDateFromString(dateString) {
        if (!dateString || dateString === '-') return null;
        
        const parts = dateString.split(',');
        if (parts.length < 2) return null;
        
        const datePart = parts[1].trim();
        const dateParts = datePart.split(' ');
        
        if (dateParts.length < 3) return null;
        
        const day = parseInt(dateParts[0], 10);
        const monthName = dateParts[1];
        const year = parseInt(dateParts[2], 10);
        
        const months = {
            'Januari': 0, 'Jan': 0, 'January': 0,
            'Februari': 1, 'Feb': 1, 'February': 1,
            'Maret': 2, 'Mar': 2, 'March': 2,
            'April': 3, 'Apr': 3,
            'Mei': 4, 'May': 4,
            'Juni': 5, 'Jun': 5, 'June': 5,
            'Juli': 6, 'Jul': 6, 'July': 6,
            'Agustus': 7, 'Agu': 7, 'Aug': 7, 'August': 7,
            'September': 8, 'Sep': 8,
            'Oktober': 9, 'Okt': 9, 'Oct': 9, 'October': 9,
            'November': 10, 'Nov': 10,
            'Desember': 11, 'Des': 11, 'Dec': 11, 'December': 11
        };
        
        const month = months[monthName];
        if (month === undefined) return null;
        
        return new Date(year, month, day);
    }

    function filterByDate(item, filterDate) {
        if (!filterDate) return true;
        
        const itemDate = parseDateFromString(item["Hari/Tanggal"]);
        if (!itemDate) return false;
        
        return itemDate.getFullYear() === filterDate.getFullYear() &&
               itemDate.getMonth() === filterDate.getMonth() &&
               itemDate.getDate() === filterDate.getDate();
    }

    function getCardColorClass(item) {
        const status = item["Status"] || '';
        const ketLibur = item["Ket libur"] || '';
        
        if (status === 'Hari Libur' || ketLibur.toLowerCase().includes('libur')) {
            return 'card-libur';
        }
        
        if (status === 'Sudah Bekerja' || status === 'Selesai') {
            return 'card-selesai';
        }
        
        return 'card-menunggu';
    }

    function parseTimeToMinutes(timeStr) {
        if (!timeStr || timeStr === '' || timeStr === '-') return null;
        if (typeof timeStr === 'number') return timeStr * 60;
        
        let strTime = String(timeStr);
        let cleaned = strTime.replace(/\./g, ':');
        let parts = cleaned.split(':');
        if(parts.length < 2) return null;
        let hours = parseInt(parts[0], 10);
        let minutes = parseInt(parts[1], 10);
        if(isNaN(hours) || isNaN(minutes)) return null;
        return hours * 60 + minutes;
    }

    function updateCountdowns() {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        
        document.querySelectorAll('.countdown-timer').forEach(el => {
            const startStr = el.getAttribute('data-start');
            const endStr = el.getAttribute('data-end');
            const statusRaw = el.getAttribute('data-status');
            const isLibur = el.getAttribute('data-libur') === 'libur';
            
            if(isLibur || statusRaw === 'Hari Libur') {
                el.innerHTML = '<i class="fas fa-calendar-times"></i> Libur';
                return;
            }
            if(statusRaw === 'Selesai' || statusRaw === 'Sudah Bekerja') {
                el.innerHTML = '<i class="fas fa-check-circle"></i> Selesai';
                return;
            }
            
            const startMin = parseTimeToMinutes(startStr);
            const endMin = parseTimeToMinutes(endStr);
            if(startMin === null || endMin === null) {
                el.innerHTML = '⏱️ Jadwal belum tersedia';
                return;
            }
            
            if(currentMinutes < startMin) {
                let diff = startMin - currentMinutes;
                let hours = Math.floor(diff / 60);
                let mins = diff % 60;
                el.innerHTML = `⏳ Mulai: ${hours}j ${mins}m`;
            } 
            else if(currentMinutes >= startMin && currentMinutes <= endMin) {
                let diffEnd = endMin - currentMinutes;
                let hours = Math.floor(diffEnd / 60);
                let mins = diffEnd % 60;
                el.innerHTML = `🔄 Berlangsung · sisa ${hours}j ${mins}m`;
            } 
            else {
                el.innerHTML = '✅ Selesai';
            }
        });
    }

    function renderCards(data, searchTerm = '', filterDate = null) {
        const container = document.getElementById('cardsContainer');
        if(!data || data.length === 0) {
            container.innerHTML = `<div class="loader-container"><i class="fas fa-database"></i><p>📭 Tidak ada data jadwal</p><button class="btn-refresh" id="retryBtnEmpty" style="margin-top:1rem;">Muat Ulang</button></div>`;
            document.getElementById('retryBtnEmpty')?.addEventListener('click', () => loadDataAndRender(true));
            return;
        }
        
        let filtered = data.filter(item => {
            let matchText = true;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                matchText = (item["Lokasi/Rute Pembersihan"]?.toLowerCase().includes(term) ||
                           item["Kelurahan"]?.toLowerCase().includes(term) ||
                           item["Penanggung Jawab"]?.toLowerCase().includes(term));
            }
            
            let matchDate = true;
            if (filterDate) {
                matchDate = filterByDate(item, filterDate);
            }
            
            return matchText && matchDate;
        });
        
        if(filtered.length === 0) {
            let message = 'Tidak ada jadwal sesuai pencarian';
            if (filterDate) message = `Tidak ada jadwal untuk tanggal ${filterDate.toLocaleDateString('id-ID')}`;
            container.innerHTML = `<div class="loader-container"><i class="fas fa-search"></i><p>${message}</p></div>`;
            return;
        }
        
        const fragment = document.createDocumentFragment();
        const tempDiv = document.createElement('div');
        
        tempDiv.innerHTML = filtered.map(item => {
            const cardColorClass = getCardColorClass(item);
            const isLibur = (item["Ket libur"] && String(item["Ket libur"]).toLowerCase().includes('libur')) ? true : false;
            const isHariLibur = (item["Status"] === 'Hari Libur');
            const finalLibur = isLibur || isHariLibur;
            let statusText = item["Status"] || 'Menunggu';
            const lokasi = item["Lokasi/Rute Pembersihan"] || '-';
            const rt = item["RT"] || '';
            const rw = item["RW"] || '';
            const rtRwText = (rt || rw) ? `RT ${rt} / RW ${rw}` : '';
            const fotoUrl = item["Link_Foto"] || item["Link Foto"] || '';
            
            return `
                <div class="card ${cardColorClass}">
                    <div class="card-header">
                        <span class="date-badge"><i class="far fa-calendar-alt"></i> ${escapeHtml(item["Hari/Tanggal"] || '-')}</span>
                        <span class="status-badge">${finalLibur ? 'Libur' : statusText}</span>
                    </div>
                    <div class="lokasi-box">
                        <div class="lokasi-title">
                            <i class="fas fa-map-pin"></i> ${escapeHtml(lokasi)}
                            ${rtRwText ? `<span class="rt-rw">${escapeHtml(rtRwText)}</span>` : ''}
                        </div>
                        <div class="kelurahan"><i class="fas fa-building"></i> Kelurahan ${escapeHtml(item["Kelurahan"] || '-')}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon"><i class="far fa-clock"></i></div>
                        <div class="detail-content">
                            <div class="label-small">Jam Operasional</div>
                            <strong>${escapeHtml(item["Jam Mulai"] || '--')} - ${escapeHtml(item["Jam Selesai"] || '--')}</strong>
                            <div class="countdown-timer" data-start="${escapeHtml(item["Jam Mulai"] || '')}" data-end="${escapeHtml(item["Jam Selesai"] || '')}" data-status="${statusText}" data-libur="${finalLibur ? 'libur' : ''}">⏳ menghitung...</div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon"><i class="fas fa-user-hard-hat"></i></div>
                        <div class="detail-content">
                            <div class="label-small">Penanggung Jawab</div>
                            ${escapeHtml(item["Penanggung Jawab"] || '-')} ${item["Jumlah Personil"] ? `(👥 ${item["Jumlah Personil"]} personil)` : ''}
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon"><i class="fas fa-info-circle"></i></div>
                        <div class="detail-content">
                            <div class="label-small">Keterangan</div>
                            ${escapeHtml(item["Keterangan"] || '-')}
                        </div>
                    </div>
                    <div class="detail-item" style="justify-content: space-between;">
                        <div><i class="fas fa-camera"></i> Dokumentasi Foto</div>
                        <div class="foto-icon" data-foto="${escapeHtml(fotoUrl)}">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                    ${item["Ket libur"] ? `<div class="detail-item" style="background:rgba(0,0,0,0.03);"><i class="fas fa-ban"></i> ${escapeHtml(item["Ket libur"])}</div>` : ''}
                </div>
            `;
        }).join('');
        
        while(tempDiv.firstChild) {
            fragment.appendChild(tempDiv.firstChild);
        }
        
        container.innerHTML = '';
        container.appendChild(fragment);
        
        container.querySelectorAll('.foto-icon').forEach(icon => {
            icon.removeEventListener('click', fotoClickHandler);
            icon.addEventListener('click', fotoClickHandler);
        });
        
        updateCountdowns();
        
        if(countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateCountdowns, 60000);
    }
    
    function fotoClickHandler(e) {
        e.stopPropagation();
        const fotoUrl = this.getAttribute('data-foto');
        if(fotoUrl && fotoUrl !== '' && (fotoUrl.startsWith('http') || fotoUrl.startsWith('https'))) {
            document.getElementById('modalImg').src = fotoUrl;
            document.getElementById('imageModal').style.display = 'flex';
        } else {
            alert('📷 Belum ada foto dokumentasi untuk kegiatan ini');
        }
    }

    function escapeHtml(str) {
        if(!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function applyFilters() {
        if (!globalData || globalData.length === 0) return;
        
        const searchTerm = document.getElementById('searchInput')?.value || '';
        const dateValue = document.getElementById('dateFilterInput')?.value || '';
        
        let filterDate = null;
        if (dateValue) {
            filterDate = new Date(dateValue);
        }
        
        requestAnimationFrame(() => {
            renderCards(globalData, searchTerm, filterDate);
        });
    }

    async function loadDataAndRender(forceRefresh = false) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = `<div class="loader-container"><div class="spinner"></div><p>Mengambil data dari Server...</p></div>`;
        
        const oldNotice = document.getElementById('api-notice');
        if(oldNotice) oldNotice.remove();
        
        const data = await fetchDataFromAppsScript(forceRefresh);
        
        if (data && data.length > 0) {
            const notice = document.createElement('div');
            notice.id = 'api-notice';
            notice.className = 'success-notice';
            notice.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Data berhasil dimuat! Menampilkan ' + data.length + ' jadwal operasional drainase.';
            const toolbar = document.querySelector('.toolbar');
            toolbar.parentNode.insertBefore(notice, toolbar.nextSibling);
            setTimeout(() => { 
                if(notice) {
                    notice.style.opacity = '0'; 
                    setTimeout(() => notice.remove(), 500);
                }
            }, 5000);
            
            globalData = data;
            applyFilters();
        } else {
            const lastCache = loadFromCache();
            if (lastCache && lastCache.length > 0) {
                globalData = lastCache;
                applyFilters();
                const warning = document.createElement('div');
                warning.className = 'success-notice';
                warning.style.background = '#fed7aa';
                warning.style.borderLeftColor = '#f59e0b';
                warning.style.color = '#92400e';
                warning.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ⚠️ Menggunakan data cache (koneksi bermasalah)';
                document.querySelector('.toolbar').parentNode.insertBefore(warning, document.querySelector('.toolbar').nextSibling);
                setTimeout(() => warning.remove(), 4000);
            } else {
                container.innerHTML = `
                    <div class="loader-container">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#f59e0b;"></i>
                        <p>Gagal memuat data dari Google Sheets</p>
                        <p style="font-size:0.8rem;margin-top:0.5rem;">Pastikan Web App sudah dipublish dan URL sudah benar</p>
                        <button class="btn-refresh" id="retryBtn" style="margin-top:1rem;">Coba Lagi</button>
                    </div>`;
                document.getElementById('retryBtn')?.addEventListener('click', () => loadDataAndRender(true));
            }
        }
    }
    
    let searchTimeout;
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 300);
        });
    }
    
    document.getElementById('refreshBtn')?.addEventListener('click', () => loadDataAndRender(true));
    document.getElementById('dateFilterInput')?.addEventListener('change', applyFilters);
    document.getElementById('clearDateBtn')?.addEventListener('click', () => {
        const dateInput = document.getElementById('dateFilterInput');
        if (dateInput) dateInput.value = '';
        applyFilters();
    });
    
    const modal = document.getElementById('imageModal');
    const closeModal = document.querySelector('.close-modal');
    if (closeModal) {
        closeModal.addEventListener('click', () => modal.style.display = 'none');
    }
    if (modal) {
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
    }
    
    loadDataAndRender();
</script>
</body>
</html>
