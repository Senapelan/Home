    <style>
        :root { --default-image: 'https://senapelan.github.io/Home/assets/metatag/operatorparit/defaultop800x800.png'; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; padding: 16px; min-height: 100vh; }
        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0a2f44, #1a5d6e);
            border-radius: 20px;
            padding: 1.2rem 1.8rem;
            margin-bottom: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #60b0d4; }
        .header p { opacity: 0.8; font-size: 0.75rem; margin-top: 2px; }
        .header .badge { background: rgba(255,255,255,0.12); padding: 6px 16px; border-radius: 50px; font-size: 0.7rem; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: white;
            padding: 10px 16px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 40px;
            flex: 1;
            max-width: 280px;
            min-width: 160px;
        }
        .search-box input { border: none; outline: none; background: transparent; font-size: 0.8rem; width: 100%; font-family: 'Inter', sans-serif; }
        .search-box i { color: #94a3b8; font-size: 0.8rem; }
        .date-filter {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px 10px 4px 14px;
            border-radius: 40px;
        }
        .date-filter label { font-size: 0.7rem; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .date-filter input { border: none; outline: none; background: transparent; font-size: 0.75rem; font-family: 'Inter', sans-serif; padding: 4px 0; color: #1e293b; min-width: 120px; }
        .date-filter input::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
        .btn-clear {
            background: #e2e8f0;
            border: none;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn-clear:hover { background: #cbd5e1; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; }
        .btn-refresh {
            background: #1a5d6e;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-refresh:hover { background: #0e4a58; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,93,110,0.3); }
        .stats { font-size: 0.7rem; color: #94a3b8; padding: 2px 10px; background: #f1f5f9; border-radius: 20px; white-space: nowrap; }

        .upcoming-section { margin-bottom: 28px; position: relative; }
        .upcoming-section .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            position: relative;
        }
        .upcoming-section .section-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, #1a5d6e, #60b0d4);
            border-radius: 2px;
        }
        .upcoming-section .section-title h2 { font-size: 1.1rem; font-weight: 700; color: #0a2f44; display: flex; align-items: center; gap: 10px; }
        .upcoming-section .section-title h2 i { color: #1a5d6e; font-size: 1.2rem; }
        .upcoming-section .section-title .count-badge { background: #1a5d6e; color: white; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .upcoming-section .section-title .subtitle { font-size: 0.75rem; color: #94a3b8; margin-left: auto; }
        .upcoming-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

        /* ============================================================ */
        /* UPDATED: CARD PIN DENGAN WARNA + ICON PIN */
        /* ============================================================ */
        .upcoming-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #1a5d6e;
            position: relative;
        }
        .upcoming-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.10); }

        /* PIN ICON - Sudut Kiri Atas */
        .pin-icon {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(26, 93, 110, 0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 50%;
            font-size: 0.7rem;
            z-index: 3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Warna card pin berdasarkan status */
        .upcoming-card.card-pin-libur {
            background: #fef2f2;
            border-left-color: #dc2626;
        }
        .upcoming-card.card-pin-selesai {
            background: #f0fdf4;
            border-left-color: #16a34a;
        }
        .upcoming-card.card-pin-menunggu {
            background: #f8fafc;
            border-left-color: #94a3b8;
        }
        .upcoming-card.card-pin-libur .upcoming-badge {
            background: rgba(220, 38, 38, 0.9);
        }
        .upcoming-card.card-pin-selesai .upcoming-badge {
            background: rgba(22, 163, 74, 0.9);
        }
        .upcoming-card.card-pin-menunggu .upcoming-badge {
            background: rgba(148, 163, 184, 0.9);
        }

        .upcoming-card .upcoming-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            backdrop-filter: blur(4px);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.55rem;
            font-weight: 600;
            z-index: 2;
        }
        .upcoming-card .upcoming-badge i { margin-right: 4px; }
        .upcoming-card .upcoming-img {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #0f172a;
            flex-shrink: 0;
        }
        .upcoming-card .upcoming-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .upcoming-card:hover .upcoming-img img { transform: scale(1.03); }
        .upcoming-card .upcoming-body { padding: 12px 14px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .upcoming-card .upcoming-body .u-title { font-weight: 600; font-size: 0.8rem; color: #1e293b; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .upcoming-card .upcoming-body .u-location { font-size: 0.65rem; color: #64748b; display: flex; align-items: center; gap: 4px; }
        .upcoming-card .upcoming-body .u-location i { font-size: 0.5rem; color: #94a3b8; }
        .upcoming-card .upcoming-body .u-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.55rem; color: #94a3b8; margin-top: 2px; padding-top: 6px; border-top: 1px solid #f1f5f9; }
        .upcoming-card .upcoming-body .u-meta span { display: flex; align-items: center; gap: 3px; }
        .upcoming-card .upcoming-body .u-meta i { font-size: 0.5rem; }
        .upcoming-empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; background: white; border-radius: 14px; color: #94a3b8; }
        .upcoming-empty i { font-size: 2rem; display: block; margin-bottom: 8px; color: #cbd5e1; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: stretch; }

        /* ===== WARNA CARD BERDASARKAN STATUS ===== */
        .card-status-libur {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
        }
        .card-status-selesai {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
        }
        .card-status-menunggu {
            background: #f8fafc;
            border-left: 4px solid #94a3b8;
        }
        .card-status-libur .card-header {
            border-bottom-color: #fecaca;
        }
        .card-status-selesai .card-header {
            border-bottom-color: #bbf7d0;
        }
        .card-status-menunggu .card-header {
            border-bottom-color: #e2e8f0;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }

        .card-header {
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            border-bottom: 1px solid #f1f5f9;
            flex-shrink: 0;
            min-height: 52px;
        }
        .card-header .info { flex: 1; min-width: 0; }
        .card-header .info .name { font-weight: 600; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .card-header .info .name i { color: #1a5d6e; font-size: 0.7rem; }
        .card-header .info .name .role { font-weight: 400; font-size: 0.55rem; color: #94a3b8; }
        .card-header .info .loc { font-size: 0.6rem; color: #64748b; margin-top: 1px; display: flex; align-items: center; gap: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-header .info .loc i { font-size: 0.5rem; flex-shrink: 0; }
        .card-header .meta { text-align: right; flex-shrink: 0; }
        .card-header .meta .time { font-size: 0.55rem; color: #94a3b8; display: block; white-space: nowrap; }
        .card-header .meta .status { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.5rem; font-weight: 600; margin-top: 2px; white-space: nowrap; }
        .status-selesai { background: #dcfce7; color: #166534; }
        .status-menunggu { background: #fef3c7; color: #92400e; }
        .status-libur { background: #fee2e2; color: #991b1b; }

        .media-wrap {
            position: relative;
            background: #0f172a;
            overflow: hidden;
            aspect-ratio: 1/1;
            cursor: pointer;
            flex-shrink: 0;
            width: 100%;
        }
        .media-slider {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease;
        }
        .media-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            position: relative;
        }
        .media-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* TIDAK ADA LABEL DI CARD */

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(4px);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 5;
            opacity: 0;
        }
        .media-wrap:hover .nav-btn { opacity: 1; }
        .nav-btn:hover { background: rgba(0,0,0,0.5); }
        .nav-btn.prev { left: 4px; }
        .nav-btn.next { right: 4px; }

        .dots {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            z-index: 5;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 20px;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .dot.active { background: white; width: 14px; border-radius: 3px; }

        .counter {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.5rem;
            font-weight: 600;
            z-index: 5;
        }

        .card-footer {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            min-height: 65px;
        }
        .card-footer .desc { font-size: 0.7rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer .desc i { color: #94a3b8; margin-right: 3px; font-size: 0.6rem; }
        .card-footer .desc .empty-desc { color: #cbd5e1; font-style: italic; }
        .card-footer .tags { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.55rem; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 6px; flex-shrink: 0; min-height: 22px; }
        .card-footer .tags span { display: flex; align-items: center; gap: 3px; }
        .card-footer .tags i { font-size: 0.5rem; }

        .viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 20px;
        }
        .viewer.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .viewer-close {
            position: fixed;
            top: 16px; right: 16px;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .viewer-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }
        .viewer-content {
            max-width: 800px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .viewer-media {
            position: relative;
            flex: 1;
            min-height: 300px;
            background: #000;
            aspect-ratio: 1/1;
            overflow: hidden;
        }
        .viewer-slider {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease;
        }
        .viewer-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }
        .viewer-slide img { width: 100%; height: 100%; object-fit: contain; }

        /* LABEL DI FULLSCREEN - HANYA BEFORE & AFTER */
        .viewer-slide .viewer-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 3;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .viewer-slide .viewer-label.before {
            background: rgba(234, 88, 12, 0.9);
            color: white;
        }
        .viewer-slide .viewer-label.after {
            background: rgba(22, 163, 74, 0.9);
            color: white;
        }

        .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            z-index: 10;
        }
        .viewer-nav:hover { background: rgba(255,255,255,0.2); }
        .viewer-nav.prev { left: 12px; }
        .viewer-nav.next { right: 12px; }
        .viewer-counter {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 10;
        }
        .viewer-info {
            padding: 16px 20px;
            background: white;
            color: #262626;
        }
        .viewer-info .v-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .viewer-info .v-name i { color: #1a5d6e; }
        .viewer-info .v-loc { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
        .viewer-info .v-details { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.75rem; color: #64748b; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .viewer-info .v-details span { display: flex; align-items: center; gap: 4px; }
        .viewer-info .v-desc { margin-top: 8px; font-size: 0.85rem; line-height: 1.5; padding-top: 8px; border-top: 1px solid #f1f5f9; }

        .loader { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
        .loader .spinner { border: 3px solid #e2e8f0; border-top: 3px solid #1a5d6e; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader i { font-size: 2rem; color: #94a3b8; }
        .loader p { color: #64748b; font-size: 0.9rem; }

        .notice { padding: 10px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .notice-success { background: #dcfce7; border-left: 4px solid #22c55e; color: #166534; }
        .notice-error { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; }

        @media (max-width: 1200px) {
            .grid { gap: 12px; }
            .upcoming-grid { gap: 12px; }
            .header h1 { font-size: 1.2rem; }
            .header p { font-size: 0.7rem; }
            .header .badge { font-size: 0.65rem; padding: 5px 14px; }
        }
        @media (max-width: 992px) {
            body { padding: 12px; }
            .grid { gap: 10px; }
            .upcoming-grid { gap: 10px; }
            .header { padding: 1rem 1.4rem; }
            .header h1 { font-size: 1.1rem; }

<body>

<div class="container">
    <div class="header">

            <h1><i class="fas fa-droplet"></i> OP Drainase Senapelan</h1>

                <input type="text" id="searchInput" placeholder="Cari kelurahan, lokasi..." autocomplete="off">
            </div>

                <label><i class="fas fa-calendar-alt"></i> Tanggal:</label>

<!-- FULLSCREEN VIEWER -->
<div id="viewer" class="viewer" onclick="closeViewer(event)">
    <div class="viewer-close" onclick="closeViewer()">✕</div>
    <div class="viewer-content" onclick="event.stopPropagation()">

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const DEFAULT_IMAGE = 'https://senapelan.github.io/Home/assets/metatag/operatorparit/defaultop800x800.png';
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxN44fWWd0Og1Hi9868cgvHY7Pz96ScKV-0CM5XBSkeUBOfYqoeLhG6sV3pRE9ybUOQ/exec';

    let allData = [];
    let viewerData = { slides: [], current: 0, info: null };

    // ============================================================
    // FETCH DATA
    // ============================================================
    async function fetchData() {
        try {
            const res = await fetch(APP_URL, { cache: 'no-store' });
            const json = await res.json();
            console.log('📦 Data:', json);
            if (json.success && json.data) {
                return json.data;
            }
            return null;
        } catch (e) {
            console.error('❌ Error:', e);
            return null;
        }
    }

    // ============================================================
    // NOTIFIKASI
    // ============================================================
    function showNotice(msg, type = 'success') {
        const c = document.getElementById('noticeContainer');
        const el = document.createElement('div');
        el.className = 'notice notice-' + type;
        el.innerHTML = (type === 'success' ? '✅' : '⚠️') + ' ' + msg;
        c.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }, 4000);
    }

    // ============================================================
    // PARSE TANGGAL
    // ============================================================
    function parseDate(str) {
        if (!str) return null;
        const parts = str.split(',');
        if (parts.length < 2) return null;
        const d = parts[1].trim().split(' ');
        if (d.length < 3) return null;
        const months = { 'Januari':0,'Jan':0,'January':0,'Februari':1,'Feb':1,'February':1,'Maret':2,'Mar':2,'March':2,'April':3,'Apr':3,'Mei':4,'May':4,'Juni':5,'Jun':5,'June':5,'Juli':6,'Jul':6,'July':6,'Agustus':7,'Agu':7,'Aug':7,'August':7,'September':8,'Sep':8,'Oktober':9,'Okt':9,'Oct':9,'October':9,'November':10,'Nov':10,'Desember':11,'Des':11,'Dec':11,'December':11 };
        const m = months[d[1]];
        if (m === undefined) return null;
        return new Date(parseInt(d[2]), m, parseInt(d[0]));
    }

    function formatDate(d) {
        const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function getToday() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    // ============================================================
    // GET MEDIA LINKS - DENGAN LABEL (BEFORE, AFTER)
    // ============================================================
    function getMediaWithLabels(item) {
        var links = [];
        for (var i = 1; i <= 10; i++) {
            var key = 'Link_Foto_' + i;
            var value = item[key];
            if (value && value.toString().trim() !== '') {
                var label = '';
                if (i >= 1 && i <= 5) {
                    label = 'BEFORE';
                } else if (i >= 6 && i <= 10) {
                    label = 'AFTER';
                }
                links.push({
                    src: value.toString().trim(),
                    isVideo: false,
                    label: label,
                    index: i
                });
            }
        }
        if (links.length === 0) {
            links.push({
                src: DEFAULT_IMAGE,
                isVideo: false,
                label: 'BEFORE',
                index: 1
            });
        }
        return links;
    }

    // ============================================================
    // GET COVER MEDIA (untuk upcoming card)
    // ============================================================
    function getCoverMedia(item) {
        var media = getMediaWithLabels(item);
        // Cari label 'BEFORE' atau ambil pertama
        var cover = media.find(m => m.label === 'BEFORE');
        return cover || media[0] || { src: DEFAULT_IMAGE, isVideo: false, label: 'BEFORE' };
    }

    // ============================================================
    // RENDER UPCOMING CARDS - DENGAN WARNA + PIN
    // ============================================================
    function renderUpcoming(data) {
        const container = document.getElementById('upcomingGrid');
        const countBadge = document.getElementById('upcomingCount');
        const todayDate = document.getElementById('todayDate');

        const today = new Date();
        todayDate.textContent = formatDate(today);

        if (!data || data.length === 0) {
            container.innerHTML = `<div class="upcoming-empty"><i class="fas fa-calendar-plus"></i> Tidak ada kegiatan akan datang</div>`;
            countBadge.textContent = '0';
            return;
        }

        const todayObj = getToday();
        const upcoming = data.filter(item => {
            const d = parseDate(item['Hari/Tanggal']);
            if (!d) return false;
            return d >= todayObj;
        });

        upcoming.sort((a, b) => {
            const da = parseDate(a['Hari/Tanggal']);
            const db = parseDate(b['Hari/Tanggal']);
            return da - db;
        });

        const top4 = upcoming.slice(0, 4);
        countBadge.textContent = top4.length;

        if (top4.length === 0) {
            container.innerHTML = `<div class="upcoming-empty"><i class="fas fa-calendar-check"></i> Tidak ada kegiatan akan datang</div>`;
            return;
        }

        container.innerHTML = top4.map(item => {
            const cover = getCoverMedia(item);
            const status = item['Status'] || 'Menunggu';
            const isLibur = item['Ket libur'] && String(item['Ket libur']).toLowerCase().includes('libur');
            const finalStatus = isLibur ? 'Hari Libur' : status;
            
            // Tentukan class warna untuk pin card
            let pinColorClass = 'card-pin-menunggu';
            if (finalStatus === 'Selesai' || finalStatus === 'Sudah Bekerja') {
                pinColorClass = 'card-pin-selesai';
            } else if (finalStatus === 'Hari Libur') {
                pinColorClass = 'card-pin-libur';
            }

            return `
                <div class="upcoming-card ${pinColorClass}">
                    <div class="pin-icon"><i class="fas fa-thumbtack"></i></div>
                    <div class="upcoming-badge"><i class="fas fa-clock"></i> ${finalStatus}</div>
                    <div class="upcoming-img">
                        <img src="${cover.src}" alt="${item['Lokasi/Rute Pembersihan'] || 'Kegiatan'}" 
                             onerror="this.src='${DEFAULT_IMAGE}'">
                    </div>
                    <div class="upcoming-body">
                        <div class="u-title">${item['Lokasi/Rute Pembersihan'] || 'Kegiatan'}</div>
                        <div class="u-location">
                            <i class="fas fa-map-pin"></i> ${item['Kelurahan'] || '-'} 
                            ${item['RT'] ? 'RT '+item['RT'] : ''} ${item['RW'] ? '/ RW '+item['RW'] : ''}
                        </div>
                        <div class="u-meta">
                            <span><i class="fas fa-calendar-alt"></i> ${item['Hari/Tanggal'] || '-'}</span>
                            <span><i class="fas fa-clock"></i> ${item['Jam Mulai'] || '-'} - ${item['Jam Selesai'] || '-'}</span>
                            ${item['Jumlah Personil'] > 0 ? `<span><i class="fas fa-users"></i> ${item['Jumlah Personil']}</span>` : ''}
                            <span><i class="fas fa-user"></i> ${item['Penanggung Jawab'] || '-'}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // RENDER CARDS - TIDAK ADA LABEL SAMA SEKALI + WARNA
    // ============================================================
    function renderCards(data, search = '', dateFilter = null) {
        const container = document.getElementById('gridContainer');

        if (!data || data.length === 0) {
            container.innerHTML = `<div class="loader"><i class="fas fa-database"></i><p>Tidak ada data</p></div>`;
            document.getElementById('statsText').textContent = '0 kegiatan';
            return;
        }

        let filtered = data.filter(item => {
            let matchText = true;
            if (search) {
                const s = search.toLowerCase();
                matchText = (item['Lokasi/Rute Pembersihan'] || '').toLowerCase().includes(s) ||
                            (item['Kelurahan'] || '').toLowerCase().includes(s) ||
                            (item['Penanggung Jawab'] || '').toLowerCase().includes(s);
            }
            let matchDate = true;
            if (dateFilter) {
                const d = parseDate(item['Hari/Tanggal']);
                matchDate = d && d.getFullYear() === dateFilter.getFullYear() &&
                            d.getMonth() === dateFilter.getMonth() &&
                            d.getDate() === dateFilter.getDate();
            }
            return matchText && matchDate;
        });

        document.getElementById('statsText').textContent = filtered.length + ' kegiatan';
        document.getElementById('statusText').textContent = data.length + ' jadwal';

        if (filtered.length === 0) {
            let msg = 'Tidak ada jadwal sesuai pencarian';
            if (dateFilter) msg = 'Tidak ada jadwal untuk tanggal ' + formatDate(dateFilter);
            container.innerHTML = `<div class="loader"><i class="fas fa-search"></i><p>${msg}</p></div>`;
            return;
        }

        container.innerHTML = filtered.map((item, idx) => {
            const status = item['Status'] || 'Menunggu';
            const isLibur = item['Ket libur'] && String(item['Ket libur']).toLowerCase().includes('libur');
            const finalStatus = isLibur ? 'Hari Libur' : status;
            let statusClass = 'status-menunggu';
            let cardColorClass = 'card-status-menunggu';
            if (finalStatus === 'Selesai' || finalStatus === 'Sudah Bekerja') {
                statusClass = 'status-selesai';
                cardColorClass = 'card-status-selesai';
            } else if (finalStatus === 'Hari Libur') {
                statusClass = 'status-libur';
                cardColorClass = 'card-status-libur';
            }

            const media = getMediaWithLabels(item);
            const total = media.length;
            const cardId = 'card-' + idx;

            // ==========================================================
            // TIDAK ADA LABEL DI CARD
            // ==========================================================
            const slides = media.map((m, i) => {
                return `
                    <div class="media-slide" data-index="${i}" data-label="${m.label || 'BEFORE'}">
                        <img src="${m.src}" alt="Foto ${i+1}" loading="lazy" onerror="this.src='${DEFAULT_IMAGE}'">
                    </div>
                `;
            }).join('');

            const dots = media.map((_, i) => `
                <span class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>
            `).join('');

            const rt = item['RT'] || '';
            const rw = item['RW'] || '';
            const rtRw = (rt || rw) ? `RT ${rt} / RW ${rw}` : '';

            const descText = item['Keterangan'] || '-';
            const descHtml = descText === '-' 
                ? `<span class="empty-desc">-</span>` 
                : descText;

            return `
                <div class="card ${cardColorClass}" data-id="${cardId}">
                    <div class="card-header">
                        <div class="info">
                            <div class="name">
                                <i class="fas fa-user-circle"></i> ${item['Penanggung Jawab'] || '-'}
                                <span class="role">• Penanggung Jawab</span>
                            </div>
                            <div class="loc">
                                <i class="fas fa-map-pin"></i> ${item['Lokasi/Rute Pembersihan'] || '-'} ${rtRw ? '('+rtRw+')' : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <span class="time"><i class="far fa-clock"></i> ${item['Jam Mulai'] || '-'} - ${item['Jam Selesai'] || '-'}</span>
                            <span class="status ${statusClass}">${finalStatus}</span>
                        </div>
                    </div>

                    <div class="media-wrap" data-total="${total}">
                        <div class="media-slider" style="transform:translateX(0%);" data-current="0">
                            ${slides}
                        </div>
                        ${total > 1 ? `
                            <button class="nav-btn prev" onclick="slideCard(this, -1)">‹</button>
                            <button class="nav-btn next" onclick="slideCard(this, 1)">›</button>
                            <div class="counter">1/${total}</div>
                            <div class="dots">${dots}</div>
                        ` : ''}
                    </div>

                    <div class="card-footer">
                        <div class="desc"><i class="fas fa-info-circle"></i> ${descHtml}</div>
                        <div class="tags">
                            <span><i class="fas fa-calendar-alt"></i> ${item['Hari/Tanggal'] || '-'}</span>
                            ${item['Jumlah Personil'] > 0 ? `<span><i class="fas fa-users"></i> ${item['Jumlah Personil']} personil</span>` : ''}
                            <span><i class="fas fa-building"></i> ${item['Kelurahan'] || '-'}</span>
                            ${isLibur ? `<span><i class="fas fa-ban"></i> ${item['Ket libur']}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        setTimeout(() => {
            document.querySelectorAll('.media-slide').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const wrap = this.closest('.media-wrap');
                    const card = wrap.closest('.card');
                    const id = card.dataset.id;
                    const idx = parseInt(id.split('-')[1]);
                    const item = filtered[idx];
                    if (item) openViewer(item, wrap);
                });
            });
        }, 50);
    }

    // ============================================================
    // SLIDE CARD
    // ============================================================
    function slideCard(btn, dir) {
        const wrap = btn.closest('.media-wrap');
        const slider = wrap.querySelector('.media-slider');
        const total = wrap.querySelectorAll('.media-slide').length;
        const dots = wrap.querySelectorAll('.dot');
        const counter = wrap.querySelector('.counter');

        let cur = parseInt(slider.dataset.current || '0');
        let next = cur + dir;
        if (next < 0) next = 0;
        if (next >= total) next = total - 1;
        if (next === cur) return;

        slider.style.transform = 'translateX(-' + (next * 100) + '%)';
        slider.dataset.current = next;

        dots.forEach((d, i) => d.classList.toggle('active', i === next));
        if (counter) counter.textContent = (next + 1) + '/' + total;
    }

    // ============================================================
    // FULLSCREEN VIEWER - HANYA BEFORE & AFTER
    // ============================================================
    function openViewer(item, wrap) {
        const cur = parseInt(wrap.querySelector('.media-slider').dataset.current || '0');
        const media = getMediaWithLabels(item);

        viewerData.slides = media;
        viewerData.current = Math.min(cur, media.length - 1);
        viewerData.info = {
            name: item['Penanggung Jawab'] || '-',
            loc: item['Lokasi/Rute Pembersihan'] || '-',
            time: (item['Jam Mulai'] || '-') + ' - ' + (item['Jam Selesai'] || '-'),
            status: item['Status'] || 'Menunggu',
            desc: item['Keterangan'] || '-',
            date: item['Hari/Tanggal'] || '-',
            personil: item['Jumlah Personil'] || 0,
            kelurahan: item['Kelurahan'] || '-',
            rt: item['RT'] || '',
            rw: item['RW'] || '',
            ketLibur: item['Ket libur'] || ''
        };

        renderViewer();
        document.getElementById('viewer').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function renderViewer() {
        const slider = document.getElementById('viewerSlider');
        const info = document.getElementById('viewerInfo');

        slider.innerHTML = '';
        viewerData.slides.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'viewer-slide';
            
            // HANYA BEFORE & AFTER YANG TAMPIL
            var showLabel = m.label === 'BEFORE' || m.label === 'AFTER';
            var labelClass = '';
            if (m.label === 'BEFORE') labelClass = 'before';
            else if (m.label === 'AFTER') labelClass = 'after';
            
            const img = document.createElement('img');
            img.src = m.src;
            img.alt = 'Foto ' + (i+1);
            img.onerror = function() { this.src = DEFAULT_IMAGE; };
            div.appendChild(img);
            
            if (showLabel) {
                const label = document.createElement('div');
                label.className = 'viewer-label ' + labelClass;
                label.textContent = m.label;
                div.appendChild(label);
            }
            
            slider.appendChild(div);
        });

        updateViewer();

        const d = viewerData.info;
        const rtRw = (d.rt || d.rw) ? 'RT ' + d.rt + ' / RW ' + d.rw : '';
        info.innerHTML = `
            <div class="v-name"><i class="fas fa-user-circle"></i> ${d.name} <span style="font-weight:400;font-size:0.7rem;color:#94a3b8;">• Penanggung Jawab</span></div>
            <div class="v-loc"><i class="fas fa-map-pin"></i> ${d.loc} ${rtRw ? '('+rtRw+')' : ''}</div>
            <div class="v-details">
                <span><i class="far fa-clock"></i> ${d.time}</span>
                <span><i class="fas fa-tag"></i> ${d.status}</span>
                <span><i class="fas fa-calendar-alt"></i> ${d.date}</span>
                ${d.personil > 0 ? `<span><i class="fas fa-users"></i> ${d.personil} personil</span>` : ''}
                <span><i class="fas fa-building"></i> ${d.kelurahan}</span>
                ${d.ketLibur ? `<span><i class="fas fa-ban"></i> ${d.ketLibur}</span>` : ''}
            </div>
            <div class="v-desc"><i class="fas fa-info-circle"></i> ${d.desc}</div>
        `;
    }

    function updateViewer() {
        const slider = document.getElementById('viewerSlider');
        const cur = viewerData.current;
        slider.style.transform = 'translateX(-' + (cur * 100) + '%)';
        document.getElementById('viewerCounter').textContent = (cur + 1) + '/' + viewerData.slides.length;
    }

    function viewerSlide(dir) {
        const total = viewerData.slides.length;
        let next = viewerData.current + dir;
        if (next < 0) next = 0;
        if (next >= total) next = total - 1;
        if (next === viewerData.current) return;
        viewerData.current = next;
        updateViewer();
    }

    function closeViewer(e) {
        if (e && e.target !== e.currentTarget) return;
        document.getElementById('viewer').classList.remove('active');
        document.body.style.overflow = '';
    }

    // ============================================================
    // FILTER
    // ============================================================
    function applyFilters() {
        if (!allData || allData.length === 0) return;
        const search = document.getElementById('searchInput').value || '';
        const dateVal = document.getElementById('dateInput').value || '';
        let filterDate = null;
        if (dateVal) filterDate = new Date(dateVal);
        
        renderUpcoming(allData);
        renderCards(allData, search, filterDate);
    }

    // ============================================================
    // LOAD DATA
    // ============================================================
    async function loadData() {
        const container = document.getElementById('gridContainer');
        container.innerHTML = `<div class="loader"><div class="spinner"></div><p>Mengambil data dari server...</p></div>`;

        const data = await fetchData();
        if (data && data.length > 0) {
            allData = data;
            showNotice('✅ ' + data.length + ' jadwal berhasil dimuat!', 'success');
            applyFilters();
        } else {
            container.innerHTML = `
                <div class="loader">
                    <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#f59e0b;"></i>
                    <p>Gagal memuat data</p>
                    <p style="font-size:0.8rem;color:#94a3b8;">Pastikan Web App sudah dipublish dan URL benar</p>
                    <button class="btn-refresh" onclick="loadData()" style="margin-top:12px;">
                        <i class="fas fa-sync-alt"></i> Coba Lagi
                    </button>
                </div>
            `;
            document.getElementById('statusText').textContent = 'Gagal';
            showNotice('❌ Gagal memuat data dari server', 'error');
        }
    }

    // ============================================================
    // EVENT
    // ============================================================
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 300);
    });
    document.getElementById('dateInput').addEventListener('change', applyFilters);
    document.getElementById('clearDateBtn').addEventListener('click', () => {
        document.getElementById('dateInput').value = '';
        applyFilters();
    });
    document.getElementById('refreshBtn').addEventListener('click', loadData);

    document.addEventListener('keydown', (e) => {
        const v = document.getElementById('viewer');
        if (!v.classList.contains('active')) return;
        if (e.key === 'Escape') closeViewer();
        else if (e.key === 'ArrowLeft') viewerSlide(-1);
        else if (e.key === 'ArrowRight') viewerSlide(1);
    });

    let touchStart = 0;
    document.getElementById('viewerMedia').addEventListener('touchstart', (e) => {
        touchStart = e.changedTouches[0].screenX;
    });
    document.getElementById('viewerMedia').addEventListener('touchend', (e) => {
        const diff = touchStart - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) viewerSlide(diff > 0 ? 1 : -1);
    });

    // ============================================================
    // START
    // ============================================================
    loadData();
    console.log('✅ OP Drainase - Siap!');
    console.log('📸 Aturan: Card = TIDAK ADA LABEL, Fullscreen = BEFORE & AFTER');
    console.log('📌 Card pin = warna sesuai status + icon pin');
</script>

</body>
</html>
