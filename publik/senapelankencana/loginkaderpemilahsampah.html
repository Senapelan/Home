<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login | Kader Pemilah Sampah Senapelan</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kader Pemilah Sampah - Senapelan">
    <meta property="og:description" content="Sistem Informasi Kader Pemilah Sampah Senapelan">
    <meta property="og:image" content="https://senapelan.github.io/Home/publik/senapelankencana/image/kaderpemilahsampah.png">
    
    <link rel="icon" type="image/png" href="https://senapelan.github.io/Home/publik/senapelankencana/image/kaderpemilahsampah.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 80, 60, 0.6), rgba(30, 60, 90, 0.55));
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 460px;
            margin: 1.5rem;
            animation: fadeSlideUp 0.6s ease;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 1.8rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-3px);
        }

        .logo-pair {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .logo-pair img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 8px;
        }

        @media (max-width: 480px) {
            .logo-pair img {
                width: 60px;
                height: 60px;
            }
        }

        .brand h2 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a8e0ff, #a8ffc0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
        }

        .brand p {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-top: 4px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
        }

        .category-select, .input-field {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            transition: all 0.2s;
            outline: none;
            color: white;
        }

        .category-select option {
            background: #1a5d6a;
            color: white;
        }

        .category-select:focus, .input-field:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(100, 200, 200, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
        }

        .login-btn, .register-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(105deg, #1a7a6a, #2c6e9e);
            border: none;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .register-btn {
            background: linear-gradient(105deg, #2c6e9e, #1a7a6a);
            margin-top: 0.8rem;
        }

        .login-btn:hover, .register-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #22967a, #3a80b5);
        }

        .login-btn:disabled, .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(220, 60, 60, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.92);
            backdrop-filter: blur(4px);
            color: white;
            padding: 10px 14px;
            border-radius: 1rem;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 16px;
            border-radius: 30px;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 40, 35, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeSlideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: white;
        }

        .modal-header h3 {
            font-size: 1.3rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .photo-section {
            text-align: center;
            margin-bottom: 1rem;
        }

        .photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            margin-bottom: 0.8rem;
        }

        .photo-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .photo-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 16px;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .photo-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        #photoInput {
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        .compression-info {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://senapelan.github.io/Home/data/video/home.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="logo-pair">
                    <img src="https://senapelan.github.io/Home/data/foto/LOGOPEMKOT.png" alt="Logo Pemkot">
                    <img src="https://senapelan.github.io/Home/publik/senapelankencana/image/kaderpemilahsampah.png" alt="Kader Pemilah Sampah">
                </div>
                <h2>🌿 Kader Pemilah Sampah 🌿</h2>
                <p>Kecamatan Senapelan - Pekanbaru</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <div class="input-label">🏢 Pilih Kelurahan</div>
                    <select id="pkkCategory" class="category-select" required>
                        <option value="" disabled selected>-- Pilih Kelurahan --</option>
                        <option value="KAMPUNG BARU">🏘️ Kampung Baru</option>
                        <option value="KAMPUNG BANDAR">🏘️ Kampung Bandar</option>
                        <option value="KAMPUNG DALAM">🏘️ Kampung Dalam</option>
                        <option value="PADANG BULAN">🏘️ Padang Bulan</option>
                        <option value="PADANG TERUBUK">🏘️ Padang Terubuk</option>
                        <option value="SAGO">🏘️ Sago</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="input-label">👤 Username</div>
                    <input type="text" id="username" class="input-field" placeholder="Masukkan username" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <div class="input-label">🔒 Password</div>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="off" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>

                <button type="submit" id="loginButton" class="login-btn">
                    <span>✨</span> MASUK
                </button>
            </form>

            <button id="openRegisterBtn" class="register-btn">
                <span>📝</span> DAFTAR AKUN BARU
            </button>

            <div id="errorBox" style="min-height: 65px;"></div>
            
            <div class="info-footer">
                🌱 Sistem Informasi Kader Pemilah Sampah - Senapelan
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRASI -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📝 Daftar Akun Kader</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <div class="input-label">🏢 Pilih Kelurahan</div>
                    <select id="regKelurahan" class="category-select" required>
                        <option value="" disabled selected>-- Pilih Kelurahan --</option>
                        <option value="KAMPUNG BARU">Kampung Baru</option>
                        <option value="KAMPUNG BANDAR">Kampung Bandar</option>
                        <option value="KAMPUNG DALAM">Kampung Dalam</option>
                        <option value="PADANG BULAN">Padang Bulan</option>
                        <option value="PADANG TERUBUK">Padang Terubuk</option>
                        <option value="SAGO">Sago</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="input-label">👤 Nama Lengkap</div>
                    <input type="text" id="regNama" class="input-field" placeholder="Nama lengkap" required>
                </div>

                <div class="form-group">
                    <div class="input-label">📛 Username</div>
                    <input type="text" id="regUsername" class="input-field" placeholder="Username untuk login" required>
                </div>

                <div class="form-group">
                    <div class="input-label">🔒 Password</div>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" class="input-field" placeholder="Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('regPassword')">👁️</button>
                    </div>
                </div>

                <div class="photo-section">
                    <div class="input-label">📸 Foto Profil</div>
                    <img id="photoPreview" class="photo-preview" src="https://via.placeholder.com/120?text=Foto">
                    <div class="photo-buttons">
                        <button type="button" class="photo-btn" onclick="openCamera()">📷 Kamera</button>
                        <button type="button" class="photo-btn" onclick="openGallery()">🖼️ Galeri</button>
                    </div>
                    <input type="file" id="photoInput" accept="image/*">
                    <div class="compression-info">✨ Foto akan dikompres otomatis (max 200KB)</div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="login-btn">
                    <span>✅</span> DAFTAR
                </button>
            </form>
            <div id="regErrorBox" style="min-height: 50px; margin-top: 10px;"></div>
        </div>
    </div>

<script>
    // ============ KONFIGURASI ============
    const SPREADSHEET_ID = "1cW2pwnx_ETH2oNalDHEPg7Bjh5e6s_4xPwKCGphFVzE";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBBiSDGuJcDQQB_8PnzLZwQ2REO4JYXPv95lxiVSue9HpuxDG6kJdevORCqozTBYR09Q/exec";
    
    // CORS Proxy (mengatasi blocked by CORS)
    const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";
    
    function getSheetName(kelurahan) {
        const mapping = {
            "KAMPUNG BARU": "KAMPUNG BARU",
            "KAMPUNG BANDAR": "KAMPUNG BANDAR",
            "KAMPUNG DALAM": "KAMPUNG DALAM",
            "PADANG BULAN": "PADANG BULAN",
            "PADANG TERUBUK": "PADANG TERUBUK",
            "SAGO": "SAGO"
        };
        return mapping[kelurahan];
    }

    // Elements
    const loginForm = document.getElementById('loginForm');
    const categorySelect = document.getElementById('pkkCategory');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginButton');
    const errorContainer = document.getElementById('errorBox');
    const modal = document.getElementById('registerModal');
    const openBtn = document.getElementById('openRegisterBtn');
    const regErrorBox = document.getElementById('regErrorBox');

    function showError(msg, container=errorContainer) {
        container.innerHTML = `<div class="error-message"><span>⚠️</span> <span>${msg}</span></div>`;
        setTimeout(() => { if(container.innerHTML) container.innerHTML = ''; }, 5000);
    }

    function showSuccess(msg, container=errorContainer) {
        container.innerHTML = `<div class="success-message"><span>✅</span> <span>${msg}</span></div>`;
        setTimeout(() => { if(container.innerHTML) container.innerHTML = ''; }, 3000);
    }

    function setLoading(btn, isLoading, originalText) {
        if(isLoading) {
            btn.disabled = true;
            btn.innerHTML = `<span class="loader"></span> <span>Memproses...</span>`;
        } else {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === 'password' ? 'text' : 'password';
    }

    // ============ FUNGSI KOMPRESI FOTO ============
    function compressImage(file, maxSizeKB = 200, targetWidth = 400) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > targetWidth) {
                        height = (height * targetWidth) / width;
                        width = targetWidth;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let quality = 0.7;
                    let resultBase64 = canvas.toDataURL('image/jpeg', quality);
                    
                    while (resultBase64.length > maxSizeKB * 1024 * 1.3 && quality > 0.2) {
                        quality -= 0.1;
                        resultBase64 = canvas.toDataURL('image/jpeg', quality);
                    }
                    
                    resolve({
                        base64: resultBase64,
                        type: 'image/jpeg',
                        originalSize: file.size,
                        compressedSize: resultBase64.length * 0.75
                    });
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    // ============ LOGIN ============
    async function handleLogin(e) {
        e.preventDefault();
        errorContainer.innerHTML = '';
        
        const kelurahan = categorySelect.value;
        if (!kelurahan) return showError("Pilih Kelurahan!");
        
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) return showError("Username/Password tidak boleh kosong!");
        
        setLoading(loginBtn, true, '<span>✨</span> MASUK');
        
        try {
            const sheetName = getSheetName(kelurahan);
            // Gunakan proxy untuk menghindari CORS
            const url = `${CORS_PROXY}${APPS_SCRIPT_URL}?action=login&spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(sheetName)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
            
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.success) {
                sessionStorage.setItem('kader_loggedIn', 'true');
                sessionStorage.setItem('kader_kelurahan', kelurahan);
                sessionStorage.setItem('kader_username', username);
                sessionStorage.setItem('kader_nama', data.nama || username);
                sessionStorage.setItem('kader_foto', data.link_foto || '');
                showSuccess("Login berhasil! Mengalihkan...");
                setTimeout(() => {
                    window.location.href = "dashboardkaderpemilahsampah.html";
                }, 1200);
            } else {
                showError(data.message || "Username atau password salah!");
                passwordInput.value = '';
            }
        } catch(err) {
            showError("Gagal terhubung ke server: " + err.message);
        }
        setLoading(loginBtn, false, '<span>✨</span> MASUK');
    }

    // ============ REGISTRASI ============
    let selectedPhotoCompressed = null;
    let isCompressing = false;

    function openCamera() {
        const input = document.getElementById('photoInput');
        input.setAttribute('capture', 'environment');
        input.click();
    }

    function openGallery() {
        const input = document.getElementById('photoInput');
        input.removeAttribute('capture');
        input.click();
    }

    document.getElementById('photoInput').addEventListener('change', async function(e) {
        if(e.target.files && e.target.files[0]) {
            const file = e.target.files[0];
            document.getElementById('photoPreview').src = "https://via.placeholder.com/120?text=Memproses...";
            
            try {
                isCompressing = true;
                const compressed = await compressImage(file, 200, 400);
                selectedPhotoCompressed = compressed;
                document.getElementById('photoPreview').src = compressed.base64;
            } catch (err) {
                showError("Gagal memproses foto!", regErrorBox);
                selectedPhotoCompressed = null;
            } finally {
                isCompressing = false;
            }
        }
    });

    async function handleRegister(e) {
        e.preventDefault();
        regErrorBox.innerHTML = '';
        
        if (isCompressing) {
            return showError("Mohon tunggu, foto sedang diproses...", regErrorBox);
        }
        
        const kelurahan = document.getElementById('regKelurahan').value;
        if (!kelurahan) return showError("Pilih Kelurahan!", regErrorBox);
        
        const nama = document.getElementById('regNama').value.trim();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        
        if (!nama || !username || !password) return showError("Semua field harus diisi!", regErrorBox);
        if (!selectedPhotoCompressed) return showError("Ambil foto profil terlebih dahulu!", regErrorBox);
        
        const submitBtn = document.getElementById('registerSubmitBtn');
        setLoading(submitBtn, true, '<span>✅</span> DAFTAR');
        
        try {
            let photoBase64 = selectedPhotoCompressed.base64;
            const encodedPhoto = encodeURIComponent(photoBase64);
            
            // Gunakan proxy untuk menghindari CORS
            const url = `${CORS_PROXY}${APPS_SCRIPT_URL}?action=register&spreadsheetId=${SPREADSHEET_ID}&kelurahan=${encodeURIComponent(kelurahan)}&sheetName=${encodeURIComponent(getSheetName(kelurahan))}&nama=${encodeURIComponent(nama)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&photoBase64=${encodedPhoto}&photoType=${selectedPhotoCompressed.type}`;
            
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                showSuccess("Pendaftaran berhasil! Silakan login.", regErrorBox);
                setTimeout(() => {
                    closeModal();
                    document.getElementById('registerForm').reset();
                    document.getElementById('photoPreview').src = "https://via.placeholder.com/120?text=Foto";
                    selectedPhotoCompressed = null;
                    categorySelect.value = kelurahan;
                    usernameInput.value = username;
                    passwordInput.value = password;
                }, 2000);
            } else {
                showError(result.message || "Pendaftaran gagal!", regErrorBox);
            }
        } catch(err) {
            showError("Error: " + err.message, regErrorBox);
        }
        setLoading(submitBtn, false, '<span>✅</span> DAFTAR');
    }

    function closeModal() {
        modal.style.display = 'none';
        document.getElementById('registerForm').reset();
        document.getElementById('photoPreview').src = "https://via.placeholder.com/120?text=Foto";
        selectedPhotoCompressed = null;
        regErrorBox.innerHTML = '';
    }

    openBtn.onclick = () => modal.style.display = 'flex';
    window.onclick = (e) => { if(e.target === modal) closeModal(); };
    
    loginForm.addEventListener('submit', handleLogin);
    document.getElementById('registerForm').addEventListener('submit', handleRegister);
</script>
</body>
</html>
