<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kader Pemilahan Sampah | Bank Sampah Senapelan</title>
    <!-- CSS SAMA SEPERTI YANG ANDA PUNYA, TIDAK SAYA TULIS ULANG UNTUK HEMAT RUANG -->
    <!-- Salin CSS dari kode Anda sebelumnya, atau gunakan style yang sama -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 20px; padding: 20px 30px; margin-bottom: 30px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .logo-left img, .logo-right img { height: 70px; width: auto; }
        .header-title { text-align: center; flex: 1; }
        .card { background: white; border-radius: 24px; padding: 30px; margin-bottom: 25px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.15); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }
        .upload-area { border: 2px dashed #cbd5e0; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; background: #f7fafc; }
        .preview-image { width: 100%; max-width: 150px; display: none; }
        .preview-image.active { display: block; }
        .daftar-warga-container { max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; }
        .warga-item { padding: 12px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
        .warga-item.selected { background: #c7d2fe; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; visibility:hidden; opacity:0; transition:0.3s; }
        .modal.active { visibility:visible; opacity:1; }
        .modal-content { background:white; padding:20px; border-radius:20px; max-width:400px; width:90%; }
        .toast-notif { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px); background:white; padding:12px 24px; border-radius:40px; transition:0.3s; z-index:10000; }
        .toast-notif.show { transform:translateX(-50%) translateY(0); }
        .loading-spinner { display:inline-block; width:20px; height:20px; border:2px solid #ccc; border-top-color:#667eea; border-radius:50%; animation:spin 0.6s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @media (max-width:768px){ .btn{width:100%;} }
    </style>
</head>
<body>
<div class="container">
    <!-- Header sama seperti sebelumnya -->
    <div class="header">
        <div class="logo-left"><img src="https://senapelan.github.io/Home/data/foto/LOGOPEMKOT.png" alt="Logo"></div>
        <div class="header-title"><h1>BANK SAMPAH SENAPELAN</h1><p>Sistem Informasi Kader Pemilahan Sampah Dari Rumah</p></div>
        <div class="logo-right"><img src="https://senapelan.github.io/Home/publik/senapelankencana/image/kaderpemilahsampah.png" alt="Kader"></div>
    </div>
    <!-- Verifikasi Kader -->
    <div class="card">
        <div class="card-title">🔑 Verifikasi Kader</div>
        <input type="text" id="idKader" placeholder="ID Kader">
        <button class="btn btn-primary" id="btnVerifikasi" onclick="cekIdKader()">Verifikasi</button>
        <div id="infoKader" style="display:none; margin-top:15px; background:#f0f4ff; padding:15px; border-radius:12px;">
            <div>Nama: <span id="displayNamaKader">-</span></div>
            <div>Jabatan: <span id="displayJabatan">-</span></div>
            <div>Kelurahan: <span id="displayKelurahan">-</span></div>
        </div>
    </div>
    <!-- Form Warga & Laporan (awalnya tersembunyi) -->
    <div id="formWarga" style="display:none;">
        <div class="card">
            <div class="card-title">📋 Daftar Warga Binaan</div>
            <div id="daftarWargaList" class="daftar-warga-container">Memuat...</div>
            <button class="btn btn-secondary" onclick="showTambahWargaModal()" style="margin-top:10px;">Tambah Warga</button>
            <div style="margin-top:20px;">
                <label>Nama Warga Terpilih</label>
                <input type="text" id="namaWarga" readonly>
                <label>Alamat</label>
                <textarea id="alamatWarga" rows="2" readonly></textarea>
            </div>
        </div>
        <div class="card">
            <div class="card-title">🗑️ Laporan Pemilahan Sampah</div>
            <input type="date" id="tanggalLaporan">
            <div class="form-group"><label>Sampah Organik (Kg)</label><input type="number" id="organik" step="0.1" value="0"></div>
            <div class="form-group"><label>Foto Organik</label><div class="upload-area" onclick="document.getElementById('fotoOrganik').click()">Upload</div><input type="file" id="fotoOrganik" accept="image/*" style="display:none" onchange="previewImage(this,'previewOrganik')"><img id="previewOrganik" class="preview-image"></div>
            <div class="form-group"><label>Sampah An Organik (Kg)</label><input type="number" id="anOrganik" step="0.1" value="0"></div>
            <div class="form-group"><label>Foto An Organik</label><div class="upload-area" onclick="document.getElementById('fotoAnOrganik').click()">Upload</div><input type="file" id="fotoAnOrganik" accept="image/*" style="display:none" onchange="previewImage(this,'previewAnOrganik')"><img id="previewAnOrganik" class="preview-image"></div>
            <div class="form-group"><label>Sampah Residu (Kg)</label><input type="number" id="residu" step="0.1" value="0"></div>
            <div class="form-group"><label>Foto Residu</label><div class="upload-area" onclick="document.getElementById('fotoResidu').click()">Upload</div><input type="file" id="fotoResidu" accept="image/*" style="display:none" onchange="previewImage(this,'previewResidu')"><img id="previewResidu" class="preview-image"></div>
            <div class="form-group"><strong>Total: <span id="totalSampah">0 Kg</span></strong></div>
            <button class="btn btn-primary" onclick="submitLaporan()">Kirim Laporan</button>
        </div>
    </div>
</div>
<!-- Modal Tambah Warga -->
<div id="tambahWargaModal" class="modal"><div class="modal-content"><h3>Tambah Warga</h3><input type="text" id="modalNamaWarga" placeholder="Nama"><textarea id="modalAlamatWarga" placeholder="Alamat"></textarea><div style="margin-top:15px;"><button class="btn btn-secondary" onclick="closeTambahWargaModal()">Batal</button><button class="btn btn-primary" onclick="tambahWargaBaru()">Simpan</button></div></div></div>
<div id="loadingModal" class="modal"><div class="modal-content" style="text-align:center;"><div class="loading-spinner"></div><p id="loadingText">Memproses...</p></div></div>

<script>
    // Konfigurasi - GANTI DENGAN URL APPS SCRIPT HASIL DEPLOY TERBARU
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJ027eCEs2m9wtFrInauzjlWD29Jw2alh2KBZs-znIlWQGqqVzfkhAX531bhegSpVB/exec';
    
    let sessionKader = {};
    let selectedWarga = null;
    let daftarWarga = [];

    function showToast(type, msg) { let t=document.createElement('div'); t.className=`toast-notif ${type}`; t.innerHTML=type==='success'?`✅ ${msg}`:`❌ ${msg}`; document.body.appendChild(t); setTimeout(()=>t.classList.add('show'),10); setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4000); }
    function showLoading(show,text='Memproses...'){ let m=document.getElementById('loadingModal'); if(show){ document.getElementById('loadingText').innerText=text; m.classList.add('active'); }else{ m.classList.remove('active'); } }
    function previewImage(input, previewId){ if(input.files[0]){ let file=input.files[0]; if(file.size>2*1024*1024){ showToast('error','Maksimal 2MB'); input.value=''; return; } let reader=new FileReader(); reader.onload=e=>{ let img=document.getElementById(previewId); img.src=e.target.result; img.classList.add('active'); }; reader.readAsDataURL(file); } }
    function calculateTotal(){ let o=parseFloat(document.getElementById('organik').value)||0; let a=parseFloat(document.getElementById('anOrganik').value)||0; let r=parseFloat(document.getElementById('residu').value)||0; document.getElementById('totalSampah').innerText=(o+a+r).toFixed(2)+' Kg'; }
    document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('tanggalLaporan').value=new Date().toISOString().slice(0,10); document.getElementById('organik').addEventListener('input',calculateTotal); document.getElementById('anOrganik').addEventListener('input',calculateTotal); document.getElementById('residu').addEventListener('input',calculateTotal); });

    async function cekIdKader(){
        let id=document.getElementById('idKader').value.trim();
        if(!id){ showToast('error','Masukkan ID Kader'); return; }
        let btn=document.getElementById('btnVerifikasi');
        let orig=btn.innerHTML;
        btn.innerHTML='<span class="loading-spinner"></span> Cek...'; btn.disabled=true;
        try{
            let res=await fetch(`${SCRIPT_URL}?action=cekKader&id_kader=${encodeURIComponent(id)}`);
            let data=await res.json();
            if(data.success && data.data){
                sessionKader=data.data;
                sessionKader.id_kader=id;
                document.getElementById('displayNamaKader').innerText=data.data.nama_kader;
                document.getElementById('displayJabatan').innerText=data.data.jabatan;
                document.getElementById('displayKelurahan').innerText=data.data.kelurahan;
                document.getElementById('infoKader').style.display='block';
                document.getElementById('formWarga').style.display='block';
                await loadDaftarWarga();
                showToast('success','Selamat datang '+data.data.nama_kader);
            } else { showToast('error',data.error||'ID tidak ditemukan'); document.getElementById('infoKader').style.display='none'; document.getElementById('formWarga').style.display='none'; }
        }catch(e){ showToast('error','Gagal koneksi'); }finally{ btn.innerHTML=orig; btn.disabled=false; }
    }

    async function loadDaftarWarga(){
        if(!sessionKader.id_kader) return;
        let container=document.getElementById('daftarWargaList');
        container.innerHTML='<div style="padding:20px;text-align:center;">Memuat...</div>';
        try{
            let res=await fetch(`${SCRIPT_URL}?action=getAllWarga&id_kader=${encodeURIComponent(sessionKader.id_kader)}&kelurahan=${encodeURIComponent(sessionKader.kelurahan)}`);
            let result=await res.json();
            if(result.success && result.data){ daftarWarga=result.data; renderDaftarWarga(); }
            else{ container.innerHTML='<div style="padding:20px;text-align:center;">Belum ada warga</div>'; }
        }catch(e){ container.innerHTML='<div style="padding:20px;text-align:center;color:red;">Gagal memuat</div>'; }
    }
    function renderDaftarWarga(){
        let container=document.getElementById('daftarWargaList');
        if(!daftarWarga.length){ container.innerHTML='<div style="padding:20px;text-align:center;">Belum ada warga</div>'; return; }
        container.innerHTML='';
        daftarWarga.forEach(w=>{
            let div=document.createElement('div');
            div.className='warga-item';
            if(selectedWarga && selectedWarga.nama_warga_binaan===w.nama_warga_binaan) div.classList.add('selected');
            div.innerHTML=`<div><strong>${escapeHtml(w.nama_warga_binaan)}</strong><br><small>${escapeHtml(w.alamat_binaan)}</small><br><small>Dibuat oleh: ${w.dibuat_oleh_id===sessionKader.id_kader?'Saya':w.dibuat_oleh_nama}</small></div>`;
            div.onclick=()=>selectWarga(w);
            container.appendChild(div);
        });
    }
    function selectWarga(w){
        selectedWarga=w;
        document.getElementById('namaWarga').value=w.nama_warga_binaan;
        document.getElementById('alamatWarga').value=w.alamat_binaan;
        document.querySelectorAll('.warga-item').forEach(el=>el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        showToast('success',`Warga ${w.nama_warga_binaan} dipilih`);
    }
    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g,function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function showTambahWargaModal(){ document.getElementById('modalNamaWarga').value=''; document.getElementById('modalAlamatWarga').value=''; document.getElementById('tambahWargaModal').classList.add('active'); }
    function closeTambahWargaModal(){ document.getElementById('tambahWargaModal').classList.remove('active'); }

    async function tambahWargaBaru(){
        let nama=document.getElementById('modalNamaWarga').value.trim();
        let alamat=document.getElementById('modalAlamatWarga').value.trim();
        if(!nama){ showToast('error','Nama wajib'); return; }
        closeTambahWargaModal();
        showLoading(true,'Menyimpan warga...');
        try{
            let payload={ action:'tambahWarga', id_kader:sessionKader.id_kader, nama_kader:sessionKader.nama_kader, jabatan:sessionKader.jabatan, kelurahan:sessionKader.kelurahan, nama_warga_binaan:nama, alamat_binaan:alamat };
            let res=await fetch(SCRIPT_URL,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            let result=await res.json();
            if(result.success){
                let wargaBaru={ nama_warga_binaan:nama, alamat_binaan:alamat, dibuat_oleh_id:sessionKader.id_kader, dibuat_oleh_nama:sessionKader.nama_kader };
                daftarWarga.unshift(wargaBaru);
                renderDaftarWarga();
                selectWarga(wargaBaru);
                showToast('success','Warga ditambahkan');
            } else { showToast('error',result.error||'Gagal'); }
        }catch(e){ showToast('error','Gagal koneksi'); }finally{ showLoading(false); }
    }

    // Fungsi konversi file ke base64
    function fileToBase64(file){
        return new Promise((resolve,reject)=>{
            let reader=new FileReader();
            reader.onload=()=>{ let base64=reader.result.split(',')[1]; resolve({ base64:base64, type:file.type, name:file.name }); };
            reader.onerror=reject;
            reader.readAsDataURL(file);
        });
    }

    // SUBMIT LAPORAN dengan fetch + CORS (tambahkan mode cors & credentials)
    async function submitLaporan(){
        if(!selectedWarga){ showToast('error','Pilih warga dulu'); return; }
        let tanggal=document.getElementById('tanggalLaporan').value;
        let organik=parseFloat(document.getElementById('organik').value)||0;
        let anOrganik=parseFloat(document.getElementById('anOrganik').value)||0;
        let residu=parseFloat(document.getElementById('residu').value)||0;
        if(organik===0 && anOrganik===0 && residu===0){ showToast('error','Minimal satu sampah >0'); return; }
        let fileOrg=document.getElementById('fotoOrganik').files[0];
        let fileAn=document.getElementById('fotoAnOrganik').files[0];
        let fileRes=document.getElementById('fotoResidu').files[0];
        if(!fileOrg && !fileAn && !fileRes){ showToast('error','Upload minimal 1 foto'); return; }
        showLoading(true,'Mengirim laporan...');
        try{
            let fotoOrgData=fileOrg ? await fileToBase64(fileOrg) : null;
            let fotoAnData=fileAn ? await fileToBase64(fileAn) : null;
            let fotoResData=fileRes ? await fileToBase64(fileRes) : null;
            let payload={
                action:'submitLaporan',
                id_kader:sessionKader.id_kader,
                nama_kader:sessionKader.nama_kader,
                jabatan:sessionKader.jabatan,
                kelurahan:sessionKader.kelurahan,
                tanggal_input:tanggal,
                nama_warga_binaan:selectedWarga.nama_warga_binaan,
                alamat_binaan:selectedWarga.alamat_binaan,
                organik:organik,
                an_organik:anOrganik,
                residu:residu,
                foto_organik:fotoOrgData,
                foto_anorganik:fotoAnData,
                foto_residu:fotoResData
            };
            let response=await fetch(SCRIPT_URL,{
                method:'POST',
                mode:'cors',
                credentials:'omit',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(payload)
            });
            let result=await response.json();
            showLoading(false);
            if(result.success){
                showToast('success','Laporan terkirim!');
                // reset form
                document.getElementById('organik').value='0';
                document.getElementById('anOrganik').value='0';
                document.getElementById('residu').value='0';
                document.getElementById('fotoOrganik').value='';
                document.getElementById('fotoAnOrganik').value='';
                document.getElementById('fotoResidu').value='';
                ['previewOrganik','previewAnOrganik','previewResidu'].forEach(id=>{ let img=document.getElementById(id); if(img){ img.classList.remove('active'); img.src=''; } });
                calculateTotal();
            } else { showToast('error',result.error||'Gagal kirim'); }
        }catch(e){ showLoading(false); showToast('error','Gagal kirim: '+e.message); console.error(e); }
    }
</script>
</body>
</html>
