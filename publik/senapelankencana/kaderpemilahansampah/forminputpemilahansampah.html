<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Sampah Senapelan - Kader Pemilahan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: white; border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .logo-left img, .logo-right img { height: 70px; }
        .header-title { text-align: center; flex: 1; }
        .card { background: white; border-radius: 24px; padding: 30px; margin-bottom: 25px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.15); }
        .btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }
        .upload-area { border: 2px dashed #cbd5e0; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; background: #f7fafc; margin-bottom: 10px; }
        .preview-image { max-width: 150px; border-radius: 8px; display: none; margin-top: 10px; }
        .preview-image.active { display: block; }
        .upload-status { font-size: 0.8rem; margin-top: 5px; color: #718096; }
        .upload-status.success { color: #2b6e3b; }
        .upload-status.error { color: #c53030; }
        .daftar-warga-container { max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; }
        .warga-item { padding: 12px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
        .warga-item.selected { background: #c7d2fe; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; z-index: 1000; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content { background: white; padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: white; padding: 12px 24px; border-radius: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1100; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #e2e8f0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input, textarea, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; font-family: inherit; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        .info-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .info-item { background: #f0f4ff; padding: 8px 12px; border-radius: 12px; flex: 1; }
        @media (max-width: 640px) { .btn { width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-left"><img src="https://senapelan.github.io/Home/data/foto/LOGOPEMKOT.png" alt="Logo"></div>
        <div class="header-title"><h1>BANK SAMPAH SENAPELAN</h1><p>Sistem Informasi Kader Pemilahan</p></div>
        <div class="logo-right"><img src="https://senapelan.github.io/Home/publik/senapelankencana/image/kaderpemilahsampah.png" alt="Kader"></div>
    </div>

    <!-- Verifikasi Kader -->
    <div class="card">
        <h3>🔑 Verifikasi Kader</h3>
        <input type="text" id="idKader" placeholder="ID Kader (contoh: kb@001)">
        <button class="btn btn-primary" id="btnVerif" onclick="verifikasiKader()">Verifikasi</button>
        <div id="infoKader" style="display: none; margin-top: 15px;">
            <div class="info-grid">
                <div class="info-item"><strong>Nama</strong><br><span id="displayNama">-</span></div>
                <div class="info-item"><strong>Jabatan</strong><br><span id="displayJabatan">-</span></div>
                <div class="info-item"><strong>Kelurahan</strong><br><span id="displayKelurahan">-</span></div>
            </div>
        </div>
    </div>

    <!-- Form utama (sembunyi sampai verifikasi berhasil) -->
    <div id="mainForm" style="display: none;">
        <!-- Daftar warga -->
        <div class="card">
            <h3>📋 Daftar Warga Binaan</h3>
            <div id="daftarWarga" class="daftar-warga-container">Memuat...</div>
            <button class="btn btn-secondary" onclick="showTambahWarga()">+ Tambah Warga Baru</button>
            <div style="margin-top: 20px;">
                <label>Warga terpilih</label>
                <input type="text" id="selectedNamaWarga" readonly placeholder="Pilih warga dari daftar">
                <label>Alamat</label>
                <textarea id="selectedAlamatWarga" rows="2" readonly></textarea>
            </div>
        </div>

        <!-- Form laporan -->
        <div class="card">
            <h3>🗑️ Laporan Pemilahan Sampah</h3>
            <label>Tanggal</label>
            <input type="date" id="tanggalLaporan">

            <label>Sampah Organik (Kg)</label>
            <input type="number" id="organik" step="0.1" value="0">

            <label>Foto Bukti Organik</label>
            <div class="upload-area" onclick="document.getElementById('fileOrganik').click()">📸 Klik untuk upload foto</div>
            <input type="file" id="fileOrganik" accept="image/*" style="display: none">
            <img id="previewOrganik" class="preview-image">
            <div id="statusOrganik" class="upload-status"></div>
            <input type="hidden" id="urlOrganik" value="">

            <label>Sampah An Organik (Kg)</label>
            <input type="number" id="anOrganik" step="0.1" value="0">

            <label>Foto Bukti An Organik</label>
            <div class="upload-area" onclick="document.getElementById('fileAnOrganik').click()">📸 Klik untuk upload foto</div>
            <input type="file" id="fileAnOrganik" accept="image/*" style="display: none">
            <img id="previewAnOrganik" class="preview-image">
            <div id="statusAnOrganik" class="upload-status"></div>
            <input type="hidden" id="urlAnOrganik" value="">

            <label>Sampah Residu (Kg)</label>
            <input type="number" id="residu" step="0.1" value="0">

            <label>Foto Bukti Residu</label>
            <div class="upload-area" onclick="document.getElementById('fileResidu').click()">📸 Klik untuk upload foto</div>
            <input type="file" id="fileResidu" accept="image/*" style="display: none">
            <img id="previewResidu" class="preview-image">
            <div id="statusResidu" class="upload-status"></div>
            <input type="hidden" id="urlResidu" value="">

            <div style="background: #f7fafc; padding: 15px; border-radius: 12px; margin: 15px 0;">
                <strong>Total Sampah: <span id="totalSampah">0 Kg</span></strong>
            </div>

            <button class="btn btn-primary" id="btnKirimLaporan" disabled onclick="kirimLaporan()">📤 Kirim Laporan (tunggu upload foto selesai)</button>
        </div>
    </div>
</div>

<!-- Modal tambah warga -->
<div id="modalTambahWarga" class="modal">
    <div class="modal-content">
        <h3>Tambah Warga Baru</h3>
        <input type="text" id="modalNama" placeholder="Nama warga">
        <textarea id="modalAlamat" placeholder="Alamat lengkap" rows="2"></textarea>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
            <button class="btn btn-primary" onclick="tambahWarga()">Simpan</button>
        </div>
    </div>
</div>

<!-- Iframe tersembunyi untuk komunikasi tanpa CORS -->
<iframe name="hiddenFrameUpload" style="display:none"></iframe>
<iframe name="hiddenFrameSubmit" style="display:none"></iframe>

<script>
    // ==================== KONFIGURASI ====================
    // GANTI DENGAN URL APPS SCRIPT ANDA (HASIL DEPLOY)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyP9vg28M0dbpb0YJAEsO0Zdq9zSokjYJjTZ5F2fzY7kNeZsSV_kBa--QzZgfZB0r1K/exec';
    
    let sessionKader = {};
    let daftarWarga = [];
    let selectedWarga = null;

    // Status upload foto (untuk mengaktifkan tombol kirim)
    let uploadStatus = {
        organik: { uploading: false, url: '', required: false },
        anorganik: { uploading: false, url: '', required: false },
        residu: { uploading: false, url: '', required: false }
    };

    // ==================== UTILITY ====================
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = isError ? `❌ ${msg}` : `✅ ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 400);
        }, 4000);
    }

    function updateKirimButton() {
        let allDone = true;
        // Cek apakah setidaknya satu foto sudah diupload (karena minimal 1 foto wajib)
        let anyUploaded = uploadStatus.organik.url !== '' || uploadStatus.anorganik.url !== '' || uploadStatus.residu.url !== '';
        // Dan tidak ada yang sedang upload
        let noUploading = !uploadStatus.organik.uploading && !uploadStatus.anorganik.uploading && !uploadStatus.residu.uploading;
        allDone = anyUploaded && noUploading;
        document.getElementById('btnKirimLaporan').disabled = !allDone;
        if (!allDone) {
            if (!anyUploaded) document.getElementById('btnKirimLaporan').innerText = '📤 Upload minimal 1 foto terlebih dahulu';
            else if (!noUploading) document.getElementById('btnKirimLaporan').innerText = '⏳ Masih ada foto yang diupload...';
        } else {
            document.getElementById('btnKirimLaporan').innerText = '📤 Kirim Laporan ke Lurah & Camat';
        }
    }

    // Upload file ke Google Drive via iframe (tanpa CORS)
    function uploadFile(file, jenis, hiddenUrlId, previewId, statusId) {
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            showToast('Ukuran foto maksimal 2MB', true);
            return;
        }
        // Tandai sedang upload
        uploadStatus[jenis].uploading = true;
        uploadStatus[jenis].url = '';
        document.getElementById(hiddenUrlId).value = '';
        document.getElementById(statusId).innerHTML = '<span class="loading-spinner"></span> Mengupload...';
        updateKirimButton();

        // Buat form data dan submit ke iframe
        let form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL + '?action=uploadFoto';
        form.target = 'hiddenFrameUpload';
        form.enctype = 'multipart/form-data';
        
        let fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.name = 'foto';
        let fileList = new DataTransfer();
        fileList.items.add(file);
        fileInput.files = fileList.files;
        
        let jenisInput = document.createElement('input');
        jenisInput.type = 'hidden';
        jenisInput.name = 'jenis';
        jenisInput.value = jenis;
        
        let kaderInput = document.createElement('input');
        kaderInput.type = 'hidden';
        kaderInput.name = 'id_kader';
        kaderInput.value = sessionKader.id_kader || '';
        
        let namaInput = document.createElement('input');
        namaInput.type = 'hidden';
        namaInput.name = 'nama_kader';
        namaInput.value = sessionKader.nama_kader || '';
        
        form.appendChild(fileInput);
        form.appendChild(jenisInput);
        form.appendChild(kaderInput);
        form.appendChild(namaInput);
        document.body.appendChild(form);
        
        // Event listener untuk iframe response (postMessage)
        window.addEventListener('message', function onMessage(e) {
            if (e.data && e.data.action === 'uploadComplete' && e.data.jenis === jenis) {
                window.removeEventListener('message', onMessage);
                if (e.data.success) {
                    uploadStatus[jenis].url = e.data.url;
                    uploadStatus[jenis].uploading = false;
                    document.getElementById(hiddenUrlId).value = e.data.url;
                    document.getElementById(statusId).innerHTML = '<span style="color:#2b6e3b;">✓ Upload berhasil</span>';
                    document.getElementById(previewId).src = URL.createObjectURL(file);
                    document.getElementById(previewId).classList.add('active');
                    showToast(`Foto ${jenis} berhasil diupload`);
                } else {
                    uploadStatus[jenis].uploading = false;
                    document.getElementById(statusId).innerHTML = `<span style="color:#c53030;">✗ Gagal: ${e.data.error}</span>`;
                    showToast(`Gagal upload foto ${jenis}`, true);
                }
                updateKirimButton();
            }
        });
        
        form.submit();
        document.body.removeChild(form);
    }

    // Event listener untuk input file
    function initFileUpload() {
        const fileOrg = document.getElementById('fileOrganik');
        const fileAn = document.getElementById('fileAnOrganik');
        const fileRes = document.getElementById('fileResidu');
        
        fileOrg.onchange = (e) => {
            if (e.target.files.length) uploadFile(e.target.files[0], 'organik', 'urlOrganik', 'previewOrganik', 'statusOrganik');
        };
        fileAn.onchange = (e) => {
            if (e.target.files.length) uploadFile(e.target.files[0], 'anorganik', 'urlAnOrganik', 'previewAnOrganik', 'statusAnOrganik');
        };
        fileRes.onchange = (e) => {
            if (e.target.files.length) uploadFile(e.target.files[0], 'residu', 'urlResidu', 'previewResidu', 'statusResidu');
        };
    }

    // ==================== VERIFIKASI KADER (via iframe) ====================
    function verifikasiKader() {
        let id = document.getElementById('idKader').value.trim();
        if (!id) { showToast('Masukkan ID Kader', true); return; }
        let iframe = document.createElement('iframe');
        iframe.name = 'hiddenFrameGet';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        let form = document.createElement('form');
        form.method = 'GET';
        form.action = SCRIPT_URL + '?action=cekKader&id_kader=' + encodeURIComponent(id);
        form.target = 'hiddenFrameGet';
        document.body.appendChild(form);
        
        iframe.onload = () => {
            try {
                let responseText = iframe.contentDocument.body.innerText;
                let result = JSON.parse(responseText);
                if (result.success && result.data) {
                    sessionKader = result.data;
                    sessionKader.id_kader = id;
                    document.getElementById('displayNama').innerText = result.data.nama_kader;
                    document.getElementById('displayJabatan').innerText = result.data.jabatan;
                    document.getElementById('displayKelurahan').innerText = result.data.kelurahan;
                    document.getElementById('infoKader').style.display = 'block';
                    document.getElementById('mainForm').style.display = 'block';
                    loadDaftarWarga();
                    showToast(`Selamat datang, ${result.data.nama_kader}`);
                } else {
                    showToast(result.error || 'ID Kader tidak ditemukan', true);
                }
            } catch(e) { showToast('Gagal verifikasi', true); }
            iframe.remove();
            form.remove();
        };
        form.submit();
    }

    // Load daftar warga via iframe
    function loadDaftarWarga() {
        if (!sessionKader.kelurahan) return;
        let iframe = document.createElement('iframe');
        iframe.name = 'hiddenFrameWarga';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        let form = document.createElement('form');
        form.method = 'GET';
        form.action = `${SCRIPT_URL}?action=getAllWarga&id_kader=${encodeURIComponent(sessionKader.id_kader || '')}&kelurahan=${encodeURIComponent(sessionKader.kelurahan)}`;
        form.target = 'hiddenFrameWarga';
        document.body.appendChild(form);
        
        iframe.onload = () => {
            try {
                let resp = JSON.parse(iframe.contentDocument.body.innerText);
                if (resp.success && resp.data) {
                    daftarWarga = resp.data;
                    renderDaftarWarga();
                } else {
                    document.getElementById('daftarWarga').innerHTML = '<div style="padding:20px;text-align:center;">Belum ada warga</div>';
                }
            } catch(e) { console.error(e); }
            iframe.remove();
            form.remove();
        };
        form.submit();
    }

    function renderDaftarWarga() {
        let container = document.getElementById('daftarWarga');
        if (!daftarWarga.length) { container.innerHTML = '<div style="padding:20px;text-align:center;">Belum ada warga</div>'; return; }
        container.innerHTML = '';
        daftarWarga.forEach(w => {
            let div = document.createElement('div');
            div.className = 'warga-item';
            div.innerHTML = `<strong>${escapeHtml(w.nama_warga_binaan)}</strong><br><small>${escapeHtml(w.alamat_binaan)}</small><br><small>Dibuat oleh: ${w.dibuat_oleh_id === sessionKader.id_kader ? 'Saya' : w.dibuat_oleh_nama}</small>`;
            div.onclick = () => selectWarga(w);
            container.appendChild(div);
        });
    }

    function selectWarga(w) {
        selectedWarga = w;
        document.getElementById('selectedNamaWarga').value = w.nama_warga_binaan;
        document.getElementById('selectedAlamatWarga').value = w.alamat_binaan;
        document.querySelectorAll('.warga-item').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        showToast(`Warga ${w.nama_warga_binaan} dipilih`);
    }

    function escapeHtml(s) { return s.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }

    // Tambah warga via iframe
    function showTambahWarga() { document.getElementById('modalTambahWarga').classList.add('active'); }
    function closeModal() { document.getElementById('modalTambahWarga').classList.remove('active'); }
    function tambahWarga() {
        let nama = document.getElementById('modalNama').value.trim();
        let alamat = document.getElementById('modalAlamat').value.trim();
        if (!nama) { showToast('Nama wajib diisi', true); return; }
        closeModal();
        
        let iframe = document.createElement('iframe');
        iframe.name = 'hiddenFrameAddWarga';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        let form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = 'hiddenFrameAddWarga';
        form.enctype = 'application/x-www-form-urlencoded';
        let params = new URLSearchParams({
            action: 'tambahWarga',
            id_kader: sessionKader.id_kader,
            nama_kader: sessionKader.nama_kader,
            jabatan: sessionKader.jabatan,
            kelurahan: sessionKader.kelurahan,
            nama_warga_binaan: nama,
            alamat_binaan: alamat
        });
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = params.toString();
        form.appendChild(input);
        document.body.appendChild(form);
        
        iframe.onload = () => {
            try {
                let resp = JSON.parse(iframe.contentDocument.body.innerText);
                if (resp.success) {
                    showToast('Warga berhasil ditambahkan');
                    loadDaftarWarga();
                } else { showToast(resp.error || 'Gagal', true); }
            } catch(e) { showToast('Gagal menambah warga', true); }
            iframe.remove();
            form.remove();
        };
        form.submit();
    }

    // Kirim laporan final (hanya data teks + URL foto)
    function kirimLaporan() {
        if (!selectedWarga) { showToast('Pilih warga terlebih dahulu', true); return; }
        let tanggal = document.getElementById('tanggalLaporan').value;
        let organik = parseFloat(document.getElementById('organik').value) || 0;
        let anOrganik = parseFloat(document.getElementById('anOrganik').value) || 0;
        let residu = parseFloat(document.getElementById('residu').value) || 0;
        let total = organik + anOrganik + residu;
        if (total === 0) { showToast('Minimal satu jenis sampah > 0 Kg', true); return; }
        
        let urlOrganik = document.getElementById('urlOrganik').value;
        let urlAnOrganik = document.getElementById('urlAnOrganik').value;
        let urlResidu = document.getElementById('urlResidu').value;
        if (!urlOrganik && !urlAnOrganik && !urlResidu) { showToast('Harap upload minimal 1 foto', true); return; }
        
        let payload = {
            action: 'submitLaporan',
            id_kader: sessionKader.id_kader,
            nama_kader: sessionKader.nama_kader,
            jabatan: sessionKader.jabatan,
            kelurahan: sessionKader.kelurahan,
            tanggal_input: tanggal,
            nama_warga_binaan: selectedWarga.nama_warga_binaan,
            alamat_binaan: selectedWarga.alamat_binaan,
            organik: organik,
            an_organik: anOrganik,
            residu: residu,
            foto_organik_url: urlOrganik,
            foto_anorganik_url: urlAnOrganik,
            foto_residu_url: urlResidu
        };
        
        let iframe = document.createElement('iframe');
        iframe.name = 'hiddenFrameSubmitLaporan';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        let form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = 'hiddenFrameSubmitLaporan';
        form.enctype = 'application/x-www-form-urlencoded';
        let input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(payload);
        form.appendChild(input);
        document.body.appendChild(form);
        
        iframe.onload = () => {
            try {
                let resp = JSON.parse(iframe.contentDocument.body.innerText);
                if (resp.success) {
                    showToast('Laporan berhasil dikirim!');
                    // Reset form setelah sukses
                    document.getElementById('organik').value = '0';
                    document.getElementById('anOrganik').value = '0';
                    document.getElementById('residu').value = '0';
                    document.getElementById('fileOrganik').value = '';
                    document.getElementById('fileAnOrganik').value = '';
                    document.getElementById('fileResidu').value = '';
                    document.getElementById('urlOrganik').value = '';
                    document.getElementById('urlAnOrganik').value = '';
                    document.getElementById('urlResidu').value = '';
                    document.getElementById('previewOrganik').classList.remove('active');
                    document.getElementById('previewAnOrganik').classList.remove('active');
                    document.getElementById('previewResidu').classList.remove('active');
                    document.getElementById('statusOrganik').innerHTML = '';
                    document.getElementById('statusAnOrganik').innerHTML = '';
                    document.getElementById('statusResidu').innerHTML = '';
                    uploadStatus = { organik: { uploading: false, url: '' }, anorganik: { uploading: false, url: '' }, residu: { uploading: false, url: '' } };
                    updateKirimButton();
                    calculateTotal();
                } else {
                    showToast(resp.error || 'Gagal kirim laporan', true);
                }
            } catch(e) { showToast('Gagal mengirim laporan', true); }
            iframe.remove();
            form.remove();
        };
        form.submit();
    }

    function calculateTotal() {
        let o = parseFloat(document.getElementById('organik').value) || 0;
        let a = parseFloat(document.getElementById('anOrganik').value) || 0;
        let r = parseFloat(document.getElementById('residu').value) || 0;
        document.getElementById('totalSampah').innerText = (o + a + r).toFixed(2) + ' Kg';
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('tanggalLaporan').value = new Date().toISOString().slice(0,10);
        document.getElementById('organik').addEventListener('input', calculateTotal);
        document.getElementById('anOrganik').addEventListener('input', calculateTotal);
        document.getElementById('residu').addEventListener('input', calculateTotal);

</script>
